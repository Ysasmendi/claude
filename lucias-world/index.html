      el('div', { class: 'sol' }));
    for (let i = 0; i < 4; i++) d.append(el('div', { class: 'nube', style: {
      top: azar(14, 46) + '%', width: azar(130, 220) + 'px', height: azar(50, 70) + 'px',
      animationDuration: azar(40, 80) + 's', animationDelay: -azar(0, 60) + 's' } }));
  } else if (nombre === 'noche') {
    for (let i = 0; i < 70; i++) d.append(el('div', { class: 'estrellita', style: {
      left: azar(0, 100) + '%', top: azar(0, 100) + '%', fontSize: azar(8, 22) + 'px', animationDelay: -azar(0, 2) + 's' } }, '★'));
    d.append(el('div', { class: 'luna' }), el('div', { class: 'cohete' }, '🚀'));
  } else {
    const opciones = ['var(--rojo)', 'var(--amarillo)', 'var(--azul)', '#fff', '#fff', '#fff'];
    d.append(el('div', { class: 'lego' }, Array.from({ length: 20 }, () => el('div', { style: { background: elegir(opciones) } }))));
  }
}
function cambiarFondo() {
  ponerFondo(FONDOS[(FONDOS.indexOf(fondoActual) + 1) % FONDOS.length]);
  Sonido.pop();
}

function reloj() {
  const d = new Date(), h = d.getHours();
  $('#reloj').textContent = (h >= 7 && h < 20 ? '☀️ ' : '🌙 ') + String(h).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
setInterval(reloj, 10000); reloj();

// Sonido on/off
function pintarMudo() { $('#btnMudo').textContent = Sonido.mudo ? '🔇' : '🔊'; }
Sonido.mudo = leer('mudo') === '1';
pintarMudo();
$('#btnMudo').addEventListener('click', () => { Sonido.init(); Sonido.setMudo(!Sonido.mudo); guardar('mudo', Sonido.mudo ? '1' : '0'); pintarMudo(); Sonido.clic(); });

// Easter egg: pinchar en el escritorio, fuera de las cajas → ¡BOING!
$('#escritorio').addEventListener('pointerdown', e => {
  if (e.target.closest('.icono, #logo')) return;
  Sonido.init();
  Sonido.muelle();
  textoFlotante($('#escritorio'), e.clientX, e.clientY, '¡BOING!');
});
// Easter egg: 3 toques en el reloj → ¡dinosaurio!
let toquesReloj = 0, tReloj = 0;
$('#reloj').addEventListener('click', () => {
  const ahora = Date.now();
  toquesReloj = ahora - tReloj < 700 ? toquesReloj + 1 : 1; tReloj = ahora;
  if (toquesReloj >= 3) { toquesReloj = 0; dinosaurio(); }
});
// Easter egg: 5 toques en el logo → lluvia de estrellas
let toquesLogo = 0, tLogo = 0;
$('#logo').addEventListener('click', () => {
  const ahora = Date.now();
  toquesLogo = ahora - tLogo < 800 ? toquesLogo + 1 : 1; tLogo = ahora;
  Sonido.clic();
  if (toquesLogo >= 5) { toquesLogo = 0; lluvia(['⭐', '🌟', '✨', '💫'], 50); Sonido.fanfarria(); aviso('🌟 ¡Lluvia de estrellas! 🌟'); }
});
// Easter eggs de teclado: código Konami y escribir «lucia»
const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
let teclas = [], letras = '';
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') { cerrarApp(); cerrarMenu(); return; }
  teclas.push(e.key.toLowerCase()); teclas = teclas.slice(-10);
  if (teclas.join() === KONAMI.join()) { teclas = []; modoDisco(); }
  if (e.key.length === 1) {
    letras = (letras + e.key.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')).slice(-5);
    if (letras === 'lucia') { letras = ''; saludoLucia(); }
  }
});
// Desbloquear el audio en el primer toque (necesario en iPad/iPhone)
document.addEventListener('pointerdown', () => { if (Sonido.ctx && Sonido.ctx.state === 'suspended') Sonido.ctx.resume(); });

/* ---------- Apagar y encender ---------- */
function apagar() {
  cerrarMenu(); cerrarApp(true);
  document.body.classList.remove('disco'); $('#bolaDisco')?.remove();
  Sonido.nana();
  Voz.decir('Buenas noches, Lucía', { pitch: 1.2, rate: 0.85 });
  const ap = el('div', { id: 'apagado' }, el('div', { class: 'gran' }, '🌙'), el('p', {}, 'Buenas noches, Lucía'), el('small', {}, 'Toca para despertar ☀️'));
  ap.addEventListener('click', () => { ap.remove(); Sonido.arranque(); aviso('☀️ ¡Buenos días!'); });
  document.body.append(ap);
}

/* ---------- Arranque ---------- */
(function arrancar() {
  letrasDeColores($('#logoArranque'), "Lucía's World");
  montarEscritorio();
  ponerFondo(fondoActual);
  Voz.init();
  const mensajes = ['Inflando globos...', 'Despertando a los dinosaurios...', 'Pintando el arcoíris...', 'Llenando la piscina de bolas...', 'Afinando la estrellita...', 'Buscando calcetines perdidos...', '¡Listo!'];
  let i = 0;
  const barra = $('#barraCarga'), msg = $('#msgCarga');
  const tick = setInterval(() => {
    msg.textContent = mensajes[i];
    barra.style.width = ((i + 1) / mensajes.length * 100) + '%';
    if (++i >= mensajes.length) { clearInterval(tick); $('#btnEmpezar').style.display = 'inline-flex'; }
  }, 380);
  $('#btnEmpezar').addEventListener('click', () => {
    Sonido.init();
    Sonido.arranque();
    $('#arranque').classList.add('fuera');
    setTimeout(() => $('#arranque').remove(), 600);
    Voz.decir('¡Bienvenida al mundo de Lucía!', { pitch: 1.3 });
    programarCaramelos();
  });
})();
</script>
