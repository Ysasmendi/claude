Apps.calculadora = {
  nombre: 'Calculadora', en: 'Calculator', emoji: '🧮', color: 'var(--amarillo)', texto: 'var(--tinta)',
  crear(c) {
    let a = '', op = null, b = '', res = null, igualRepetido = 0;
    const cuenta = el('div', { class: 'cuenta' });
    const dibujo = el('div', { class: 'dibujo' });
    const teclas = el('div', { class: 'teclas' });
    c.append(el('div', { class: 'calc' }, el('div', { class: 'pantalla' }, cuenta, dibujo), teclas));

    const colores = ['', 'rojo', 'azul', 'verde'];
    const tecla = (txt, fn, clase = '', estilo = {}) => teclas.append(el('button', { class: 'btn ' + clase, style: estilo, onclick: () => { Sonido.clic(); fn(); } }, txt));
    [7, 8, 9].forEach((n, i) => tecla(n, () => digito(n), colores[i % 4]));
    tecla('+', () => operar('+'), 'rojo');
    [4, 5, 6].forEach((n, i) => tecla(n, () => digito(n), colores[(i + 1) % 4]));
    tecla('−', () => operar('-'), 'azul');
    [1, 2, 3].forEach((n, i) => tecla(n, () => digito(n), colores[(i + 2) % 4]));
    tecla('=', igual, 'verde', { gridRow: 'span 2' });
    tecla(0, () => digito(0), 'blanco', { gridColumn: 'span 2' });
    tecla('C', borrar, 'blanco');

    function digito(n) {
      if (res !== null) { a = ''; op = null; b = ''; res = null; }
      igualRepetido = 0;
      if (op) { if (b.length < 3) b = (b === '0' ? '' : b) + n; }
      else if (a.length < 3) a = (a === '0' ? '' : a) + n;
      pintar();
    }
    function operar(o) {
      igualRepetido = 0;
      if (res !== null) { a = String(res); b = ''; res = null; }
      if (a === '') a = '0';
      op = o; pintar();
    }
    function borrar() { a = ''; op = null; b = ''; res = null; igualRepetido = 0; pintar(); }
    function igual() {
      if (res !== null) {
        if (++igualRepetido === 4) { aviso(T('😤 ¡Que ya te lo he dicho! Son ', '😤 I already told you! It\'s ') + res); Voz.decir(T('¡Que ya te lo he dicho! ¡Son ', 'I already told you! It\'s ') + res + '!', { pitch: 0.8 }); igualRepetido = 0; }
        return;
      }
      if (!op || b === '') { Sonido.fallo(); return; }
      const x = +a, y = +b;
      res = op === '+' ? x + y : x - y;
      pintar();
      const frase = T(`${x} ${op === '+' ? 'más' : 'menos'} ${y} son ${res}`, `${x} ${op === '+' ? 'plus' : 'minus'} ${y} is ${res}`);
      if (res === 100) { lluvia(['💯', '🎉', '⭐'], 45); aviso(T('💯 ¡CIEN! 💯', '💯 ONE HUNDRED! 💯')); Sonido.fanfarria(); }
      else if (x === 0 && y === 0) { aviso(T('Nada ' + (op === '+' ? 'más' : 'menos') + ' nada... ¡NADA! 🫥', 'Nothing ' + (op === '+' ? 'plus' : 'minus') + ' nothing... NOTHING! 🫥')); }
      else Sonido.exito();
      Voz.decir(frase, { rate: 0.95 });
    }
    function fila(n, emoji, comidas = 0) {
      const g = el('span', { class: 'grupo' });
      for (let i = 0; i < n; i++) g.append(el('span', { class: i >= n - comidas ? 'comida' : '' }, emoji));
      return g;
    }
    function pintar() {
      const sim = op === '+' ? '+' : '−';
      cuenta.replaceChildren(
        a || '0',
        op ? el('span', { class: 'op' }, ' ' + sim + ' ') : '',
        op ? b : '',
        res !== null ? el('span', { class: 'res' }, ' = ' + res) : '');
      dibujo.replaceChildren();
      const x = +(a || 0), y = +(b || 0);
      if (!op) { if (x > 0 && x <= 20) dibujo.append(fila(x, '🍎')); return; }
      if (x > 20 || y > 20) {
        if (res !== null) dibujo.append(el('span', { class: 'frase' }, T('¡Son números muy grandes para dibujarlos! 🐘', 'These numbers are too big to draw! 🐘')));
        return;
      }
      if (op === '+') {
        if (x) dibujo.append(fila(x, '🍎'));
        dibujo.append(el('span', { class: 'signo' }, '+'));
        if (y) dibujo.append(fila(y, '🍌'));
        if (res !== null) dibujo.append(el('span', { class: 'frase' }, T(`Juntamos ${x} ${x === 1 ? 'manzana' : 'manzanas'} y ${y} ${y === 1 ? 'plátano' : 'plátanos'}: ¡${res} frutas! 😋`, `We put together ${x} ${x === 1 ? 'apple' : 'apples'} and ${y} ${y === 1 ? 'banana' : 'bananas'}: ${res} pieces of fruit! 😋`)));
      } else {
        if (res === null) { if (x) dibujo.append(fila(x, '🍪')); dibujo.append(el('span', { class: 'signo' }, '−'), y ? fila(y, '😋') : ''); }
        else if (res >= 0) {
          dibujo.append(fila(x, '🍪', y));
          dibujo.append(el('span', { class: 'frase' }, T(`Tenías ${x} galletas, te comes ${y}... ¡quedan ${res}! 🍪`, `You had ${x} biscuits, you eat ${y}... ${res} left! 🍪`)));
        } else {
          dibujo.append(fila(x, '🍪', x));
          dibujo.append(el('span', { class: 'frase' }, T(`¡Solo había ${x} galletas! Te faltan ${-res}. Eso es un número negativo: como deber ${-res} ${res === -1 ? 'galleta' : 'galletas'}. 🙈`, `There were only ${x} biscuits! You are ${-res} short. That\'s a negative number: like owing ${-res} ${res === -1 ? 'biscuit' : 'biscuits'}. 🙈`)));
        }
      }
    }
    pintar();
  }
};

      const sig = el('button', { class: 'btn azul', 'aria-label': T('Página siguiente', 'Next page'), onclick: () => ir(n + 1) }, '➡️');
      const solo = el('button', { class: 'btn mini blanco', onclick: () => { leerSolo = !leerSolo; solo.textContent = textoSolo(); } }, textoSolo());
      c.replaceChildren(el('div', { class: 'pagina' },
        el('div', { class: 'pagina-cab' },
          el('button', { class: 'btn mini', onclick: estante }, T('📚 Otros cuentos', '📚 More stories')),
          el('b', { class: 'pagina-titulo' }, cu.em + ' ' + T(cu.titulo, cu.en)),
          solo),
        escena, texto,
        el('div', { class: 'mandos' }, ant, el('button', { class: 'btn rojo', onclick: leer }, T('🔊 Leer', '🔊 Read')), sig),
        puntos));
      function leer() { Voz.decir(T(cu.paginas[n][1], cu.paginas[n][2]), { rate: 0.92, pitch: 1.1 }); }
      function ir(i) {
        if (i < 0) return;
        if (i >= cu.paginas.length) { lluvia(['⭐', '📖', '💖'], 25); Sonido.fanfarria(); estante(); return; }
        n = i;
        Sonido.barrido(400, 800, 0.12, { onda: 'triangle', vol: 0.2 });
        escena.textContent = cu.paginas[n][0];
        escena.style.animation = 'none'; void escena.offsetWidth; escena.style.animation = '';
        texto.textContent = T(cu.paginas[n][1], cu.paginas[n][2]);
        ant.disabled = n === 0;
        sig.textContent = n === cu.paginas.length - 1 ? T('🏁 Fin', '🏁 The end') : '➡️';
        puntos.replaceChildren(...cu.paginas.map((_, k) => el('i', { class: k === n ? 'on' : '' })));
        if (leerSolo) leer(); else Voz.callar();
      }
      ir(0);
    }
    estante();
  }
};

// Dibuja una marioneta (o un grupo pequeño) como SVG a partir de su ficha
function munecoSVG(ficha) {
  let dentro;
  if (ficha.grupo) {
    const n = ficha.grupo, esc = n === 2 ? 0.74 : 0.62, paso = (200 - 200 * esc) / (n - 1);
    dentro = '';
    for (let i = 0; i < n; i++) {
      const una = { ...ficha, grupo: 0, ropa: (ficha.ropas || [])[i] || ficha.ropa };
      dentro += `<g transform="translate(${(i * paso).toFixed(1)} ${(250 * (1 - esc)).toFixed(1)}) scale(${esc})">${partesMuneco(una, i)}</g>`;
    }
  } else dentro = partesMuneco(ficha, 0);
  return `<svg class="muppet" viewBox="-20 -70 240 320" aria-hidden="true">${dentro}</svg>`;
}
function partesMuneco(s, semilla) {
  const [rx, ry] = { redonda: [66, 62], alargada: [56, 72], ancha: [76, 58] }[s.forma || 'redonda'];
  const cx = 100, cy = 100, piel = s.piel, ropa = s.ropa || '#1F5FD6';
  const ojos = { tam: 16, sep: 25, parpado: false, ...(s.ojos || {}) };
  const ey = cy - 20, ex = s.extra || [], sc = s.sombreroColor || '#E63027';
  const L = `stroke="${TINTA}" stroke-width="4" stroke-linejoin="round"`;
  const espejo = (f) => f(-1) + f(1);
  let svg = '';

  // --- Detrás de la cabeza: orejas, capucha y trenzas ---
  if (s.sombrero === 'capucha') svg += `<ellipse cx="${cx}" cy="${cy + 10}" rx="${rx + 22}" ry="${ry + 24}" fill="${sc}" ${L}/>`;
  if (s.pelo && s.pelo.tipo === 'trenzas') svg += espejo(d => [0, 1, 2].map(i =>
    `<circle cx="${cx + d * (rx + 6)}" cy="${cy + 12 + i * 22}" r="13" fill="${s.pelo.color}" ${L}/>`).join('') +
    `<path d="M${cx + d * (rx + 6) - 10} ${cy + 78} l20 0 l-10 12 z" fill="${TINTA}"/>`);
  const o = s.orejas, oc = s.orejaColor || piel;
  if (o === 'cerdo') svg += espejo(d => `<path d="M${cx + d * 40} ${cy - 46} L${cx + d * 70} ${cy - 84} L${cx + d * 66} ${cy - 30} Z" fill="${piel}" ${L}/><path d="M${cx + d * 50} ${cy - 50} L${cx + d * 64} ${cy - 70} L${cx + d * 62} ${cy - 44} Z" fill="${oscurecer(piel, .82)}"/>`);
  if (o === 'oso') svg += espejo(d => `<circle cx="${cx + d * rx * .72}" cy="${cy - ry * .78}" r="22" fill="${piel}" ${L}/><circle cx="${cx + d * rx * .72}" cy="${cy - ry * .78}" r="11" fill="${s.hocico || oscurecer(piel, .8)}"/>`);
  if (o === 'lobo' || o === 'gato') {
    const alto = o === 'lobo' ? 108 : 92;
    svg += espejo(d => `<path d="M${cx + d * 18} ${cy - ry + 14} L${cx + d * 52} ${cy - alto} L${cx + d * 56} ${cy - 30} Z" fill="${piel}" ${L}/><path d="M${cx + d * 28} ${cy - ry + 14} L${cx + d * 48} ${cy - alto + 22} L${cx + d * 50} ${cy - 40} Z" fill="${o === 'gato' ? '#FFB3C7' : oscurecer(piel, .78)}"/>`);
  }
  if (o === 'raton') svg += espejo(d => `<circle cx="${cx + d * rx * .82}" cy="${cy - ry * .7}" r="32" fill="${piel}" ${L}/><circle cx="${cx + d * rx * .82}" cy="${cy - ry * .7}" r="19" fill="#FFB3C7"/>`);
  if (o === 'burro') svg += espejo(d => `<ellipse cx="${cx + d * 34}" cy="${cy - ry - 26}" rx="15" ry="44" transform="rotate(${d * 18} ${cx + d * 34} ${cy - ry - 26})" fill="${piel}" ${L}/><ellipse cx="${cx + d * 34}" cy="${cy - ry - 26}" rx="7" ry="30" transform="rotate(${d * 18} ${cx + d * 34} ${cy - ry - 26})" fill="#FFB3C7"/>`);

  // --- Cuerpo con brazos y manos ---
  svg += espejo(d => `<path d="M${cx + d * 38} 188 Q${cx + d * 62} 205 ${cx + d * 64} 236" fill="none" stroke="${TINTA}" stroke-width="27" stroke-linecap="round"/><path d="M${cx + d * 38} 188 Q${cx + d * 62} 205 ${cx + d * 64} 236" fill="none" stroke="${ropa}" stroke-width="19" stroke-linecap="round"/><circle cx="${cx + d * 64}" cy="240" r="12" fill="${piel}" ${L}/>`);
  svg += `<path d="M58 180 Q100 164 142 180 L160 262 L40 262 Z" fill="${ropa}" ${L}/><path d="M80 174 Q100 192 120 174" fill="none" stroke="${oscurecer(ropa === '#FFFFFF' ? '#D9D9E0' : ropa, .72)}" stroke-width="6" stroke-linecap="round"/>`;

  // --- Cabeza de fieltro con un brillo suave ---
  svg += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${piel}" ${L}/>`;
  svg += `<ellipse cx="${cx - rx * .35}" cy="${cy - ry * .5}" rx="${rx * .32}" ry="${ry * .18}" fill="#fff" opacity=".18"/>`;
  if (o === 'perro') svg += espejo(d => `<ellipse cx="${cx + d * (rx - 4)}" cy="${cy + 2}" rx="19" ry="46" transform="rotate(${d * -12} ${cx + d * (rx - 4)} ${cy + 2})" fill="${oc}" ${L}/>`);

  // --- Pelo ---
  const p = s.pelo;
  if (p && (p.tipo === 'liso' || p.tipo === 'trenzas' || p.tipo === 'moño')) {
    svg += `<path d="M${cx - rx - 3} ${cy - 4} C${cx - rx} ${cy - ry - 34} ${cx + rx} ${cy - ry - 34} ${cx + rx + 3} ${cy - 4} Q${cx + rx * .55} ${cy - ry * .72} ${cx + 6} ${cy - ry * .62} Q${cx - rx * .3} ${cy - ry * .8} ${cx - rx - 3} ${cy - 4} Z" fill="${p.color}" ${L}/>`;
    if (p.tipo === 'moño') svg += `<circle cx="${cx}" cy="${cy - ry - 16}" r="22" fill="${p.color}" ${L}/>`;
  }
  if (p && p.tipo === 'rizos') {
    for (let a = 160; a <= 380; a += 22) {
      const r = a * Math.PI / 180;
      svg += `<circle cx="${(cx + (rx + 2) * Math.cos(r)).toFixed(1)}" cy="${(cy + (ry + 2) * Math.sin(r) - 4).toFixed(1)}" r="17" fill="${p.color}" ${L}/>`;
    }
  }
  if (p && p.tipo === 'pelusa') svg += `<path d="M${cx - 18} ${cy - ry + 8} Q${cx - 26} ${cy - ry - 24} ${cx - 8} ${cy - ry - 14} Q${cx} ${cy - ry - 34} ${cx + 8} ${cy - ry - 14} Q${cx + 26} ${cy - ry - 24} ${cx + 18} ${cy - ry + 8} Z" fill="${p.color}" ${L}/>`;

  // --- Barba (debajo de la boca) ---
  if (ex.includes('barba')) svg += `<path d="M${cx - rx + 10} ${cy + 4} Q${cx - rx + 2} ${cy + ry + 30} ${cx} ${cy + ry + 38} Q${cx + rx - 2} ${cy + ry + 30} ${cx + rx - 10} ${cy + 4} Q${cx} ${cy + 26} ${cx - rx + 10} ${cy + 4} Z" fill="${s.barbaColor || '#4A2E15'}" ${L}/>`;

  // --- Boca (se abre al hablar) ---
  const hocico = s.nariz === 'hocico';
  const my = hocico ? cy + 40 : cy + 34, mrx = s.forma === 'ancha' ? 44 : s.nariz === 'pico' ? 24 : 36;
  svg += `<g class="boca"><ellipse cx="${cx}" cy="${my}" rx="${mrx}" ry="20" fill="#5A0F1E" ${L}/><ellipse cx="${cx}" cy="${my + 10}" rx="${mrx * .5}" ry="8" fill="#FF6F91"/></g>`;
  if (ex.includes('colmillosArriba')) svg += espejo(d => `<path d="M${cx + d * mrx * .6 - 6} ${my + 16} L${cx + d * mrx * .6 + 6} ${my + 16} L${cx + d * mrx * .6} ${my - 8} Z" fill="#fff" ${L}/>`);

  // --- Antifaz, ojos de ping-pong, gafas y cejas ---
  if (ex.includes('antifaz')) svg += `<rect x="${cx - ojos.sep - 30}" y="${ey - 17}" width="${2 * (ojos.sep + 30)}" height="34" rx="16" fill="${TINTA}"/>`;
  svg += espejo(d => {
    const x = cx + d * ojos.sep, t = ojos.tam, px = x - d * t * .22, py = ey + t * .15;
    let e = `<circle cx="${x}" cy="${ey}" r="${t}" fill="#fff" ${L}/><circle cx="${px}" cy="${py}" r="${t * .42}" fill="${TINTA}"/><circle cx="${px + 3}" cy="${py - 3}" r="2.6" fill="#fff"/>`;
    if (ojos.parpado) e += `<path d="M${x - t - 1} ${ey} A${t + 1} ${t + 1} 0 0 1 ${x + t + 1} ${ey} Z" fill="${piel}" ${L}/>`;
    e += `<circle class="parpado" cx="${x}" cy="${ey}" r="${t + 2}" fill="${piel}" style="--d:${(semilla * 1.3 + (d + 1)) % 4}s"/>`;
    if (ex.includes('gafas')) e += `<circle cx="${x}" cy="${ey}" r="${t + 7}" fill="none" stroke="${TINTA}" stroke-width="4"/>`;
    if (ex.includes('cejas')) e += `<path d="M${x + d * 18} ${ey - t - 14} L${x - d * 12} ${ey - t - 3}" stroke="${TINTA}" stroke-width="7" stroke-linecap="round"/>`;
    return e;
  });
  if (ex.includes('gafas')) svg += `<path d="M${cx - ojos.sep + ojos.tam + 7} ${ey} L${cx + ojos.sep - ojos.tam - 7} ${ey}" stroke="${TINTA}" stroke-width="4"/>`;

  // --- Nariz (hocico, pico, bola...) ---
  const nc = s.narizColor || '#FF8A1F';
  if (s.nariz === 'bola') svg += `<circle cx="${cx}" cy="${cy + 8}" r="14" fill="${nc}" ${L}/><circle cx="${cx - 4}" cy="${cy + 3}" r="4" fill="#fff" opacity=".6"/>`;
  if (s.nariz === 'cerdo') svg += `<ellipse cx="${cx}" cy="${cy + 6}" rx="24" ry="17" fill="${oscurecer(piel, .88)}" ${L}/>` + espejo(d => `<ellipse cx="${cx + d * 8}" cy="${cy + 6}" rx="4" ry="7" fill="${oscurecer(piel, .6)}"/>`);
  if (hocico) svg += `<ellipse cx="${cx}" cy="${cy + 20}" rx="34" ry="24" fill="${s.hocico}" ${L}/><ellipse cx="${cx}" cy="${cy + 6}" rx="14" ry="10" fill="${TINTA}"/><circle cx="${cx - 4}" cy="${cy + 3}" r="3" fill="#fff" opacity=".7"/>`;
  if (s.nariz === 'pico') svg += `<path d="M${cx - 22} ${cy + 4} Q${cx} ${cy - 8} ${cx + 22} ${cy + 4} L${cx} ${cy + 30} Z" fill="#FF8A1F" ${L}/>`;
  if (s.nariz === 'larga') svg += `<path d="M${cx - 9} ${ey + 12} Q${cx - 8} ${cy + 30} ${cx + 20} ${cy + 32} Q${cx + 12} ${cy + 16} ${cx + 9} ${ey + 12} Z" fill="${oscurecer(piel, .9)}" ${L}/>`;
  if (s.nariz === 'raton') svg += `<circle cx="${cx}" cy="${cy + 6}" r="10" fill="${s.narizColor || '#FF5FA2'}" ${L}/>`;
  if (ex.includes('verruga')) svg += `<circle cx="${cx + 16}" cy="${cy + 24}" r="5" fill="${oscurecer(piel, .7)}"/>`;
  if (ex.includes('bigotes')) svg += espejo(d => [-8, 0, 8].map(dy => `<path d="M${cx + d * 16} ${cy + 8 + dy / 2} L${cx + d * 52} ${cy + 2 + dy * 1.4}" stroke="${TINTA}" stroke-width="3" stroke-linecap="round"/>`).join(''));
  if (ex.includes('colmillos')) svg += espejo(d => `<path d="M${cx + d * 16 - 6} ${cy + 40} L${cx + d * 16 + 6} ${cy + 40} L${cx + d * 16} ${cy + 55} Z" fill="#fff" ${L}/>`);
  if (ex.includes('mejillas')) svg += espejo(d => `<circle cx="${cx + d * rx * .66}" cy="${cy + 16}" r="12" fill="#FF5FA2" opacity=".35"/>`);
  if (ex.includes('pecas')) svg += espejo(d => [[0, 0], [8, 6], [-6, 8]].map(([a, b]) => `<circle cx="${cx + d * (rx * .5 + a)}" cy="${cy + 8 + b}" r="2.4" fill="#A0522D"/>`).join(''));

  // --- Sombreros y adornos (encima de todo) ---
  if (s.sombrero === 'bruja') svg += `<ellipse cx="${cx}" cy="${cy - ry + 12}" rx="${rx + 28}" ry="13" fill="${sc}" ${L}/><path d="M${cx - 44} ${cy - ry + 8} L${cx + 26} ${cy - ry - 104} L${cx + 44} ${cy - ry + 8} Z" fill="${sc}" ${L}/><path d="M${cx - 40} ${cy - ry - 4} L${cx + 41} ${cy - ry - 4} L${cx + 39} ${cy - ry + 6} L${cx - 42} ${cy - ry + 6} Z" fill="#8B3FD9"/>`;

  if (s.sombrero === 'gorro') svg += `<path d="M${cx - rx + 2} ${cy - ry * .42} Q${cx} ${cy - ry - 52} ${cx + rx - 2} ${cy - ry * .42} Z" fill="${sc}" ${L}/><path d="M${cx - rx + 2} ${cy - ry * .42} Q${cx} ${cy - ry * .62} ${cx + rx - 2} ${cy - ry * .42}" fill="none" stroke="#fff" stroke-width="8"/><circle cx="${cx}" cy="${cy - ry - 34}" r="14" fill="#fff" ${L}/>`;
  if (s.sombrero === 'gorra') svg += `<path d="M${cx - rx + 6} ${cy - ry * .45} Q${cx} ${cy - ry - 42} ${cx + rx - 6} ${cy - ry * .45} Z" fill="${sc}" ${L}/><ellipse cx="${cx + 34}" cy="${cy - ry * .45}" rx="42" ry="10" fill="${sc}" ${L}/>`;
  if (s.sombrero === 'corona') svg += `<path d="M${cx - 40} ${cy - ry + 12} L${cx - 40} ${cy - ry - 30} L${cx - 20} ${cy - ry - 8} L${cx} ${cy - ry - 40} L${cx + 20} ${cy - ry - 8} L${cx + 40} ${cy - ry - 30} L${cx + 40} ${cy - ry + 12} Z" fill="${sc}" ${L}/><circle cx="${cx}" cy="${cy - ry - 4}" r="6" fill="#E63027"/>`;
  if (s.sombrero === 'cresta') svg += `<circle cx="${cx - 20}" cy="${cy - ry - 2}" r="14" fill="${sc}" ${L}/><circle cx="${cx + 20}" cy="${cy - ry - 2}" r="14" fill="${sc}" ${L}/><circle cx="${cx}" cy="${cy - ry - 14}" r="18" fill="${sc}" ${L}/>`;
  if (s.sombrero === 'lazo') {
    const bx = cx + rx * .55, by = cy - ry * .78;
    svg += `<path d="M${bx} ${by} L${bx - 28} ${by - 18} L${bx - 28} ${by + 18} Z" fill="${sc}" ${L}/><path d="M${bx} ${by} L${bx + 28} ${by - 18} L${bx + 28} ${by + 18} Z" fill="${sc}" ${L}/><circle cx="${bx}" cy="${by}" r="8" fill="${sc}" ${L}/>`;
  }
  return svg;
}

    function ponerModo(m) { modo = m; marcar(); Sonido.clic(); }
    function marcar() {
      btnColores.forEach((b, i) => b.classList.toggle('sel', COLORES[i] === color && modo === 'pincel'));
      btnGrosor.forEach((b, i) => b.classList.toggle('sel', [6, 16, 36][i] === grosor));

    const ctx = cv.getContext('2d');

    const ro = new ResizeObserver(() => {
      if (!lienzo.clientWidth) return;

      copia.width = cv.width; copia.height = cv.height;

      dpr = Math.min(2, window.devicePixelRatio || 1); W = lienzo.clientWidth; H = lienzo.clientHeight;

/* =========================================================
   APP: Hoja de chuches — una hoja de cálculo donde solo se pintan chuches.
   Consonante → caramelo, vocal → chocolate, número → estrella.
   ========================================================= */
Apps.hoja = {
  nombre: 'Hoja de chuches', en: 'Sweetie Sheet', emoji: '🍬', color: 'var(--verde)',
  crear(c) {
    const COLS = 'ABCDEFGH', NF = 10, N = COLS.length * NF;
    const TIPOS = { caramelo: { em: '🍬', f: T('CARAMELO', 'CANDY') }, estrella: { em: '⭐', f: T('ESTRELLA', 'STAR') }, chocolate: { em: '🍫', f: 'CHOCOLATE' } };
    const tipoDe = ch => {
      const l = ch.toLowerCase();
      if (/[0-9]/.test(l)) return 'estrella';
      if ('aeiouáéíóúü'.includes(l)) return 'chocolate';
      if (/\p{L}/u.test(l)) return 'caramelo';
      return null;
    };
    let datos = Array(N).fill(null);
    try { const g = JSON.parse(leer('hoja') || 'null'); if (Array.isArray(g) && g.length === N) datos = g; } catch (e) {}
    let sel = 0, escrito = '', empacho = false;
    const filasCelebradas = new Set();
    // Un carácter invisible dentro del campo permite detectar «borrar» también en el teclado del iPad
    const CENT = '​';

    const ref = el('span', { class: 'ref' }, 'A1');
    const valor = el('span', { class: 'valor' });
    const entrada = el('input', { class: 'hoja-entrada', type: 'text', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': T('Escribe en la hoja', 'Type on the sheet') });
    const tabla = el('table', { class: 'hoja-tabla' });
    const wrap = el('div', { class: 'tabla-wrap' }, tabla, entrada);
    const celdas = [], cabCols = [], cabFilas = [];
    const cabeza = el('tr', {}, el('th'));
    for (const l of COLS) { const th = el('th', {}, l); cabCols.push(th); cabeza.append(th); }
    const cuerpo = el('tbody');
    for (let f = 0; f < NF; f++) {
      const th = el('th', {}, f + 1); cabFilas.push(th);
      const tr = el('tr', {}, th);
      for (let k = 0; k < COLS.length; k++) {
        const i = f * COLS.length + k;
        const td = el('td');
        td.addEventListener('click', () => { seleccionar(i); enfocar(); });
        celdas.push(td); tr.append(td);
      }
      cuerpo.append(tr);
    }
    tabla.append(el('thead', {}, cabeza), cuerpo);

    const cuentas = {};
    const totales = el('div', { class: 'totales' }, Object.entries(TIPOS).map(([t, { em }]) => {
      cuentas[t] = el('b', {}, '0');
      return el('div', { class: 'total' }, el('span', { style: { fontSize: '30px' } }, em), el('code', {}, T(`=CONTAR(${em})`, `=COUNT(${em})`)), cuentas[t]);
    }));
    let confirmar = false;
    const btnVaciar = el('button', { class: 'btn mini rojo', onclick: () => {
      if (!confirmar) {
        confirmar = true; btnVaciar.textContent = T('¿Seguro? Toca otra vez', 'Sure? Tap again');
        setTimeout(() => { confirmar = false; btnVaciar.textContent = T('🗑️ Vaciar hoja', '🗑️ Clear sheet'); }, 3000);
        return;
      }
      confirmar = false; btnVaciar.textContent = T('🗑️ Vaciar hoja', '🗑️ Clear sheet');
      datos.fill(null); datos.forEach((_, i) => pintarCelda(i)); recontar(); guardarHoja(); seleccionar(0); enfocar();
      Sonido.barrido(900, 120, 0.4, { onda: 'triangle', vol: 0.25 });
    } }, T('🗑️ Vaciar hoja', '🗑️ Clear sheet'));

    c.append(el('div', { class: 'hoja' },
      el('div', { class: 'hoja-barra' },
        el('div', { class: 'leyenda' }, el('span', {}, 'B, C, D… → 🍬'), el('span', {}, 'A, E, I, O, U → 🍫'), el('span', {}, '1, 2, 3… → ⭐')),
        el('button', { class: 'btn mini', onclick: () => enfocar() }, T('⌨️ Escribir', '⌨️ Type')),
        btnVaciar),
      el('div', { class: 'formula' }, ref, el('span', { class: 'fx' }, 'fx'), valor),
      el('div', { class: 'hoja-cuerpo' }, wrap, totales)));

    function enfocar() { try { entrada.focus({ preventScroll: true }); } catch (e) { entrada.focus(); } }
    function guardarHoja() { guardar('hoja', JSON.stringify(datos)); }
    function pintarCelda(i, animar = false) {
      const v = datos[i];
      celdas[i].replaceChildren(v ? el('span', { class: animar ? 'pinta' : '' }, TIPOS[v.t].em) : '');
    }
    function recontar() {
      for (const t in TIPOS) cuentas[t].textContent = datos.filter(v => v && v.t === t).length;
    }
    function seleccionar(i) {
      sel = (i + N) % N;
      const col = sel % COLS.length, fila = Math.floor(sel / COLS.length);
      celdas.forEach((td, k) => td.classList.toggle('sel', k === sel));
      cabCols.forEach((th, k) => th.classList.toggle('marca', k === col));
      cabFilas.forEach((th, k) => th.classList.toggle('marca', k === fila));
      ref.textContent = COLS[col] + (fila + 1);
      const v = datos[sel];
      valor.textContent = v ? `=${TIPOS[v.t].f}("${v.ch}")` : '';
      // El campo invisible va encima de la celda para que el iPad no salte a otro sitio
      const rw = wrap.getBoundingClientRect(), rc = celdas[sel].getBoundingClientRect();
      entrada.style.left = (rc.left - rw.left + wrap.scrollLeft) + 'px';
      entrada.style.top = (rc.top - rw.top + wrap.scrollTop) + 'px';
    }
    function poner(i, v) { datos[i] = v; pintarCelda(i, !!v); recontar(); guardarHoja(); }
    function escribir(ch) {
      if (ch === ' ') { poner(sel, null); seleccionar(sel + 1); return; }
      const t = tipoDe(ch);
      if (!t) return;
      const i = sel;
      poner(i, { t, ch });
      Sonido.chuche(t);
      seleccionar(i + 1);
      sorpresas(ch, i);
    }
    function borrarAtras() { seleccionar(sel - 1); poner(sel, null); seleccionar(sel); Sonido.clic(); }
    function sorpresas(ch, i) {
      escrito = (escrito + ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')).slice(-5);
      if (escrito === 'lucia') {
        escrito = '';
        lluvia(['👑', '🍬', '🍫'], 40);
        aviso('👑 L-U-C-Í-A = 🍬🍫🍬🍫🍫');
        Voz.decir(T('¡Lucía! ¡Dulce como un caramelo!', 'Lucía! Sweet as a candy!'), { pitch: 1.4 });
      }
      const fila = Math.floor(i / COLS.length), desde = fila * COLS.length;
      const llenaDeEstrellas = datos.slice(desde, desde + COLS.length).every(v => v && v.t === 'estrella');
      if (llenaDeEstrellas && !filasCelebradas.has(fila)) {
        filasCelebradas.add(fila);
        lluvia(['⭐', '🌟', '✨'], 40); aviso(T('⭐ ¡Fila de estrellas! ⭐', '⭐ A row of stars! ⭐')); Sonido.exito();
      } else if (!llenaDeEstrellas) filasCelebradas.delete(fila);
      const todoChocolate = datos.every(v => v && v.t === 'chocolate');
      if (todoChocolate && !empacho) {
        empacho = true;
        lluvia(['🍫', '🤢'], 45); aviso(T('🤢 ¡Empacho de chocolate!', '🤢 Too much chocolate!'));
        Voz.decir(T('¡Uf! ¡Empacho de chocolate!', 'Ugh! Too much chocolate!'), { pitch: 0.9 });
      } else if (!todoChocolate) empacho = false;
    }

    entrada.value = CENT;
    entrada.addEventListener('input', () => {
      const v = entrada.value;
      if (!v.includes(CENT) && v.length === 0) borrarAtras();
      else for (const ch of v.replace(CENT, '')) escribir(ch);
      entrada.value = CENT;
      try { entrada.setSelectionRange(1, 1); } catch (e) {}
    });
    entrada.addEventListener('keydown', e => {
      const ancho = COLS.length;
      const mov = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: ancho, ArrowUp: -ancho, Tab: 1 }[e.key];
      if (mov) { e.preventDefault(); seleccionar(sel + mov); }
      else if (e.key === 'Enter') { e.preventDefault(); seleccionar((Math.floor(sel / ancho) + 1) * ancho); }
      else if (e.key === 'Delete') { e.preventDefault(); poner(sel, null); seleccionar(sel); }
      else if (e.key === 'Escape') cerrarApp();
    });

    datos.forEach((_, i) => pintarCelda(i));
    recontar();
    requestAnimationFrame(() => seleccionar(0));
    enfocar();
    return { cerrar() { entrada.blur(); } };
  }
};

    const tecla = { arriba: false, abajo: false, izq: false, der: false };

    const cv = el('canvas');
    const escena = el('div', { class: 'doom-escena' }, cv, el('div', { class: 'doom-ayuda' }, T('⬆️⬇️⬅️➡️ moverse · espacio: disparar', '⬆️⬇️⬅️➡️ move · space: shoot')));
    const cara = el('div', { class: 'hud-caja hud-cara' }, '😃');
    const marcador = el('b', {}, '0');
    const bEst = el('button', { class: 'btn sel', title: T('Estrellas (tecla 1)', 'Stars (key 1)'), onclick: () => elegirMunicion('estrella') }, '⭐');
    const bCar = el('button', { class: 'btn blanco', title: T('Caramelos (tecla 2)', 'Sweets (key 2)'), onclick: () => elegirMunicion('caramelo') }, '🍬');
    let musica = Sonido.metalEstrellita();
    const bMusica = el('button', { class: 'btn sel', title: T('Música', 'Music'), onclick: () => {
      if (musica) { musica.parar(); musica = null; } else musica = Sonido.metalEstrellita();
      bMusica.className = 'btn ' + (musica ? 'sel' : 'blanco');
      bMusica.textContent = musica ? '🎸' : '🔇';
    } }, '🎸');
    // Cruceta táctil: mantener pulsado para andar
    const flecha = (dir, txt, area) => {
      const b = el('button', { class: 'btn blanco', style: { gridArea: area }, 'aria-label': dir }, txt);
      const on = e => { e.preventDefault(); tecla[dir] = true; mira.fija = true; };
      const off = () => { tecla[dir] = false; };
      b.addEventListener('pointerdown', on);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, off));
      return b;
    };
    const cruceta = el('div', { class: 'cruceta' },
      flecha('arriba', '▲', 'a'), flecha('izq', '◀', 'i'), flecha('der', '▶', 'd'), flecha('abajo', '▼', 'b'));
    const bDisparo = el('button', { class: 'btn rojo disparo', onclick: () => dispararMira() }, T('🏷️ ¡Pum!', '🏷️ Fire!'));
    c.append(el('div', { class: 'doom' }, escena, el('div', { class: 'doom-hud' },
      el('div', { class: 'hud-caja' }, el('small', {}, T('MOVER', 'MOVE')), cruceta),
      el('div', { class: 'hud-caja' }, el('small', {}, T('MUNICIÓN', 'AMMO')), el('div', { class: 'hud-botones' }, bEst, bCar)),
      cara,
      el('div', { class: 'hud-caja' }, el('small', {}, T('ETIQUETADO', 'LABELLED')), marcador),
      el('div', { class: 'hud-caja' }, el('small', {}, T('MÚSICA', 'MUSIC')), el('div', { class: 'hud-botones' }, bMusica)),
      el('div', { class: 'hud-caja' }, el('small', {}, T('DISPARO', 'SHOOT')), bDisparo))));

    function elegirMunicion(m) {
      municion = m;
      bEst.className = 'btn ' + (m === 'estrella' ? 'sel' : 'blanco');
      bCar.className = 'btn ' + (m === 'caramelo' ? 'sel' : 'blanco');
      Sonido.clic();
    }
    function ponerCara(em, ms) { cara.textContent = em; tCara = performance.now() + ms; }

    const ctx = cv.getContext('2d');
    let W = 0, H = 0, dpr = 1, avance = 0, reloj = 0, proxima = 0.2, retro = 0, camX = 0, pasos = 0, andando = 0;
    let boca = { x: 0, y: 0 };
    const cosas = [], balas = [], marcas = [];
    // Mira: con ratón sigue al puntero; con teclado o cruceta queda fija en el centro
    const mira = { x: 0, y: 0, ver: false, fija: false };
    const ro = new ResizeObserver(() => {
      if (!escena.clientWidth) return;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = escena.clientWidth; H = escena.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    });
    ro.observe(escena);

    // Perspectiva: el suelo está a OJO por debajo de la vista; z es la distancia
    const OJO = 0.5, TECHO = 1.6, PARED = 1.25;
    const balanceo = () => Math.sin(pasos * 9) * 4 * andando;
    const hz = () => H * 0.42 + balanceo(), F = () => H * 0.9;
    const px = (x, z) => W / 2 + F() * (x - camX) / z;
    const py = (alto, z) => hz() + F() * (OJO - alto) / z;
    const centroMira = () => ({ x: W / 2, y: H * 0.42 + H * 0.08 });

    function nuevaCosa() {
      const jefe = !cosas.some(o => o.jefe) && Math.random() < 0.1;
      const [e, nEs, nEn, alto] = jefe ? ['🧑‍💼', 'Jefe', 'Boss', 0.62] : elegir(COSAS);
      cosas.push({ e, n: T(nEs, nEn), alto, x: camX + azar(-0.85, 0.85), z: 8, jefe, fase: azar(0, 6), pegatinas: [], bote: 0, huye: false });
    }
    function caja(o) {
      const s = F() / o.z, base = py(0, o.z), x = px(o.x, o.z);
      if (o.e === 'mesa') { const w = s * 0.95, h = s * 0.45; return { x: x - w / 2, y: base - h, w, h, s, base, cx: x }; }
      const h = s * o.alto;
      return { x: x - h * 0.55, y: base - h, w: h * 1.1, h, s, base, cx: x };
    }
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function cuad(p, color) {
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
      for (let k = 2; k < p.length; k += 2) ctx.lineTo(p[k], p[k + 1]);
      ctx.closePath(); ctx.fill();
    }
    function pegatina(x, y, tam, tipo, alfa = 1) {
      if (tam < 1) return;
      ctx.save(); ctx.globalAlpha = alfa; ctx.translate(x, y); ctx.rotate(-0.15);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1B1B2F'; ctx.lineWidth = Math.max(1, tam * 0.08);
      rr(-tam * 0.7, -tam * 0.55, tam * 1.4, tam * 1.1, tam * 0.25); ctx.fill(); ctx.stroke();
      ctx.font = `${tam * 0.8}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(MUNI[tipo], 0, tam * 0.05);
      ctx.restore();
    }
    const modulo = (a, m) => ((a % m) + m) % m;

    function dibujarPasillo() {
      // zc muy cerca: así las paredes llegan siempre hasta el borde de la pantalla
      const zc = 0.08, zl = 40;
      ctx.fillStyle = '#D9D9E0'; ctx.fillRect(0, 0, W, hz());
      ctx.fillStyle = '#5B6B8C'; ctx.fillRect(0, hz(), W, H - hz());
      // Moqueta: franjas que se mueven al andar
      ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 2;
      for (let k = 0; k < 30; k++) {
        const z = k + 1 - modulo(avance, 1); if (z < zc) continue;
        const y = py(0, z); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      for (let k = 0; k < 14; k++) {
        const z1 = k * 3 + 1.5 - modulo(avance, 3), z2 = z1 + 0.9; if (z1 < 0.35) continue;
        cuad([px(-0.35, z1), py(TECHO, z1), px(0.35, z1), py(TECHO, z1), px(0.35, z2), py(TECHO, z2), px(-0.35, z2), py(TECHO, z2)], '#FFFDE7');
      }
      for (const lado of [-1, 1]) {
        const X = lado * PARED;
        cuad([px(X, zc), py(TECHO, zc), px(X, zl), py(TECHO, zl), px(X, zl), py(0, zl), px(X, zc), py(0, zc)], lado < 0 ? '#EDE6D3' : '#E3DBC4');
        for (let k = 0; k < 9; k++) {
          const z1 = k * 5 + (lado < 0 ? 2 : 4.5) - modulo(avance, 5), z2 = z1 + 0.9; if (z1 < zc) continue;
          cuad([px(X, z1), py(0, z1), px(X, z1), py(1.05, z1), px(X, z2), py(1.05, z2), px(X, z2), py(0, z2)], '#1F5FD6');
        }
        ctx.strokeStyle = 'rgba(27,27,47,.25)';
        for (let k = 0; k < 20; k++) {
          const z = k * 2 + 1 - modulo(avance, 2); if (z < zc) continue;
          ctx.lineWidth = Math.max(1, 6 / z);
          ctx.beginPath(); ctx.moveTo(px(X, z), py(TECHO, z)); ctx.lineTo(px(X, z), py(0, z)); ctx.stroke();
        }
      }
      ctx.fillStyle = '#C9BFA3';
      ctx.fillRect(px(-PARED, zl), py(TECHO, zl), px(PARED, zl) - px(-PARED, zl), py(0, zl) - py(TECHO, zl));
    }
    function dibujarCosa(o) {
      const r = caja(o);
      const bote = Math.sin(o.bote * Math.PI) * r.s * 0.08;
      ctx.save(); ctx.translate(0, -bote);
      if (o.e === 'mesa') {
        const grosor = r.h * 0.16, pata = r.w * 0.07;
        ctx.fillStyle = '#B5733A'; ctx.strokeStyle = '#1B1B2F'; ctx.lineWidth = Math.max(1, r.s * 0.012);
        for (const [x, y, w, h] of [[r.x, r.y, r.w, grosor], [r.x + pata * 0.5, r.y + grosor, pata, r.h - grosor], [r.x + r.w - pata * 1.5, r.y + grosor, pata, r.h - grosor]]) {
          ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
        }
      } else {
        ctx.font = `${r.h}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(o.e, r.cx, r.base);
      }
      for (const p of o.pegatinas) pegatina(r.cx + p.dx * r.s, r.base - p.dy * r.s, r.s * 0.13, p.tipo);
      ctx.restore();
    }
    function dibujarPistola() {
      const u = Math.min(W, H) / 720;
      const gx = W * 0.62 + (mira.ver && !mira.fija ? (mira.x - W / 2) * 0.1 : 0) + Math.sin(pasos * 4.5) * 10 * andando;
      const gy = H + 20 * u + retro * 16 * u + Math.abs(Math.cos(pasos * 4.5)) * 8 * andando;
      ctx.save(); ctx.translate(gx, gy); ctx.scale(u, u);
      ctx.lineWidth = 4; ctx.strokeStyle = '#1B1B2F';
      ctx.fillStyle = '#1F5FD6'; rr(-22, -95, 44, 100, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#E63027'; rr(-62, -178, 124, 92, 22); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -134, 30, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFD21F'; ctx.beginPath(); ctx.arc(0, -134, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFD21F'; rr(-30, -204, 60, 30, 8); ctx.fill(); ctx.stroke();
      ctx.restore();
      pegatina(gx, gy - 212 * u, 20 * u, dios ? (Math.floor(reloj * 4) % 2 ? 'estrella' : 'caramelo') : municion);
      boca = { x: gx, y: gy - 212 * u };
    }
    function dibujarMira() {
      const m = mira.fija ? centroMira() : mira;
      if (!mira.fija && !mira.ver) return;
      ctx.strokeStyle = '#E63027'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(m.x, m.y, 16, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(m.x - 26, m.y); ctx.lineTo(m.x - 8, m.y); ctx.moveTo(m.x + 8, m.y); ctx.lineTo(m.x + 26, m.y);
      ctx.moveTo(m.x, m.y - 26); ctx.lineTo(m.x, m.y - 8); ctx.moveTo(m.x, m.y + 8); ctx.lineTo(m.x, m.y + 26);
      ctx.stroke();
    }

    function disparar(tx, ty) {
      Sonido.init();
      const tipos = dios ? ['estrella', 'caramelo', 'estrella'] : [municion];
      tipos.forEach((tipo, k) => balas.push({ tipo, t: 0, ox: boca.x, oy: boca.y, tx: tx + (k - (tipos.length - 1) / 2) * 50, ty }));
      retro = 1;
      Sonido.barrido(1200, 400, 0.08, { onda: 0.25, vol: 0.1 });
      if (Sonido.ok()) Sonido.ruido(Sonido.t, 0.05, { vol: 0.15, filtro: 3000 });
    }
    function dispararMira() {
      const m = mira.fija || !mira.ver ? centroMira() : mira;
      disparar(m.x, m.y);
    }
    function impacto(b) {
      const cerca = cosas.filter(o => o.z > 0.6).sort((a, d) => a.z - d.z);
      for (const o of cerca) {
        const r = caja(o);
        // Zona de acierto generosa: los dedos pequeños no apuntan al píxel
        const m = Math.max(22, r.w * 0.2);
        if (b.tx < r.x - m || b.tx > r.x + r.w + m || b.ty < r.y - m || b.ty > r.y + r.h + m) continue;
        o.pegatinas.push({ dx: (b.tx - r.cx) / r.s, dy: (r.base - b.ty) / r.s, tipo: b.tipo });
        o.bote = 1;
        total++; marcador.textContent = total;
        Sonido.chuche(b.tipo); Sonido.pop();
        textoFlotante(escena, b.tx, b.ty - 20, T('¡' + o.n + '!', o.n + '!'));
        if (o.jefe && !o.huye) {
          o.huye = true;
          ponerCara('😎', 1800);
          aviso(T('🧑‍💼 ¡Has etiquetado al jefe!', '🧑‍💼 You labelled the boss!'));
          Voz.decir(T('¡Has etiquetado al jefe!', 'You labelled the boss!'), { pitch: 1.3 });
        } else ponerCara('😆', 450);
        if (total % 25 === 0) {
          lluvia(['🏆', '⭐', '🍬'], 40); aviso(T('🏆 ¡Empleada del mes!', '🏆 Employee of the month!')); Sonido.fanfarria();
          Voz.decir(T('¡Empleada del mes!', 'Employee of the month!'), { pitch: 1.3 });
        }
        return;
      }
      marcas.push({ x: b.tx, y: b.ty, tipo: b.tipo, v: 1 });
      ponerCara('😮', 400);
    }
    function actualizar(dt) {
      // Andar: hacia delante y hacia atrás cambia la distancia; a los lados mueve la cámara
      const delante = (tecla.arriba ? 1 : 0) - (tecla.abajo ? 1 : 0), lado = (tecla.der ? 1 : 0) - (tecla.izq ? 1 : 0);
      const vel = delante * 2.6 + 0.35; // las cosas se acercan solas un poquito
      camX = limitar(camX + lado * dt * 1.8, -0.7, 0.7);
      andando = limitar(andando + (delante || lado ? dt * 4 : -dt * 4), 0, 1);
      pasos += dt * andando;
      avance += dt * vel; reloj += dt;
      proxima -= dt;
      if (proxima <= 0) { nuevaCosa(); proxima = azar(0.6, 1.3); }
      for (let i = cosas.length - 1; i >= 0; i--) {
        const o = cosas[i];
        o.z -= dt * vel;
        o.bote = Math.max(0, o.bote - dt * 3);
        if (o.jefe) {
          if (o.huye) o.x += dt * 2.5 * (o.x >= camX ? 1 : -1);
          else o.x = limitar(o.x + Math.sin(reloj * 1.5 + o.fase) * dt * 0.7, -1.1, 1.1);
        }
        if (o.z < 0.6 || o.z > 14 || Math.abs(o.x) > 3) cosas.splice(i, 1);
      }
      for (let i = balas.length - 1; i >= 0; i--) {
        const b = balas[i]; b.t += dt / 0.2;
        if (b.t >= 1) { balas.splice(i, 1); impacto(b); }
      }
      for (let i = marcas.length - 1; i >= 0; i--) { marcas[i].v -= dt / 2.5; if (marcas[i].v <= 0) marcas.splice(i, 1); }
      retro = Math.max(0, retro - dt * 6);
      if (tCara && performance.now() > tCara) { cara.textContent = dios ? '😇' : '😃'; tCara = 0; }
    }
    function pintar() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dibujarPasillo();
      [...cosas].sort((a, d) => d.z - a.z).forEach(dibujarCosa);
      for (const m of marcas) pegatina(m.x, m.y, 18, m.tipo, Math.min(1, m.v * 2));
      dibujarPistola();
      for (const b of balas) {
        const x = b.ox + (b.tx - b.ox) * b.t, y = b.oy + (b.ty - b.oy) * b.t - Math.sin(b.t * Math.PI) * 40;
        pegatina(x, y, 30 - 14 * b.t, b.tipo);
      }
      dibujarMira();
    }

    escena.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return;
      const q = posEnLienzo(e, cv, W, H);
      mira.x = q.x; mira.y = q.y; mira.ver = true; mira.fija = false;
      escena.classList.add('raton');
    });
    escena.addEventListener('pointerleave', () => { mira.ver = false; });
    escena.addEventListener('pointerdown', e => {
      const q = posEnLienzo(e, cv, W, H);
      if (e.pointerType === 'mouse') { mira.x = q.x; mira.y = q.y; mira.ver = true; mira.fija = false; }
      disparar(q.x, q.y);
    });
    const MAPA = { arrowup: 'arriba', w: 'arriba', arrowdown: 'abajo', s: 'abajo', arrowleft: 'izq', a: 'izq', arrowright: 'der', d: 'der' };
    const abajoTecla = e => {
      if (e.target.matches('input, textarea')) return;
      const k = e.key.toLowerCase(), dir = MAPA[k];
      if (dir) { e.preventDefault(); tecla[dir] = true; mira.fija = true; escena.classList.remove('raton'); }
      else if (e.key === ' ') { e.preventDefault(); if (!e.repeat) dispararMira(); }
      else if (e.key === '1') elegirMunicion('estrella');
      else if (e.key === '2') elegirMunicion('caramelo');
      if (e.key.length === 1) {
        codigo = (codigo + k).slice(-5);
        // Easter egg: IDDQD, el truco de «modo dios» del Doom original → disparo triple
        if (codigo === 'iddqd') {
          codigo = ''; dios = !dios;
          cara.textContent = dios ? '😇' : '😃';
          aviso(dios ? T('😇 ¡MODO DIOS! Etiquetas triples', '😇 GOD MODE! Triple labels') : T('Modo dios desactivado', 'God mode off'));
          Sonido.fanfarria();
        }
      }
    };
    const arribaTecla = e => { const dir = MAPA[e.key.toLowerCase()]; if (dir) tecla[dir] = false; };
    document.addEventListener('keydown', abajoTecla);
    document.addEventListener('keyup', arribaTecla);

    let raf = 0, ultimo = performance.now();
    function bucle(t) {
      const dt = Math.min(0.05, (t - ultimo) / 1000); ultimo = t;
      if (W > 0) { actualizar(dt); pintar(); }
      raf = requestAnimationFrame(bucle);
    }
    raf = requestAnimationFrame(bucle);
    return {
      cerrar() {
        cancelAnimationFrame(raf); ro.disconnect();
        document.removeEventListener('keydown', abajoTecla);
        document.removeEventListener('keyup', arribaTecla);
        if (musica) musica.parar();
      }
    };
  }
};

/* =========================================================
   Escritorio, menú, idioma, reloj, fondos, easter eggs
   ========================================================= */
const ORDEN = ['navegador', 'calculadora', 'cuentos', 'musica', 'guinoles', 'pintar', 'memoria', 'animales', 'abrasos', 'bola', 'hoja', 'etiquetas', 'papelera'];

function montarEscritorio() {
  const iconos = $('#iconos');
  iconos.replaceChildren(...ORDEN.map(id => {
    const a = Apps[id];
    const cara = el('span', { class: 'cara', style: { background: a.color } }, a.emoji);
    // Easter egg: a veces, en vez de abrirse la app, ¡sale un muñeco con muelle!
    return el('button', { class: 'icono', onclick: () => {
      if (!$('.sorpresa') && Math.random() < 1 / 7) munecoSorpresa(cara); else abrirApp(id);
    } }, cara, el('span', { class: 'nombre' }, nombreApp(a)));
  }));
  $('#menu').replaceChildren(
    el('h3', {}, '🌈 Safarrancho OS'),
    ...ORDEN.map(id => el('button', { onclick: () => abrirApp(id) }, el('span', { class: 'em' }, Apps[id].emoji), nombreApp(Apps[id]))),
    el('hr'),
    el('button', { onclick: () => { cerrarMenu(); cambiarIdioma(IDIOMA === 'es' ? 'en' : 'es'); } }, el('span', { class: 'em' }, '🌐'), T('English', 'Español')),
    el('button', { onclick: () => { cerrarMenu(); cambiarFondo(); } }, el('span', { class: 'em' }, '🖼️'), T('Cambiar fondo', 'Change wallpaper')),
    el('button', { onclick: apagar }, el('span', { class: 'em' }, '🌙'), T('Apagar', 'Shut down')));
  $('#logoEscritorio').replaceChildren();
  letrasDeColores($('#logoEscritorio'), "Lucía's World");
  $('#btnMudo').title = T('Sonido', 'Sound');
  $('#btnIdioma').textContent = '🌐 ' + IDIOMA.toUpperCase();
  $('#btnIdioma').title = T('Idioma: español', 'Language: English');
  document.documentElement.lang = IDIOMA;
}
function cerrarMenu() { $('#menu').classList.remove('abierto'); }
$('#btnInicio').addEventListener('click', e => { e.stopPropagation(); Sonido.clic(); $('#menu').classList.toggle('abierto'); });
document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#btnInicio')) cerrarMenu(); });

/* ---------- Idioma ---------- */
function cambiarIdioma(nuevo) {
  if (nuevo === IDIOMA) return;
  IDIOMA = nuevo;
  guardar('idioma', nuevo);
  // La app abierta se vuelve a abrir para que salga entera en el idioma nuevo
  const abierta = actual && actual.id;
  cerrarApp(true);
  montarEscritorio();
  pintarArranque();
  Sonido.clic();
  if (abierta) setTimeout(() => abrirApp(abierta), 250);
  if (!$('#arranque')) Voz.decir(T('¡Hola! Ahora hablo español.', 'Hello! Now I speak English.'), { pitch: 1.3 });
}
$('#btnIdioma').addEventListener('click', () => cambiarIdioma(IDIOMA === 'es' ? 'en' : 'es'));

const FONDOS = ['cielo', 'noche', 'lego'];
let fondoActual = FONDOS.includes(leer('fondo')) ? leer('fondo') : 'cielo';
function ponerFondo(nombre) {
  fondoActual = nombre; guardar('fondo', nombre);
  const esc = $('#escritorio'), d = $('#decor');
  esc.className = 'fondo-' + nombre;
  d.replaceChildren();
  document.querySelectorAll('.ambiente').forEach(n => n.remove());
  if (nombre === 'cielo') {
    d.append(el('div', { class: 'arcoiris' }),
      el('div', { class: 'colina', style: { width: '70vw', height: '50vh', left: '-10vw', bottom: '-30vh' } }),
      el('div', { class: 'colina', style: { width: '80vw', height: '56vh', right: '-20vw', bottom: '-36vh', background: '#3CC160' } }),
      el('div', { class: 'sol' }));
    for (let i = 0; i < 4; i++) d.append(el('div', { class: 'nube', style: {
      top: azar(14, 46) + '%', width: azar(130, 220) + 'px', height: azar(50, 70) + 'px',
      animationDuration: azar(40, 80) + 's', animationDelay: -azar(0, 60) + 's' } }));
  } else if (nombre === 'noche') {
    for (let i = 0; i < 70; i++) d.append(el('div', { class: 'estrellita', style: {
      left: azar(0, 100) + '%', top: azar(0, 100) + '%', fontSize: azar(8, 22) + 'px', animationDelay: -azar(0, 2) + 's' } }, '★'));
    d.append(el('div', { class: 'luna' }), el('div', { class: 'cohete' }, '🚀'));
  } else {
    const opciones = ['var(--rojo)', 'var(--amarillo)', 'var(--azul)', '#fff', '#fff', '#fff'];
    d.append(el('div', { class: 'lego' }, Array.from({ length: 20 }, () => el('div', { style: { background: elegir(opciones) } }))));
  }
}
function cambiarFondo() {
  ponerFondo(FONDOS[(FONDOS.indexOf(fondoActual) + 1) % FONDOS.length]);
  Sonido.pop();
  setTimeout(lanzarAmbiente, 1200);
}

/* ---------- Cosas que pasan en el fondo de vez en cuando ---------- */
function ambiente(clase, ...hijos) {
  const n = el('div', { class: 'ambiente ' + clase }, ...hijos);
  // Tocarlas no hace «boing»: tienen su propia sorpresa
  n.addEventListener('pointerdown', e => e.stopPropagation());
  $('#escritorio').append(n);
  return n;
}
const AMBIENTE = {
  // Un duende va hasta el final del arcoíris, coge el oro y sale corriendo
  duende() {
    const ancho = innerWidth, meta = Math.min(440, ancho * 0.42);
    const bocata = el('span', { class: 'bocata' }, T('¡Mi oro! ☘️', 'My gold! ☘️'));
    const d = ambiente('duende', bocata, el('div', { class: 'sombrero' }), el('span', { class: 'cara-duende' }, '🧔'), el('span', { class: 'trebol' }, '☘️'));
    d.style.left = ancho + 'px';
    const ida = d.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${meta - ancho}px)` }], { duration: 5000, fill: 'forwards' });
    ida.onfinish = () => {
      d.classList.add('con-oro');
      d.append(el('span', { class: 'oro' }, '💰'));
      Sonido.caramelos();
      setTimeout(() => {
        const vuelta = d.animate([{ transform: `translateX(${meta - ancho}px)` }, { transform: `translateX(${-meta - 160}px)` }], { duration: 3200, fill: 'forwards' });
        vuelta.onfinish = () => d.remove();
      }, 1800);
    };
    d.addEventListener('click', () => {
      lluvia(['💰', '🍀', '✨'], 35); Sonido.exito();
      Voz.decir(T('¡Eh! ¡Que es mi oro!', 'Hey! That\'s my gold!'), { pitch: 1.9 });
    });
  },
  // Una estrella fugaz cruza el cielo: si la tocas, pides un deseo
  fugaz() {
    const f = ambiente('fugaz');
    const x0 = azar(innerWidth * 0.45, innerWidth * 0.95), y0 = azar(20, innerHeight * 0.25);
    const dx = -azar(320, 620), dy = azar(140, 280), ang = Math.atan2(-dy, -dx) * 180 / Math.PI;
    f.style.left = x0 + 'px'; f.style.top = y0 + 'px';
    f.animate([
      { transform: `translate(0,0) rotate(${ang}deg)`, opacity: 0 },
      { opacity: 1, offset: 0.15 },
      { transform: `translate(${dx}px,${dy}px) rotate(${ang}deg)`, opacity: 0 }
    ], { duration: 2200, easing: 'ease-in', fill: 'forwards' }).onfinish = () => f.remove();
    f.addEventListener('click', () => { aviso(T('🌠 ¡Pide un deseo!', '🌠 Make a wish!')); lluvia(['⭐', '✨', '🌟'], 25); Sonido.exito(); });
  },
  // Un platillo volante con su rayo de luz
  ovni() {
    const o = ambiente('ovni', el('span', { class: 'nave' }, '🛸'), el('div', { class: 'rayo' }));
    o.style.top = azar(8, 22) + '%';
    o.style.left = '-120px';
    o.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${innerWidth + 240}px)` }], { duration: 11000, fill: 'forwards' }).onfinish = () => o.remove();
    setTimeout(() => o.classList.add('abduce'), 4000);
    setTimeout(() => o.classList.remove('abduce'), 6500);
    o.addEventListener('click', () => { lluvia(['👽', '🛸', '⭐'], 25); Voz.decir(T('¡Hola, terrícola!', 'Hello, earthling!'), { pitch: 2, rate: 1.2 }); });
  },
  // Una avioneta con una pancarta
  avion() {
    const a = ambiente('avion', el('span', { class: 'pancarta' }, T('¡Hola, Lucía! ❤️', 'Hello, Lucía! ❤️')), el('span', { class: 'aparato' }, '✈️'));
    a.style.top = azar(6, 16) + '%';
    a.style.left = '-360px';
    a.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${innerWidth + 400}px)` }], { duration: 14000, fill: 'forwards' }).onfinish = () => a.remove();
    a.addEventListener('click', () => { lluvia(['❤️', '✈️', '☁️'], 25); Sonido.exito(); });
  },
  // Un globo sube flotando: si lo tocas, explota
  globo() {
    const g = ambiente('globo-amb', elegir(['🎈', '🎈', '🎈']));
    g.style.left = azar(10, 85) + 'vw';
    g.style.bottom = '-80px';
    g.style.filter = `hue-rotate(${Math.floor(azar(0, 360))}deg)`;
    const anim = g.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${azar(-80, 80)}px, -${innerHeight + 160}px)` }], { duration: 12000, fill: 'forwards' });
    anim.onfinish = () => g.remove();
    g.addEventListener('click', e => {
      Sonido.pop();
      textoFlotante($('#escritorio'), e.clientX, e.clientY, T('¡POP!', 'POP!'));
      g.remove();
    });
  },
  // Una bandada de pájaros
  pajaros() {
    const p = ambiente('pajaros', el('span', {}, '🐦'), el('span', {}, '🐦'), el('span', {}, '🐦'));
    p.style.top = azar(20, 40) + '%';
    p.style.left = innerWidth + 'px';
    p.animate([{ transform: 'translateX(0)' }, { transform: `translateX(-${innerWidth + 300}px)` }], { duration: 10000, fill: 'forwards' }).onfinish = () => p.remove();
    p.addEventListener('click', () => { Voz.decir(T('¡Pío, pío!', 'Tweet, tweet!'), { pitch: 2, rate: 1.3 }); });
  },
  // En el fondo de bloques, algunos bloques cambian de color
  bloques() {
    const opciones = ['var(--rojo)', 'var(--amarillo)', 'var(--azul)', '#fff'];
    document.querySelectorAll('.lego div').forEach(b => { if (Math.random() < 0.35) b.style.background = elegir(opciones); });
  }
};
const POR_FONDO = { cielo: ['duende', 'duende', 'avion', 'globo', 'pajaros'], noche: ['fugaz', 'fugaz', 'fugaz', 'ovni'], lego: ['bloques', 'globo'] };
function lanzarAmbiente() {
  if ($('#apagado') || $('#arranque') || document.hidden || actual) return;
  AMBIENTE[elegir(POR_FONDO[fondoActual])]();
}
function programarAmbiente() { setTimeout(() => { lanzarAmbiente(); programarAmbiente(); }, azar(12, 28) * 1000); }

function reloj() {
  const d = new Date(), h = d.getHours();
  $('#reloj').textContent = (h >= 7 && h < 20 ? '☀️ ' : '🌙 ') + String(h).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
setInterval(reloj, 10000); reloj();

// Sonido on/off
function pintarMudo() { $('#btnMudo').textContent = Sonido.mudo ? '🔇' : '🔊'; }
Sonido.mudo = leer('mudo') === '1';
pintarMudo();
$('#btnMudo').addEventListener('click', () => { Sonido.init(); Sonido.setMudo(!Sonido.mudo); guardar('mudo', Sonido.mudo ? '1' : '0'); pintarMudo(); Sonido.clic(); });

// Easter egg: pinchar en el escritorio, fuera de las cajas → ¡BOING!
$('#escritorio').addEventListener('pointerdown', e => {
  if (e.target.closest('.icono, #logo, .ambiente')) return;
  Sonido.init();
  Sonido.muelle();
  textoFlotante($('#escritorio'), e.clientX, e.clientY, T('¡BOING!', 'BOING!'));
});
// Easter egg: 3 toques en el reloj → ¡dinosaurio!
let toquesReloj = 0, tReloj = 0;
$('#reloj').addEventListener('click', () => {
  const ahora = Date.now();
  toquesReloj = ahora - tReloj < 700 ? toquesReloj + 1 : 1; tReloj = ahora;
  if (toquesReloj >= 3) { toquesReloj = 0; dinosaurio(); }
});
// Easter egg: 5 toques en el logo → lluvia de estrellas
let toquesLogo = 0, tLogo = 0;
$('#logo').addEventListener('click', () => {
  const ahora = Date.now();
  toquesLogo = ahora - tLogo < 800 ? toquesLogo + 1 : 1; tLogo = ahora;
  Sonido.clic();
  if (toquesLogo >= 5) { toquesLogo = 0; lluvia(['⭐', '🌟', '✨', '💫'], 50); Sonido.fanfarria(); aviso(T('🌟 ¡Lluvia de estrellas! 🌟', '🌟 Star shower! 🌟')); }
});
// Easter eggs de teclado: código Konami y escribir «lucia»
const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
let teclas = [], letras = '';
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') { cerrarApp(); cerrarMenu(); return; }
  teclas.push(e.key.toLowerCase()); teclas = teclas.slice(-10);
  if (teclas.join() === KONAMI.join()) { teclas = []; modoDisco(); }
  if (e.key.length === 1) {
    letras = (letras + e.key.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')).slice(-5);
    if (letras === 'lucia') { letras = ''; saludoLucia(); }
  }
});
// Desbloquear el audio en el primer toque (necesario en iPad/iPhone)
document.addEventListener('pointerdown', () => { if (Sonido.ctx && Sonido.ctx.state === 'suspended') Sonido.ctx.resume(); });

/* ---------- Apagar y encender ---------- */
function apagar() {
  cerrarMenu(); cerrarApp(true);
  document.body.classList.remove('disco'); $('#bolaDisco')?.remove();
  Sonido.nana();
  Voz.decir(T('Buenas noches, Lucía', 'Good night, Lucía'), { pitch: 1.2, rate: 0.85 });
  const ap = el('div', { id: 'apagado' }, el('div', { class: 'gran' }, '🌙'), el('p', {}, T('Buenas noches, Lucía', 'Good night, Lucía')), el('small', {}, T('Toca para despertar ☀️', 'Tap to wake up ☀️')));
  ap.addEventListener('click', () => { ap.remove(); Sonido.arranque(); aviso(T('☀️ ¡Buenos días!', '☀️ Good morning!')); });
  document.body.append(ap);
}

/* ---------- Arranque ---------- */
const MENSAJES_CARGA = {
  es: ['Inflando globos...', 'Despertando a los dinosaurios...', 'Pintando el arcoíris...', 'Llenando la piscina de bolas...', 'Afinando la estrellita...', 'Buscando calcetines perdidos...', '¡Listo!'],
  en: ['Blowing up balloons...', 'Waking up the dinosaurs...', 'Painting the rainbow...', 'Filling the ball pit...', 'Tuning the little star...', 'Looking for lost socks...', 'Ready!']
};
let pasoCarga = 0;
function pintarArranque() {
  if (!$('#arranque')) return;
  $('#btnEmpezar').textContent = T('¡A jugar! 🚀', 'Let\'s play! 🚀');
  const m = MENSAJES_CARGA[IDIOMA];
  $('#msgCarga').textContent = m[Math.min(pasoCarga, m.length - 1)];
  $('#idiomasArranque').replaceChildren(...[['es', 'Español'], ['en', 'English']].map(([cod, txt]) =>
    el('button', { class: 'btn mini ' + (cod === IDIOMA ? 'sel' : 'blanco'), onclick: () => cambiarIdioma(cod) }, txt)));
}
(function arrancar() {
  letrasDeColores($('#logoArranque'), "Lucía's World");
  montarEscritorio();
  ponerFondo(fondoActual);
  Voz.init();
  pintarArranque();
  const barra = $('#barraCarga');
  const tick = setInterval(() => {
    const m = MENSAJES_CARGA[IDIOMA];
    $('#msgCarga').textContent = m[pasoCarga];
    barra.style.width = ((pasoCarga + 1) / m.length * 100) + '%';
    if (++pasoCarga >= m.length) { clearInterval(tick); $('#btnEmpezar').style.display = 'inline-flex'; }
  }, 380);
  $('#btnEmpezar').addEventListener('click', () => {
    Sonido.init();
    Sonido.arranque();
    $('#arranque').classList.add('fuera');
    setTimeout(() => $('#arranque').remove(), 600);
    Voz.decir(T('¡Bienvenida al mundo de Lucía!', 'Welcome to Lucía\'s world!'), { pitch: 1.3 });
    programarCaramelos();
    setTimeout(lanzarAmbiente, 5000);
    programarAmbiente();
  });
})();
</script>
</body>
