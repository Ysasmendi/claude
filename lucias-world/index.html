<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lucía's World · Safarrancho OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#E63027; --amarillo:#FFD21F; --azul:#1F5FD6; --verde:#25A84A;
  --naranja:#FF8A1F; --morado:#8B3FD9; --rosa:#FF5FA2;
  --tinta:#1B1B2F; --papel:#FFFBEF;
  --borde:4px solid var(--tinta);
  --sombra:6px 6px 0 var(--tinta);
  --barra:84px;
  font-family:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--azul);color:var(--tinta);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}

/* ---------- Botones ---------- */
.btn{font-size:22px;font-weight:700;padding:12px 20px;border:var(--borde);border-radius:18px;
  background:var(--amarillo);box-shadow:4px 4px 0 var(--tinta);transition:transform .08s,box-shadow .08s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--tinta)}
.btn.rojo{background:var(--rojo);color:#fff}
.btn.azul{background:var(--azul);color:#fff}
.btn.verde{background:var(--verde);color:#fff}
.btn.blanco{background:#fff}
.btn.mini{font-size:18px;padding:8px 14px;border-radius:14px}
.btn.sel{outline:4px dashed var(--tinta);outline-offset:3px}
.btn:disabled{opacity:.45}

/* ---------- Arranque ---------- */
#arranque{position:fixed;inset:0;z-index:200;background:var(--amarillo);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;padding:20px;text-align:center;transition:opacity .5s}
#arranque.fuera{opacity:0;pointer-events:none}
.logo-grande{font-size:clamp(46px,10vw,104px);font-weight:700;line-height:1;letter-spacing:1px}
.logo-grande span{display:inline-block;-webkit-text-stroke:3px var(--tinta);paint-order:stroke fill;
  text-shadow:5px 5px 0 var(--tinta);animation:letra 1.4s ease-in-out infinite}
@keyframes letra{50%{transform:translateY(-10px) rotate(-4deg)}}
.chapa-os{background:var(--rojo);color:#fff;border:var(--borde);border-radius:999px;padding:8px 22px;
  font-size:clamp(20px,4vw,30px);font-weight:700;box-shadow:var(--sombra);transform:rotate(-3deg)}
.carga{width:min(460px,86vw);height:38px;border:var(--borde);border-radius:999px;background:#fff;overflow:hidden;box-shadow:var(--sombra)}
.carga i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--rojo) 0 22px,var(--azul) 22px 44px);transition:width .25s}
#msgCarga{font-size:22px;font-weight:600;min-height:30px}
#btnEmpezar{font-size:34px;padding:18px 40px;display:none;animation:latido 1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.07)}}

/* ---------- Escritorio ---------- */
#escritorio{position:fixed;inset:0 0 var(--barra) 0;overflow:hidden;transition:background .6s}
#decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fondo-cielo{background:linear-gradient(#3E92FF,#9CD2FF)}
.fondo-noche{background:linear-gradient(#0D1B4C,#1F3C9C)}
.fondo-lego{background:var(--tinta)}
.sol{position:absolute;right:6%;top:30px;width:120px;height:120px;border-radius:50%;background:var(--amarillo);
  border:var(--borde);box-shadow:0 0 0 16px rgba(255,210,31,.35),0 0 0 32px rgba(255,210,31,.18);animation:solLatido 3s ease-in-out infinite}
@keyframes solLatido{50%{transform:scale(1.08)}}
.nube{position:absolute;left:0;background:#fff;border:var(--borde);border-radius:999px;animation:nube linear infinite}
@keyframes nube{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}
.colina{position:absolute;border-radius:50%;background:var(--verde);border:var(--borde)}
.arcoiris{position:absolute;left:-160px;bottom:-330px;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,transparent 48%,#8B3FD9 48% 53%,#3A2FA8 53% 58%,var(--azul) 58% 63%,var(--verde) 63% 68%,var(--amarillo) 68% 73%,var(--naranja) 73% 78%,var(--rojo) 78% 83%,transparent 83%)}
.luna{position:absolute;right:8%;top:40px;width:110px;height:110px;border-radius:50%;background:#FFF4B8;border:var(--borde);
  box-shadow:inset -22px -10px 0 #F2DB6B}
.estrellita{position:absolute;color:#FFF4B8;animation:titila 2s ease-in-out infinite}
@keyframes titila{50%{opacity:.2;transform:scale(.6)}}
.cohete{position:absolute;left:10%;bottom:60px;font-size:70px;animation:flota 4s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-24px) rotate(6deg)}}
.lego{position:absolute;inset:0;display:grid;grid-template-columns:2fr 1fr 3fr 1fr 2fr;grid-template-rows:1fr 2fr 1fr 1.5fr;gap:12px;padding:0}
.lego div{border-radius:0}

#logo{position:relative;z-index:2;text-align:center;padding-top:18px;cursor:pointer}
#logo .logo-grande{font-size:clamp(34px,6vw,58px)}
#logo .chapa-os{display:inline-block;font-size:18px;padding:4px 14px;margin-top:6px;box-shadow:4px 4px 0 var(--tinta)}

#iconos{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:26px 18px;padding:26px 28px 40px;max-width:1120px;margin:0 auto;max-height:calc(100% - 130px);overflow:auto}
.icono{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px}
.icono .cara{width:112px;height:112px;border:var(--borde);border-radius:30px;display:grid;place-items:center;
  font-size:62px;box-shadow:var(--sombra);transition:transform .15s}
.icono:hover .cara{transform:rotate(-6deg) scale(1.06)}
.icono:active .cara{transform:scale(.9)}
.icono .nombre{background:#fff;border:3px solid var(--tinta);border-radius:12px;padding:3px 12px;font-weight:700;font-size:19px;max-width:150px;text-align:center;line-height:1.15}

/* ---------- Barra de tareas ---------- */
#barra{position:fixed;left:0;right:0;bottom:0;height:var(--barra);background:var(--rojo);border-top:var(--borde);
  display:flex;align-items:center;gap:12px;padding:0 14px;z-index:60}
#btnInicio{font-size:24px;padding:10px 18px}
#tarea{flex:1;display:flex;min-width:0}
#tarea .chip{background:#fff;border:3px solid var(--tinta);border-radius:14px;padding:8px 14px;font-weight:700;font-size:19px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:3px 3px 0 var(--tinta)}
#reloj{background:#fff;border:3px solid var(--tinta);border-radius:14px;padding:8px 14px;font-weight:700;font-size:22px;box-shadow:3px 3px 0 var(--tinta)}
#btnMudo{font-size:26px;padding:6px 12px}
@media (max-width:600px){#btnInicio .txt,#tarea .chip{display:none}#reloj{font-size:18px;padding:8px 10px}}
#menu{position:fixed;left:14px;bottom:calc(var(--barra) + 10px);z-index:70;background:var(--papel);border:var(--borde);border-radius:24px;
  box-shadow:10px 10px 0 var(--tinta);padding:14px;display:none;width:min(340px,calc(100vw - 28px));max-height:calc(100vh - var(--barra) - 30px);overflow:auto}
#menu.abierto{display:block;animation:abrir .22s cubic-bezier(.2,1.4,.4,1)}
#menu h3{margin:2px 6px 10px;font-size:22px}
#menu button{width:100%;display:flex;align-items:center;gap:12px;font-size:21px;font-weight:700;background:none;border:0;padding:8px 10px;border-radius:14px;text-align:left}
#menu button:hover{background:var(--amarillo)}
#menu button .em{font-size:30px;width:40px;text-align:center}
#menu hr{border:0;border-top:3px dashed var(--tinta);margin:10px 4px}

/* ---------- Ventanas ---------- */
.ventana{position:fixed;left:max(14px,calc(50% - 640px));right:max(14px,calc(50% - 640px));top:14px;bottom:calc(var(--barra) + 14px);
  background:var(--papel);border:var(--borde);border-radius:26px;box-shadow:10px 10px 0 var(--tinta);display:flex;flex-direction:column;
  z-index:40;overflow:hidden;animation:abrir .3s cubic-bezier(.2,1.4,.4,1)}
.ventana.cerrando{animation:cerrar .2s ease-in forwards}
@keyframes abrir{from{transform:scale(.5);opacity:0}}
@keyframes cerrar{to{transform:scale(.5);opacity:0}}
.ventana .titulo{flex:none;height:66px;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;border-bottom:var(--borde);font-size:27px;font-weight:700}
.ventana .titulo .em{font-size:36px}
.ventana .titulo .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ventana .cerrar{width:52px;height:52px;border-radius:16px;background:var(--rojo);color:#fff;border:var(--borde);font-size:28px;font-weight:700;
  box-shadow:3px 3px 0 var(--tinta);display:grid;place-items:center;padding:0}
.ventana .cerrar:active{transform:translate(3px,3px);box-shadow:none}
.ventana .cuerpo{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------- Efectos globales ---------- */
.cae{position:fixed;top:-80px;z-index:150;pointer-events:none;animation:caer linear forwards}
@keyframes caer{to{transform:translateY(calc(100vh + 160px)) rotate(var(--giro,360deg))}}
.flotante{position:absolute;z-index:30;font-weight:700;font-size:34px;pointer-events:none;-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;
  color:var(--amarillo);animation:flotante 1s ease-out forwards}
@keyframes flotante{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.aviso{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:160;background:#fff;border:var(--borde);border-radius:24px;
  box-shadow:var(--sombra);padding:18px 28px;font-size:30px;font-weight:700;text-align:center;pointer-events:none;animation:aviso 2.6s ease forwards}
@keyframes aviso{0%{transform:translate(-50%,-50%) scale(.3)}12%{transform:translate(-50%,-50%) scale(1.08)}18%,82%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-50%) scale(.8);opacity:0}}
#dino{position:fixed;bottom:calc(var(--barra) - 10px);left:-200px;z-index:55;font-size:130px;pointer-events:none;animation:dino 7s linear forwards}
#dino span{display:inline-block;transform:scaleX(-1)}
@keyframes dino{to{left:calc(100vw + 50px)}}
#dino b{position:absolute;top:-30px;left:90px;font-size:32px;background:#fff;border:var(--borde);border-radius:16px;padding:2px 12px}
body.disco #escritorio{animation:disco 1.2s linear infinite}
@keyframes disco{to{filter:hue-rotate(360deg)}}
#bolaDisco{position:fixed;top:-10px;left:50%;font-size:90px;z-index:5;transform-origin:50% 0;animation:balanceo 1.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes balanceo{from{transform:translateX(-50%) rotate(-12deg)}to{transform:translateX(-50%) rotate(12deg)}}
.sorpresa{position:fixed;z-index:58;display:flex;flex-direction:column;align-items:center;pointer-events:none;transform:translateX(-50%)}
.sorpresa .cabeza{font-size:70px;line-height:1;animation:cabezona .3s ease-in-out .5s 6 alternate}
.sorpresa .muelle{width:34px;height:0;border-left:4px solid var(--tinta);border-right:4px solid var(--tinta);
  background:repeating-linear-gradient(165deg,#C9CED9 0 5px,var(--tinta) 5px 8px,transparent 8px 13px);animation:muelle 2.4s cubic-bezier(.3,1.6,.5,1) forwards}
.sorpresa .caja{width:80px;height:46px;background:var(--rojo);border:var(--borde);border-radius:10px;box-shadow:4px 4px 0 var(--tinta);
  background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,210,31,.8) 10px 18px)}
@keyframes muelle{0%{height:0}12%{height:150px}22%{height:100px}32%{height:130px}42%{height:112px}80%{height:120px}100%{height:0}}
@keyframes cabezona{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
#apagado{position:fixed;inset:0;z-index:190;background:#06081A;color:#FFF4B8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;cursor:pointer;animation:fundido .8s}
@keyframes fundido{from{opacity:0}}
#apagado .gran{font-size:120px;animation:flota 4s ease-in-out infinite}
#apagado p{font-size:30px;margin:0;font-weight:600}
#apagado small{font-size:20px;opacity:.7}

/* ---------- Navegador ---------- */
.nav{display:flex;flex-direction:column;height:100%}
.nav-barra{flex:none;display:flex;gap:8px;align-items:center;padding:10px;background:#DCE7FF;border-bottom:var(--borde);flex-wrap:wrap}
.nav-barra .btn{padding:6px 12px;font-size:22px;border-radius:12px;box-shadow:3px 3px 0 var(--tinta)}
.nav-url{flex:1;min-width:180px;font-size:20px;font-weight:600;border:3px solid var(--tinta);border-radius:999px;padding:9px 18px;background:#fff;outline:none}
.nav-pagina{flex:1;min-height:0;position:relative;overflow:auto;background:#fff}
.web{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;text-align:center}
.web h1{font-size:clamp(32px,6vw,56px);margin:0}
.web p{font-size:24px;margin:0;max-width:640px}
.tiles{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.tile{width:230px;border:var(--borde);border-radius:24px;box-shadow:var(--sombra);padding:22px 12px;font-size:24px;font-weight:700;background:var(--amarillo);display:flex;flex-direction:column;align-items:center;gap:8px}
.tile .em{font-size:70px}
.tile small{font-size:16px;font-weight:600;opacity:.75}
.tile:active{transform:translate(4px,4px);box-shadow:none}
.piscina{display:flex;flex-direction:column;height:100%}
.web-cab{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:var(--borde);background:var(--rojo);color:#fff}
.web-cab h2{margin:0 auto 0 0;font-size:28px;-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;text-shadow:3px 3px 0 var(--tinta)}
.web-cab .btn{color:var(--tinta)}
.web-cab .btn.azul,.web-cab .btn.verde{color:#fff}
.piscina-caja{flex:1;min-height:0;position:relative;overflow:hidden;background:
  linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.65)),repeating-linear-gradient(90deg,var(--azul) 0 40px,var(--amarillo) 40px 80px)}
.piscina-caja canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.piscina-caja.tiembla{animation:tiembla .08s linear 10}
@keyframes tiembla{25%{transform:translate(-6px,3px)}75%{transform:translate(6px,-3px)}}
.contador{font-size:18px;font-weight:700;background:#fff;color:var(--tinta);border:3px solid var(--tinta);border-radius:12px;padding:4px 10px}
.web-secreta{background:repeating-conic-gradient(from 0deg,var(--rosa) 0 15deg,var(--amarillo) 15deg 30deg)}
.web-secreta .caja-secreta{background:#fff;border:var(--borde);border-radius:30px;box-shadow:var(--sombra);padding:30px}
.corona{font-size:120px;animation:letra 1.2s ease-in-out infinite}

/* ---------- Calculadora ---------- */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,420px);gap:20px;padding:20px;height:100%}
@media (max-width:760px){.calc{grid-template-columns:1fr;height:auto}}
.pantalla{background:#DFF5D6;border:var(--borde);border-radius:24px;box-shadow:inset 0 0 0 6px #fff;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:220px}
.pantalla .cuenta{font-size:clamp(46px,8vw,86px);font-weight:700;text-align:right;line-height:1;word-break:break-all}
.pantalla .cuenta .op{color:var(--rojo)}
.pantalla .cuenta .res{color:var(--azul)}
.pantalla .dibujo{flex:1;font-size:clamp(24px,3.4vw,36px);line-height:1.35;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 10px;align-items:center}
.pantalla .dibujo .grupo{display:inline-flex;flex-wrap:wrap;gap:2px;background:#fff;border:3px solid var(--tinta);border-radius:14px;padding:4px 8px}
.pantalla .dibujo .signo{font-weight:700;font-size:1.3em}
.pantalla .dibujo .comida{opacity:.3;position:relative}
.pantalla .dibujo .frase{width:100%;font-size:22px;font-weight:600}
.teclas{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.teclas .btn{font-size:clamp(30px,4.6vw,44px);padding:14px 0;border-radius:20px}

/* ---------- Cuentos ---------- */
.estante{padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.libro{border:var(--borde);border-radius:10px 24px 24px 10px;box-shadow:var(--sombra);padding:22px 16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-size:24px;font-weight:700;text-align:center;border-left-width:14px;color:#fff;-webkit-text-stroke:1px var(--tinta)}
.libro .em{font-size:84px;-webkit-text-stroke:0}
.libro:active{transform:translate(4px,4px);box-shadow:none}
.pagina{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;padding:20px}
.pagina .escena{font-size:clamp(70px,14vw,140px);line-height:1.1;text-align:center;animation:flota 4s ease-in-out infinite;letter-spacing:6px}
.pagina .texto{font-size:clamp(22px,3.2vw,32px);font-weight:600;text-align:center;max-width:860px;background:#fff;border:var(--borde);border-radius:22px;padding:16px 22px;box-shadow:var(--sombra)}
.pagina .mandos{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.puntos{display:flex;gap:8px}
.puntos i{width:16px;height:16px;border-radius:50%;border:3px solid var(--tinta);background:#fff}
.puntos i.on{background:var(--rojo)}

/* ---------- Música ---------- */
.musica{display:flex;flex-direction:column;height:100%}
.pestanas{flex:none;display:flex;gap:10px;padding:14px;border-bottom:var(--borde);background:#E9FBE5;flex-wrap:wrap}
.musica .zona{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px}
.estrella8{width:120px;height:120px;image-rendering:pixelated;transition:transform .08s}
.estrella8.bote{transform:scale(1.25) rotate(-8deg)}
.letra{font-size:clamp(24px,3.6vw,38px);font-weight:700;text-align:center;line-height:1.5}
.letra .linea{opacity:.35;transition:opacity .2s}
.letra .linea.activa{opacity:1}
.letra .sil{padding:0 1px;border-radius:8px;transition:background .1s,color .1s}
.letra .sil.ya{color:var(--azul)}
.letra .sil.ahora{background:var(--amarillo);color:var(--tinta);box-shadow:0 0 0 3px var(--tinta)}
.xilo{display:flex;gap:10px;align-items:center;justify-content:center;width:100%;max-width:900px;flex:1;min-height:240px}
.xilo button{flex:1;border:var(--borde);border-radius:18px;box-shadow:5px 5px 0 var(--tinta);font-size:22px;font-weight:700;color:#fff;
  -webkit-text-stroke:1px var(--tinta);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px 0}
.xilo button::before,.xilo button::after{content:'';width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--tinta)}
.xilo button.toca{transform:translateY(6px);box-shadow:0 0 0 var(--tinta)}

/* ---------- Guiñoles ---------- */
.teatro{height:100%;display:flex;flex-direction:column;background:#3B1D0E}
.cartelera{flex:1;overflow:auto;padding:24px;background:repeating-linear-gradient(90deg,#B3121F 0 40px,#8E0E19 40px 80px)}
.cartelera h2{color:#fff;text-align:center;font-size:clamp(30px,5vw,46px);margin:0 0 20px;-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;text-shadow:4px 4px 0 var(--tinta)}
.carteles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;max-width:1100px;margin:0 auto}
.cartel{background:var(--papel);border:var(--borde);border-radius:20px;box-shadow:var(--sombra);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:25px;font-weight:700;text-align:center}
.cartel .em{font-size:66px;letter-spacing:4px}
.cartel small{font-size:16px;font-weight:600;opacity:.7}
.cartel:active{transform:translate(4px,4px);box-shadow:none}
.escenario{flex:1;min-height:260px;position:relative;overflow:hidden;border-bottom:var(--borde)}
.fondo-esc{position:absolute;inset:0;transition:background .8s}
.fondo-esc .deco{position:absolute;transform:translate(-50%,-50%);transition:opacity .6s}
.esc-campo{background:linear-gradient(#7CC6FF 0 60%,#3DBB55 60%)}
.esc-bosque{background:linear-gradient(#2E7D4F 0 60%,#1E5B33 60%)}
.esc-dulce{background:linear-gradient(#FFB3D9 0 60%,#C98A4B 60%)}
.esc-osos{background:linear-gradient(#FFD9A0 0 60%,#B9783C 60%)}

.maquina .corazon{font-size:66px}
.maquina.abraza .corazon{animation:latido .3s ease-in-out 4}
.maquina .cartel-maquina{position:absolute;bottom:10px;background:var(--amarillo);border:3px solid var(--tinta);border-radius:10px;padding:0 8px;font-size:13px;font-weight:700}
.brazo{position:absolute;top:36px;z-index:2;width:110px;height:32px;border:var(--borde);border-radius:16px;
  background:repeating-linear-gradient(90deg,var(--amarillo) 0 14px,#E8B800 14px 18px)}
.brazo::after{position:absolute;top:-16px;font-size:44px;line-height:1}
.brazo.izq{right:calc(100% - 10px);transform-origin:right center}
.brazo.izq::after{content:'🤚';left:-34px}

.brazo.der::after{content:'✋';right:-34px}
.maquina.abraza .brazo.izq{animation:brazoIzq 1.3s ease-in-out}
.maquina.abraza .brazo.der{animation:brazoDer 1.3s ease-in-out}
@keyframes brazoIzq{30%,75%{transform:rotate(155deg)}}

.boton-abraso{font-size:clamp(26px,4vw,34px);padding:16px 34px;background:var(--rosa);color:#fff}

.punio{position:absolute;left:50%;top:48%;z-index:6;font-size:90px;pointer-events:none;animation:punio 1.1s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes punio{0%{transform:translate(-50%,-50%) scale(.2)}30%{transform:translate(-50%,-50%) scale(3.3)}70%{transform:translate(-50%,-50%) scale(2.9) rotate(-8deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.2);opacity:0}}
.pow{position:absolute;z-index:7;left:50%;top:22%;font-size:clamp(50px,9vw,90px);font-weight:700;color:var(--amarillo);-webkit-text-stroke:4px var(--tinta);paint-order:stroke fill;
  text-shadow:6px 6px 0 var(--tinta);pointer-events:none;animation:pow 1.1s ease-out forwards}
@keyframes pow{0%{transform:translateX(-50%) scale(.3) rotate(-15deg)}25%{transform:translateX(-50%) scale(1.2) rotate(-8deg)}80%{transform:translateX(-50%) scale(1) rotate(-8deg);opacity:1}100%{transform:translateX(-50%) scale(1) rotate(-8deg);opacity:0}}
.ventana.tiembla{animation:tiembla .08s linear 8}

/* ---------- Bola de cristal ---------- */
.bola-app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 50% 35%,#5B34B0,#1E1248 72%)}

  filter:blur(16px);opacity:.3;animation:girar 6s linear infinite}

.bola.mareada{animation:mareo 1.6s ease-in-out}
@keyframes mareo{25%{transform:rotate(25deg)}50%{transform:rotate(-25deg)}75%{transform:rotate(15deg)}}
.vision{position:relative;z-index:1;font-size:clamp(60px,11vw,96px);opacity:0;transform:scale(.3);transition:opacity .5s,transform .5s cubic-bezier(.2,1.6,.4,1)}

/* ---------- Hoja de chuches ---------- */
.hoja{display:flex;flex-direction:column;height:100%;background:#F4F7FB}
.hoja-barra{flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#E3F5E8;border-bottom:var(--borde)}

.leyenda span{background:#fff;border:3px solid var(--tinta);border-radius:12px;padding:4px 10px;font-weight:700;font-size:17px;white-space:nowrap}
.formula{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:3px solid #C9D2E3;background:#fff;font-size:20px}
.formula .ref{min-width:64px;text-align:center;border:2px solid #C9D2E3;border-radius:8px;padding:2px 8px;font-weight:700}
.formula .fx{font-style:italic;font-weight:700;color:var(--verde)}
.formula .valor{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoja-cuerpo{flex:1;min-height:0;overflow:auto;display:flex;gap:18px;padding:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

.totales{display:flex;flex-direction:column;gap:10px;min-width:0}

  background:repeating-linear-gradient(0deg,#6B6B75 0 6px,#5E5E68 6px 12px)}
.hud-caja{background:#3A3A44;border:3px solid var(--tinta);border-radius:12px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;min-width:110px}

.papelera p{font-size:26px;font-weight:600;margin:0;max-width:600px}

</div>

<script>
'use strict';
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props = {}, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const h of hijos.flat()) {
    if (h == null || h === false) continue;
    e.append(h.nodeType ? h : document.createTextNode(String(h)));
  }
  return e;
}
const azar = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   Sonido (todo sintetizado, estilo 8 bits)
   ========================================================= */
const Sonido = {
  ctx: null, master: null, mudo: false, ondas: {}, bufRuido: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.mudo ? 0 : 0.6;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  get t() { return this.ctx ? this.ctx.currentTime : 0; },
  ok() { return this.ctx && !this.mudo; },
  pulso(duty) {
    if (!this.ondas[duty]) {
      const n = 40, re = new Float32Array(n), im = new Float32Array(n);
      for (let i = 1; i < n; i++) re[i] = 2 / (i * Math.PI) * Math.sin(i * Math.PI * duty);
      this.ondas[duty] = this.ctx.createPeriodicWave(re, im);
    }
    return this.ondas[duty];
  },
  nota(freq, t, dur, { onda = 'square', vol = 0.15, destino = this.master, caida = false } = {}) {
    if (!this.ctx) return null;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    if (typeof onda === 'number') o.setPeriodicWave(this.pulso(onda)); else o.type = onda;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    if (caida) g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    else { g.gain.setValueAtTime(vol, t + dur * 0.8); g.gain.linearRampToValueAtTime(0, t + dur * 0.98); }
    o.connect(g); g.connect(destino);
    o.start(t); o.stop(t + dur + 0.03);
    return o;
  },
  barrido(f1, f2, dur, { onda = 'square', vol = 0.15, cuando = 0 } = {}) {
    if (!this.ok()) return;
    const t = this.t + cuando;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    if (typeof onda === 'number') o.setPeriodicWave(this.pulso(onda)); else o.type = onda;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  ruido(t, dur, { vol = 0.2, destino = this.master, filtro = 5000 } = {}) {
    if (!this.ctx) return;
    if (!this.bufRuido) {
      const b = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.bufRuido = b;
    }
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.bufRuido;
    f.type = 'highpass'; f.frequency.value = filtro;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(destino);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  clic() { if (this.ok()) this.nota(1046, this.t, 0.07, { onda: 0.25, vol: 0.08, caida: true }); },
  pop() { this.barrido(300, 1100, 0.13, { onda: 'triangle', vol: 0.3 }); },
  boing() { this.barrido(160, 620, 0.28, { onda: 'triangle', vol: 0.3 }); },
  // «Boing» de muelle: un tono que sube mientras vibra cada vez menos
  muelle() {
    if (!this.ok()) return;
    const t = this.t, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    const lfo = this.ctx.createOscillator(), prof = this.ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(420, t + 0.5);
    lfo.frequency.value = 16;
    prof.gain.setValueAtTime(90, t);
    prof.gain.exponentialRampToValueAtTime(2, t + 0.6);
    lfo.connect(prof); prof.connect(o.frequency);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
    o.connect(g); g.connect(this.master);
    o.start(t); lfo.start(t); o.stop(t + 0.7); lfo.stop(t + 0.7);
  },
  abraso() {
    if (!this.ok()) return;
    [60, 64, 67, 72].forEach((m, i) => this.nota(mtof(m), this.t + i * 0.1, 0.7 - i * 0.1, { onda: 'triangle', vol: 0.18, caida: true }));
    this.nota(mtof(88), this.t + 0.45, 0.4, { onda: 0.125, vol: 0.05, caida: true });
  },
  punio() {
    this.barrido(700, 70, 0.3, { onda: 'square', vol: 0.2 });
    if (this.ok()) this.ruido(this.t, 0.35, { vol: 0.45, filtro: 150 });
  },
  misterio() {
    if (!this.ok()) return;
    [72, 75, 78, 81, 84, 81, 78, 75, 72, 75, 78, 81].forEach((m, i) => this.nota(mtof(m), this.t + i * 0.13, 0.3, { onda: 'triangle', vol: 0.12, caida: true }));
    this.nota(mtof(48), this.t, 1.7, { onda: 'sine', vol: 0.15 });
  },
  chuche(tipo) {
    if (!this.ok()) return;
    if (tipo === 'caramelo') this.nota(880, this.t, 0.12, { onda: 0.25, vol: 0.1, caida: true });
    else if (tipo === 'estrella') { this.nota(1568, this.t, 0.15, { onda: 0.125, vol: 0.07, caida: true }); this.nota(2093, this.t + 0.06, 0.2, { onda: 0.125, vol: 0.07, caida: true }); }
    else { this.nota(196, this.t, 0.15, { onda: 'triangle', vol: 0.25, caida: true }); this.ruido(this.t, 0.08, { vol: 0.12, filtro: 2500 }); }
  },
  bombo(t, destino) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(destino); o.start(t); o.stop(t + 0.16);
  },
  // Estrellita en modo heavy metal: en Do menor, guitarras distorsionadas con acordes
  // de quinta, doble bombo y caja en 2 y 4. Se repite sola hasta que se llama a parar().
  metalEstrellita() {
    if (!this.ctx) return null;
    const ctx = this.ctx, salida = ctx.createGain();
    salida.gain.value = 0.55; salida.connect(this.master);
    const dist = ctx.createWaveShaper(), n = 1024, curva = new Float32Array(n), k = 60;
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curva[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
    dist.curve = curva; dist.oversample = '4x';
    const filtro = ctx.createBiquadFilter(); filtro.type = 'lowpass'; filtro.frequency.value = 3200;
    const guitarra = ctx.createGain(), volGuitarra = ctx.createGain();
    guitarra.gain.value = 0.6; volGuitarra.gain.value = 0.18;
    guitarra.connect(dist); dist.connect(filtro); filtro.connect(volGuitarra); volGuitarra.connect(salida);
    const b = 60 / 160;
    const MENOR = { 64: 63, 69: 68 }; // Mi → Mi♭ y La → La♭
    const RAIZ = { C: 36, F: 41, G: 43 };
    let timer = null, vivo = true;
    const vuelta = inicio => {
      let t = inicio;
      ESTRELLITA.lineas.forEach(l => {
        const tl = t;
        l.n.forEach((m, i) => {
          const d = i === 6 ? 2 * b : b, nota = MENOR[m] || m;
          this.nota(mtof(nota + 12), t, d * 0.9, { onda: 'sawtooth', vol: 0.08, destino: salida });
          this.nota(mtof(nota + 24), t, d * 0.9, { onda: 0.125, vol: 0.03, destino: salida });
          t += d;
        });
        l.ac.forEach((a, ai) => {
          const ta = tl + ai * 2 * b, r = RAIZ[a];
          for (let q = 0; q < 4; q++) {
            const tq = ta + q * b / 2, largo = q === 0 ? b / 2 * 0.95 : b / 2 * 0.5;
            [r, r + 7, r + 12].forEach(m => this.nota(mtof(m), tq, largo, { onda: 'sawtooth', vol: 0.3, destino: guitarra }));
            this.bombo(tq, salida);
            this.ruido(tq, 0.03, { vol: 0.06, destino: salida, filtro: 8000 });
          }
          this.ruido(ta + b, 0.12, { vol: 0.35, destino: salida, filtro: 1200 });
          if (ai === 0) this.ruido(ta, 0.8, { vol: 0.1, destino: salida, filtro: 5000 });
        });
      });
      timer = setTimeout(() => { if (vivo) vuelta(t); }, Math.max(0, (t - ctx.currentTime - 1.5) * 1000));
    };
    vuelta(ctx.currentTime + 0.1);
    return {
      parar() {
        vivo = false; clearTimeout(timer);
        salida.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
        setTimeout(() => salida.disconnect(), 300);
      }
    };
  },
  caramelos() {
    if (!this.ok()) return;
    [84, 88, 91, 96, 91, 96].forEach((m, i) => this.nota(mtof(m), this.t + i * 0.07, 0.12, { onda: 0.125, vol: 0.07, caida: true }));
  },
  cuac() {
    this.barrido(900, 450, 0.13, { onda: 'sawtooth', vol: 0.12 });
    this.barrido(850, 420, 0.16, { onda: 'sawtooth', vol: 0.12, cuando: 0.17 });
  },
  exito() {
    if (!this.ok()) return;
    [72, 76, 79, 84].forEach((m, i) => this.nota(mtof(m), this.t + i * 0.09, 0.2, { onda: 0.25, vol: 0.12 }));
  },
  fallo() {
    if (!this.ok()) return;
    this.nota(330, this.t, 0.14, { onda: 0.5, vol: 0.1 });
    this.nota(247, this.t + 0.15, 0.25, { onda: 0.5, vol: 0.1 });
  },
  fanfarria() {
    if (!this.ok()) return;
    const t = this.t;
    [[67, 0, .12], [67, .13, .12], [67, .26, .12], [72, .39, .5], [76, .9, .15], [79, 1.06, .7]].forEach(([m, d, l]) => {
      this.nota(mtof(m), t + d, l, { onda: 0.25, vol: 0.12 });
      this.nota(mtof(m - 12), t + d, l, { onda: 'triangle', vol: 0.18 });

  },
  arranque() {
    if (!this.ok()) return;

    [48, 55, 60].forEach((m, i) => this.nota(mtof(m), t + i * 0.18, 0.3, { onda: 'triangle', vol: 0.2 }));

  },
  redoble(dur = 1.4) {

    for (let i = 0; i < n; i++) this.ruido(this.t + i * 0.045, 0.04, { vol: 0.05 + 0.2 * i / n, filtro: 1500 });

  },
  aplausos(dur = 2.5) {
    if (!this.ok()) return;
    for (let i = 0; i < 90; i++) this.ruido(this.t + Math.random() * dur, 0.05, { vol: azar(0.05, 0.18), filtro: 1200 });
  },
  rugido() {
    this.barrido(140, 55, 0.9, { onda: 'sawtooth', vol: 0.18 });
    if (this.ok()) this.ruido(this.t, 0.7, { vol: 0.15, filtro: 300 });
  },
  nana() {
    if (!this.ok()) return;
    [79, 76, 72, 67, 64, 60].forEach((m, i) => this.nota(mtof(m), this.t + i * 0.28, 0.5, { onda: 'triangle', vol: 0.2, caida: true }));
  },
  setMudo(m) {
    this.mudo = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.6;
    if (m) Voz.callar();
  }
};

/* =========================================================
   Voz (lectura en voz alta con el navegador)
   ========================================================= */
const Voz = {
  voz: null, hay: 'speechSynthesis' in window,
  init() {
    if (!this.hay) return;
    const elegirVoz = () => {
      const vs = speechSynthesis.getVoices();
      this.voz = vs.find(v => v.lang === 'es-ES') || vs.find(v => /^es/i.test(v.lang)) || null;
    };
    elegirVoz();
    speechSynthesis.onvoiceschanged = elegirVoz;
  },
  decir(texto, { pitch = 1, rate = 1 } = {}) {
    const lectura = 900 + texto.length * 55;
    return new Promise(res => {
      if (!this.hay || Sonido.mudo) { setTimeout(res, lectura); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-ES';
      if (this.voz) u.voice = this.voz;
      u.pitch = limitar(pitch, 0, 2);
      u.rate = rate;
      const t0 = Date.now();
      let hecho = false;
      // Si no hay voz instalada, el navegador "termina" al instante: dejamos tiempo para leer.
      const fin = () => {
        if (hecho) return; hecho = true;
        const minimo = this.voz ? 0 : lectura;
        setTimeout(res, Math.max(0, minimo - (Date.now() - t0)));
      };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 3000 + texto.length * 120);
      speechSynthesis.speak(u);
    });
  },
  callar() { if (this.hay) speechSynthesis.cancel(); }
};

/* =========================================================
   APP: Navegador (con la piscina de bolas)
   ========================================================= */
Apps.navegador = {
  nombre: 'Navegador', emoji: '🌐', color: 'var(--azul)',
  crear(c) {
    const url = el('input', { class: 'nav-url', value: '', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Dirección' });
    const pagina = el('div', { class: 'nav-pagina' });
    const atras = el('button', { class: 'btn blanco', title: 'Atrás', onclick: () => mover(-1) }, '⬅️');
    const adelante = el('button', { class: 'btn blanco', title: 'Adelante', onclick: () => mover(1) }, '➡️');
    c.append(el('div', { class: 'nav' },
      el('div', { class: 'nav-barra' },
        atras, adelante,
        el('button', { class: 'btn blanco', title: 'Recargar', onclick: () => ir(historial[pos], false) }, '🔄'),
        el('button', { class: 'btn', title: 'Inicio', onclick: () => ir('safarrancho://inicio') }, '🏠'),
        url,
        el('button', { class: 'btn verde', onclick: () => ir(url.value) }, '¡Ir!')),
      pagina));
    url.addEventListener('keydown', e => { if (e.key === 'Enter') { ir(url.value); url.blur(); } });

    const historial = []; let pos = -1; let limpiar = null;

    function normalizar(u) {
      u = (u || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/+$/, '');
      if (!u || u === 'inicio' || u === 'safarrancho://inicio') return 'safarrancho://inicio';
      if (/luc[ií]a|safarrancho/.test(u)) return 'www.lucia.es';
      if (/piscina|bolas/.test(u)) return 'www.piscinadebolas.es';
      if (/burbuja/.test(u)) return 'www.burbujas.es';
      if (!u.includes('.')) u = 'www.' + u.replace(/\s+/g, '') + '.es';
      return u;
    }
    function ir(destino, nueva = true) {
      const u = normalizar(destino);
      if (limpiar) { limpiar(); limpiar = null; }
      if (nueva) { historial.splice(pos + 1); historial.push(u); pos = historial.length - 1; }
      url.value = u.startsWith('safarrancho') ? u : '🔒 ' + u;
      atras.disabled = pos <= 0; adelante.disabled = pos >= historial.length - 1;
      pagina.replaceChildren();
      Sonido.clic();
      const fn = SITIOS[u] || paginaPerdida;
      limpiar = fn(pagina, ir, u) || null;
    }
    function mover(d) {
      const n = pos + d;
      if (n < 0 || n >= historial.length) return;
      pos = n; ir(historial[pos], false);
    }
    url.addEventListener('focus', () => { url.value = url.value.replace('🔒 ', ''); url.select(); });
    ir('safarrancho://inicio');
    return { cerrar() { if (limpiar) limpiar(); } };
  }
};

/* ---- Piscina de bolas con físicas de verdad ----
   Cada bola tiene masa (según su tamaño), gravedad, rebote y rozamiento.
   Los choques se calculan por impulsos y usamos una rejilla para que vaya rápido. */
function paginaPiscina(p) {
  const COL = ['#E63027', '#FFD21F', '#1F5FD6', '#25A84A', '#FF8A1F', '#FF5FA2', '#8B3FD9', '#FFFFFF'];
  const SPR = COL.map(c => {
    const s = document.createElement('canvas'); s.width = s.height = 96;
    const x = s.getContext('2d');
    const g = x.createRadialGradient(34, 30, 4, 48, 48, 46);
    g.addColorStop(0, '#fff'); g.addColorStop(0.28, c); g.addColorStop(1, oscurecer(c === '#FFFFFF' ? '#D8D8E8' : c, 0.6));
    x.fillStyle = g; x.beginPath(); x.arc(48, 48, 45, 0, Math.PI * 2); x.fill();
    x.lineWidth = 3; x.strokeStyle = 'rgba(27,27,47,.55)'; x.stroke();
    return s;
  });

  const contador = el('span', { class: 'contador' }, '0 bolas');
  const btnLuna = el('button', { class: 'btn mini', onclick: () => {
    luna = !luna; btnLuna.textContent = luna ? '🌍 Gravedad Tierra' : '🌙 Gravedad Luna';
    Sonido.barrido(luna ? 300 : 900, luna ? 900 : 300, 0.3, { onda: 'triangle', vol: 0.25 });
  } }, '🌙 Gravedad Luna');
  const caja = el('div', { class: 'piscina-caja' });
  const cv = el('canvas');
  caja.append(cv);
  p.append(el('div', { class: 'piscina' },
    el('div', { class: 'web-cab' },
      el('h2', {}, '🎪 Piscina de bolas'),
      contador,
      el('button', { class: 'btn mini', onclick: () => { llenar(30); Sonido.pop(); } }, '➕ 30 bolas'),
      el('button', { class: 'btn mini azul', onclick: terremoto }, '🌋 ¡Terremoto!'),
      btnLuna,
      el('button', { class: 'btn mini verde', onclick: vaciar }, '🧹 Vaciar')),
    caja));

  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, esc = 1, celda = 50, cols = 1, filas = 1, rejilla = [];
  let luna = false;
  const bolas = [];
  const puntero = { x: 0, y: 0, vx: 0, vy: 0, t: 0 };
  let agarrada = null;

  function crear(x, y, vx = 0, vy = 0, pato = false) {
    const r = (pato ? 26 : azar(15, 23)) * esc;
    const b = { x, y, vx, vy, r, im: 1 / (r * r), c: Math.floor(Math.random() * COL.length), pato, cx: 0, cy: 0 };
    bolas.push(b);
    return b;
  }
  function llenar(n) {
    n = Math.min(n, 520 - bolas.length);
    for (let i = 0; i < n; i++) crear(azar(30, W - 30), -azar(30, 80 + i * 7) * esc, azar(-60, 60), azar(0, 200));
  }
  function vaciar() {
    for (let i = bolas.length - 1; i >= 0; i--) if (!bolas[i].pato) bolas.splice(i, 1);
    agarrada = null;
    Sonido.barrido(900, 120, 0.4, { onda: 'triangle', vol: 0.25 });
  }
  function terremoto() {
    for (const b of bolas) { b.vy -= azar(500, 1400) * esc; b.vx += azar(-700, 700) * esc; }
    caja.classList.remove('tiembla'); void caja.offsetWidth; caja.classList.add('tiembla');
    Sonido.rugido();
  }

  function construirRejilla() {
    cols = Math.ceil(W / celda) + 1; filas = Math.ceil(H / celda) + 1;
    const n = cols * filas;
    if (rejilla.length !== n) rejilla = Array.from({ length: n }, () => []);
    else for (const a of rejilla) a.length = 0;
    for (let i = 0; i < bolas.length; i++) {
      const b = bolas[i];
      b.cx = limitar(Math.floor(b.x / celda), 0, cols - 1);
      b.cy = limitar(Math.floor(b.y / celda), 0, filas - 1);
      rejilla[b.cx + b.cy * cols].push(i);
    }
  }
  function choque(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    const rs = a.r + b.r;
    let d2 = dx * dx + dy * dy;
    if (d2 >= rs * rs) return;
    if (d2 < 1e-6) { dx = azar(-0.5, 0.5); dy = -1; d2 = dx * dx + 1; }
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, pen = rs - d;
    // El pato flota: si tiene una bola encima, sube apartando las bolas como si pesara muchísimo
    if (a.pato && ny < -0.3) a.tocaArriba = true;
    if (b.pato && ny > 0.3) b.tocaArriba = true;
    const fija = o => o === agarrada || (o.pato && o.subiendo);
    const ia = fija(a) ? 0 : a.im, ib = fija(b) ? 0 : b.im, suma = ia + ib;
    if (!suma) return;
    // 1) separar las bolas que se solapan (según su masa)
    const k = pen * 0.8 / suma;
    a.x -= nx * k * ia; a.y -= ny * k * ia;
    b.x += nx * k * ib; b.y += ny * k * ib;
    // 2) impulso: rebote + rozamiento
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
    if (vn >= 0) return;
    const e = vn < -180 ? 0.6 : 0;
    const j = -(1 + e) * vn / suma;
    a.vx -= j * nx * ia; a.vy -= j * ny * ia;
    b.vx += j * nx * ib; b.vy += j * ny * ib;
    const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, lim = j * 0.4;
    const jt = limitar(-vt / suma * 0.2, -lim, lim);
    a.vx -= jt * tx * ia; a.vy -= jt * ty * ia;
    b.vx += jt * tx * ib; b.vy += jt * ty * ib;
  }
  function paredes(b) {
    const e = 0.55;
    if (b.x < b.r) { b.x = b.r; if (b.vx < 0) b.vx = -b.vx * (b.vx < -150 ? e : 0); }
    else if (b.x > W - b.r) { b.x = W - b.r; if (b.vx > 0) b.vx = -b.vx * (b.vx > 150 ? e : 0); }
    if (b.y > H - b.r) { b.y = H - b.r; if (b.vy > 0) b.vy = -b.vy * (b.vy > 150 ? e : 0); b.vx *= 0.995; }
    else if (b.y < -H * 2) { b.y = -H * 2; if (b.vy < 0) b.vy = 0; }
  }
  function paso(dt) {
    const N = 8, h = dt / N, g = (luna ? 300 : 2200) * esc, VMAX = 3500;
    for (let s = 0; s < N; s++) {
      for (const b of bolas) {
        if (b === agarrada) {
          const nx = b.x + (puntero.x - b.x) * 0.35, ny = b.y + (puntero.y - b.y) * 0.35;
          b.vx = limitar((nx - b.x) / h, -1500, 1500); b.vy = limitar((ny - b.y) / h, -1500, 1500);
          b.x = nx; b.y = ny;
          continue;
        }
        if (b.pato) { b.subiendo = b.tocaArriba; b.tocaArriba = false; }
        if (b.subiendo) { b.vx *= 0.9; b.vy = -170 * esc; }
        else b.vy += g * h;
        b.vx *= 0.9997; b.vy *= 0.9997;
        const v2 = b.vx * b.vx + b.vy * b.vy;
        if (v2 > VMAX * VMAX) { const f = VMAX / Math.sqrt(v2); b.vx *= f; b.vy *= f; }
        b.x += b.vx * h; b.y += b.vy * h;
      }
      construirRejilla();
      for (let i = 0; i < bolas.length; i++) {
        const a = bolas[i];
        for (let oy = -1; oy <= 1; oy++) {
          const cy = a.cy + oy; if (cy < 0 || cy >= filas) continue;
          for (let ox = -1; ox <= 1; ox++) {
            const cx = a.cx + ox; if (cx < 0 || cx >= cols) continue;
            for (const j of rejilla[cx + cy * cols]) if (j > i) choque(a, bolas[j]);
          }
        }
      }
      for (const b of bolas) paredes(b);
    }
  }
  function pintar() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (const b of bolas) {
      if (b.y < -b.r) continue;
      if (b.pato) {
        ctx.font = `${b.r * 2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🦆', b.x, b.y + b.r * 0.1);
      } else ctx.drawImage(SPR[b.c], b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    contador.textContent = (bolas.length - 1) + ' bolas';
  }

  function posicion(e) { return posEnLienzo(e, cv, W, H); }
  cv.addEventListener('pointerdown', e => {
    Sonido.init();
    const q = posicion(e);
    Object.assign(puntero, q, { vx: 0, vy: 0, t: performance.now() });
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    let mejor = null, md = Infinity;
    for (const b of bolas) {
      const d = Math.hypot(b.x - q.x, b.y - q.y);
      if (d < b.r * 1.2 && d < md) { md = d; mejor = b; }
    }
    if (mejor) {
      agarrada = mejor;
      if (mejor.pato) { Sonido.cuac(); textoFlotante(caja, q.x, q.y - 30, '¡CUAC!'); }
      else Sonido.clic();
    } else {
      // ¡Chapuzón! empuja las bolas cercanas
      const radio = 170 * esc;
      for (const b of bolas) {
        const dx = b.x - q.x, dy = b.y - q.y, d = Math.hypot(dx, dy) || 1;
        if (d < radio) { const f = (1 - d / radio) * 1500 * esc; b.vx += dx / d * f; b.vy += dy / d * f - 250 * esc; }
      }
      Sonido.pop();
      textoFlotante(caja, q.x, q.y, '¡PLOF!');
    }
  });
  cv.addEventListener('pointermove', e => {
    const q = posicion(e), ahora = performance.now();
    const dt = Math.max(0.008, (ahora - puntero.t) / 1000);
    puntero.vx = puntero.vx * 0.4 + ((q.x - puntero.x) / dt) * 0.6;
    puntero.vy = puntero.vy * 0.4 + ((q.y - puntero.y) / dt) * 0.6;
    Object.assign(puntero, q, { t: ahora });
  });
  const soltar = () => {
    if (!agarrada) return;
    agarrada.vx = limitar(puntero.vx, -2800, 2800);
    agarrada.vy = limitar(puntero.vy, -2800, 2800);
    agarrada = null;
  };
  cv.addEventListener('pointerup', soltar);
  cv.addEventListener('pointercancel', soltar);

  const ro = new ResizeObserver(() => {
    if (!caja.clientWidth || !caja.clientHeight) return;
    const primera = W === 0;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = caja.clientWidth; H = caja.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    if (primera) {
      esc = limitar(Math.min(W, H) / 520, 0.7, 1.35);
      celda = 2 * 26 * esc + 1;
      crear(W / 2, -60, 0, 0, true); // el pato escondido
      llenar(Math.min(320, Math.round(W * H * 0.5 / (Math.PI * (19 * esc) ** 2))));
    }
  });
  ro.observe(caja);

  let raf = 0, ultimo = performance.now();
  function bucle(t) {
    const dt = Math.min(1 / 30, (t - ultimo) / 1000); ultimo = t;
    if (W > 0 && dt > 0) { paso(dt); pintar(); }
    raf = requestAnimationFrame(bucle);
  }
  raf = requestAnimationFrame(bucle);
  return () => { cancelAnimationFrame(raf); ro.disconnect(); };
}

/* ---- Burbujas ---- */
function paginaBurbujas(p) {
  const contador = el('span', { class: 'contador' }, '0 explotadas');
  const caja = el('div', { class: 'piscina-caja', style: { background: 'linear-gradient(#7FD3FF,#1F5FD6)' } });
  const cv = el('canvas'); caja.append(cv);
  p.append(el('div', { class: 'piscina' }, el('div', { class: 'web-cab', style: { background: 'var(--azul)' } }, el('h2', {}, '🫧 Explota burbujas'), contador), caja));
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, total = 0;
  const burbujas = [], trozos = [];
  const nueva = () => burbujas.push({ x: azar(30, W - 30), y: H + 60, r: azar(22, 52), vy: azar(50, 120), fase: azar(0, 6), h: azar(0, 360) });
  cv.addEventListener('pointerdown', e => {
    Sonido.init();
    const { x, y } = posEnLienzo(e, cv, W, H);
    for (let i = burbujas.length - 1; i >= 0; i--) {
      const b = burbujas[i];
      if (Math.hypot(b.x - x, b.y - y) < b.r + 8) {
        burbujas.splice(i, 1); total++;
        contador.textContent = total + ' explotadas';
        for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; trozos.push({ x: b.x, y: b.y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180, v: 1, h: b.h }); }
        Sonido.barrido(azar(500, 900), 1600, 0.08, { onda: 'triangle', vol: 0.3 });
        if (total % 25 === 0) { lluvia(['🫧', '⭐', '🎉'], 25); Sonido.exito(); aviso(`¡${total} burbujas! 🎉`); }
        break;
      }
    }
  });
  const ro = new ResizeObserver(() => {
    if (!caja.clientWidth) return;
    dpr = Math.min(2, window.devicePixelRatio || 1); W = caja.clientWidth; H = caja.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
  });
  ro.observe(caja);
  let raf = 0, ultimo = performance.now(), cuenta = 0;
  function bucle(t) {
    const dt = Math.min(0.05, (t - ultimo) / 1000); ultimo = t;
    if (W) {
      cuenta += dt; if (cuenta > 0.45 && burbujas.length < 30) { cuenta = 0; nueva(); }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
      for (let i = burbujas.length - 1; i >= 0; i--) {
        const b = burbujas[i]; b.y -= b.vy * dt; b.fase += dt * 2;
        const x = b.x + Math.sin(b.fase) * 14;
        if (b.y < -80) { burbujas.splice(i, 1); continue; }
        const g = ctx.createRadialGradient(x - b.r * .4, b.y - b.r * .4, 2, x, b.y, b.r);
        g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.4, `hsla(${b.h},90%,80%,.25)`); g.addColorStop(1, `hsla(${b.h + 60},90%,60%,.55)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.stroke();
      }
      for (let i = trozos.length - 1; i >= 0; i--) {
        const q = trozos[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.v -= dt * 2;
        if (q.v <= 0) { trozos.splice(i, 1); continue; }
        ctx.fillStyle = `hsla(${q.h},90%,85%,${q.v})`; ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, Math.PI * 2); ctx.fill();
      }
    }
    raf = requestAnimationFrame(bucle);
  }
  raf = requestAnimationFrame(bucle);
  return () => { cancelAnimationFrame(raf); ro.disconnect(); };
}

/* =========================================================
   APP: Calculadora de sumas y restas
   ========================================================= */
Apps.calculadora = {
  nombre: 'Calculadora', emoji: '🧮', color: 'var(--amarillo)', texto: 'var(--tinta)',
  crear(c) {
    let a = '', op = null, b = '', res = null, igualRepetido = 0;
    const cuenta = el('div', { class: 'cuenta' });
    const dibujo = el('div', { class: 'dibujo' });
    const teclas = el('div', { class: 'teclas' });
    c.append(el('div', { class: 'calc' }, el('div', { class: 'pantalla' }, cuenta, dibujo), teclas));

    const colores = ['', 'rojo', 'azul', 'verde'];
    const tecla = (txt, fn, clase = '', estilo = {}) => teclas.append(el('button', { class: 'btn ' + clase, style: estilo, onclick: () => { Sonido.clic(); fn(); } }, txt));
    [7, 8, 9].forEach((n, i) => tecla(n, () => digito(n), colores[i % 4]));
    tecla('+', () => operar('+'), 'rojo');
    [4, 5, 6].forEach((n, i) => tecla(n, () => digito(n), colores[(i + 1) % 4]));
    tecla('−', () => operar('-'), 'azul');
    [1, 2, 3].forEach((n, i) => tecla(n, () => digito(n), colores[(i + 2) % 4]));
    tecla('=', igual, 'verde', { gridRow: 'span 2' });
    tecla(0, () => digito(0), 'blanco', { gridColumn: 'span 2' });
    tecla('C', borrar, 'blanco');

    function digito(n) {
      if (res !== null) { a = ''; op = null; b = ''; res = null; }
      igualRepetido = 0;
      if (op) { if (b.length < 3) b = (b === '0' ? '' : b) + n; }
      else if (a.length < 3) a = (a === '0' ? '' : a) + n;
      pintar();
    }
    function operar(o) {
      igualRepetido = 0;
      if (res !== null) { a = String(res); b = ''; res = null; }
      if (a === '') a = '0';
      op = o; pintar();
    }
    function borrar() { a = ''; op = null; b = ''; res = null; igualRepetido = 0; pintar(); }
    function igual() {
      if (res !== null) {
        if (++igualRepetido === 4) { aviso('😤 ¡Que ya te lo he dicho! Son ' + res); Voz.decir('¡Que ya te lo he dicho! ¡Son ' + res + '!', { pitch: 0.8 }); igualRepetido = 0; }
        return;
      }
      if (!op || b === '') { Sonido.fallo(); return; }
      const x = +a, y = +b;
      res = op === '+' ? x + y : x - y;
      pintar();
      const frase = `${x} ${op === '+' ? 'más' : 'menos'} ${y} son ${res}`;
      if (res === 100) { lluvia(['💯', '🎉', '⭐'], 45); aviso('💯 ¡CIEN! 💯'); Sonido.fanfarria(); }
      else if (x === 0 && y === 0) { aviso('Nada ' + (op === '+' ? 'más' : 'menos') + ' nada... ¡NADA! 🫥'); }
      else Sonido.exito();
      Voz.decir(frase, { rate: 0.95 });
    }
    function fila(n, emoji, comidas = 0) {
      const g = el('span', { class: 'grupo' });
      for (let i = 0; i < n; i++) g.append(el('span', { class: i >= n - comidas ? 'comida' : '' }, emoji));
      return g;
    }
    function pintar() {
      const sim = op === '+' ? '+' : '−';
      cuenta.replaceChildren(
        a || '0',
        op ? el('span', { class: 'op' }, ' ' + sim + ' ') : '',
        op ? b : '',
        res !== null ? el('span', { class: 'res' }, ' = ' + res) : '');
      dibujo.replaceChildren();
      const x = +(a || 0), y = +(b || 0);
      if (!op) { if (x > 0 && x <= 20) dibujo.append(fila(x, '🍎')); return; }
      if (x > 20 || y > 20) {
        if (res !== null) dibujo.append(el('span', { class: 'frase' }, '¡Son números muy grandes para dibujarlos! 🐘'));
        return;
      }
      if (op === '+') {
        if (x) dibujo.append(fila(x, '🍎'));
        dibujo.append(el('span', { class: 'signo' }, '+'));

      } else {
        if (res === null) { if (x) dibujo.append(fila(x, '🍪')); dibujo.append(el('span', { class: 'signo' }, '−'), y ? fila(y, '😋') : ''); }
        else if (res >= 0) {

          dibujo.append(el('span', { class: 'frase' }, `Tenías ${x} galletas, te comes ${y}... ¡quedan ${res}! 🍪`));

          dibujo.append(fila(x, '🍪', x));
          dibujo.append(el('span', { class: 'frase' }, `¡Solo había ${x} galletas! Te faltan ${-res}. Eso es un número negativo: como deber ${-res} ${res === -1 ? 'galleta' : 'galletas'}. 🙈`));
        }
      }
    }
    pintar();
  }
};

  // Cada línea: 7 notas (la última dura 2 tiempos), sus sílabas y 4 acordes (uno cada 2 tiempos)
  lineas: [

    { n: [65, 65, 64, 64, 62, 62, 60], s: ['Me', 'pre-', 'gun-', 'to', 'quién', 'se-', 'rás.'], ac: ['F', 'C', 'G', 'C'] },
    { n: [67, 67, 65, 65, 64, 64, 62], s: ['En', 'el', 'cie-', 'lo', 'o en', 'el', 'mar,'], ac: ['C', 'F', 'C', 'G'] },
    { n: [67, 67, 65, 65, 64, 64, 62], s: ['un', 'dia-', 'man-', 'te', 'de', 'ver-', 'dad.'], ac: ['C', 'F', 'C', 'G'] },
    { n: [60, 60, 67, 67, 69, 69, 67], s: ['Es-', 'tre-', 'lli-', 'ta,', '¿dón-', 'de es-', 'tás?'], ac: ['C', 'C', 'F', 'C'] },
    { n: [65, 65, 64, 64, 62, 62, 60], s: ['Me', 'pre-', 'gun-', 'to', 'quién', 'se-', 'rás.'], ac: ['F', 'C', 'G', 'C'] }
  ],
  acordes: { C: [48, 60, 64, 67], F: [53, 65, 69, 72], G: [55, 62, 67, 71] }
};
// Estrella en pixel-art (8 bits de verdad)
const PIXEL_ESTRELLA = [
  '.......YY.......',
  '......YYYY......',
  '......YYYY......',
  '.....YYYYYY.....',
  'YYYYYYYYYYYYYYYY',
  '.YYYYYYYYYYYYYY.',
  '..YYYKYYYYKYYY..',
  '...YYKYYYYKYY...',
  '...YYYYYYYYYY...',
  '...YYYRRRRYYY...',
  '..YYYYYRRYYYYY..',
  '..YYYYYYYYYYYY..',
  '.YYYYY....YYYYY.',
  '.YYYY......YYYY.',
  'YYY..........YYY',
  'Y..............Y'
];
function dibujarPixelArt(cv, mapa, colores) {
  cv.width = mapa[0].length; cv.height = mapa.length;
  const x = cv.getContext('2d');
  mapa.forEach((fila, y) => [...fila].forEach((ch, i) => { if (colores[ch]) { x.fillStyle = colores[ch]; x.fillRect(i, y, 1, 1); } }));
}

Apps.musica = {
  nombre: 'Música', emoji: '🎵', color: 'var(--verde)',
  crear(c) {
    const zona = el('div', { class: 'zona' });
    const tabEst = el('button', { class: 'btn sel', onclick: () => vista('estrellita') }, '⭐ Estrellita 8 bits');
    const tabXil = el('button', { class: 'btn azul', onclick: () => vista('xilofono') }, '🎹 Xilófono');
    c.append(el('div', { class: 'musica' }, el('div', { class: 'pestanas' }, tabEst, tabXil), zona));

    let cancion = null; // { gain, raf }
    let tempo = 100, bateria = true, ultimasNotas = [], teclaXilo = null;

    function parar() {
      if (!cancion) return;
      cancelAnimationFrame(cancion.raf);
      const g = cancion.gain;
      g.gain.setTargetAtTime(0, Sonido.t, 0.02);
      setTimeout(() => g.disconnect(), 200);
      cancion = null;
    }
    function soltarTeclado() {
      if (teclaXilo) { document.removeEventListener('keydown', teclaXilo); teclaXilo = null; }
    }

    function vista(cual) {
      parar();
      soltarTeclado();
      tabEst.className = 'btn ' + (cual === 'estrellita' ? 'sel' : 'azul');
      tabXil.className = 'btn ' + (cual === 'xilofono' ? 'sel' : 'azul');
      zona.replaceChildren();
      if (cual === 'estrellita') vistaEstrellita(); else vistaXilofono();
    }

    function vistaEstrellita() {
      const estrella = el('canvas', { class: 'estrella8' });
      dibujarPixelArt(estrella, PIXEL_ESTRELLA, { Y: '#FFD21F', K: '#1B1B2F', R: '#E63027' });
      const letra = el('div', { class: 'letra' });
      const sils = [];
      ESTRELLITA.lineas.forEach((l, li) => {
        const linea = el('div', { class: 'linea' });
        l.s.forEach((s, si) => {
          const sp = el('span', { class: 'sil' }, s);
          linea.append(sp);
          if (!s.endsWith('-')) linea.append(' ');
          sils.push({ sp, li, si, linea });
        });
        letra.append(linea);
      });
      const tocar = el('button', { class: 'btn rojo', style: { fontSize: '28px' } }, '▶️ ¡Tocar!');
      const vel = [['🐢', 70], ['🚶', 100], ['🐇', 140]].map(([em, bpm]) =>
        el('button', { class: 'btn mini ' + (bpm === tempo ? 'sel' : 'blanco'), onclick: e => { tempo = bpm; vel.forEach(v => v.className = 'btn mini blanco'); e.currentTarget.className = 'btn mini sel'; } }, em));
      const bat = el('button', { class: 'btn mini blanco', onclick: () => { bateria = !bateria; bat.textContent = bateria ? '🥁 Batería: sí' : '🥁 Batería: no'; } }, bateria ? '🥁 Batería: sí' : '🥁 Batería: no');
      tocar.onclick = () => {
        Sonido.init();
        if (cancion) { parar(); limpiar(); tocar.textContent = '▶️ ¡Tocar!'; return; }
        tocar.textContent = '⏹️ Parar';
        empezar();
      };
      zona.append(estrella, el('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', justifyContent: 'center', alignItems: 'center' } }, tocar, ...vel, bat), letra);

      function limpiar() {
        sils.forEach(s => s.sp.className = 'sil');
        letra.querySelectorAll('.linea').forEach(l => l.classList.remove('activa'));
      }
      function empezar() {
        if (!Sonido.ctx) { tocar.textContent = '▶️ ¡Tocar!'; return; }
        const ctx = Sonido.ctx, gain = ctx.createGain();
        gain.gain.value = 1; gain.connect(Sonido.master);
        const b = 60 / tempo, t0 = ctx.currentTime + 0.15, eventos = [];
        let t = t0, k = 0;
        ESTRELLITA.lineas.forEach(l => {
          const tl = t;
          l.n.forEach((m, i) => {
            const d = i === 6 ? 2 * b : b;
            Sonido.nota(mtof(m + 12), t, d * 0.92, { onda: 0.25, vol: 0.11, destino: gain });
            eventos.push({ t, k: k++ });
            t += d;
          });
          // Acompañamiento: bajo (triángulo) + arpegio (pulso fino) + batería (ruido)
          l.ac.forEach((a, ai) => {
            const [raiz, ...notas] = ESTRELLITA.acordes[a], ta = tl + ai * 2 * b;
            for (let q = 0; q < 4; q++) Sonido.nota(mtof(raiz + (q % 2 ? 12 : 0)), ta + q * b / 2, b / 2 * 0.9, { onda: 'triangle', vol: 0.2, destino: gain });
            for (let q = 0; q < 8; q++) Sonido.nota(mtof(notas[q % 3] + 12), ta + q * b / 4, b / 4 * 0.8, { onda: 0.125, vol: 0.035, destino: gain });
            if (bateria) for (let q = 0; q < 2; q++) {
              const tb = ta + q * b;
              Sonido.nota(150, tb, 0.12, { onda: 'sine', vol: 0.35, destino: gain, caida: true });
              Sonido.ruido(tb + b / 2, 0.05, { vol: 0.08, destino: gain, filtro: 7000 });
            }
          });
        });
        const fin = t + 0.1;
        let ultimo = -1;
        const bucle = () => {
          const ahora = ctx.currentTime;
          let actualK = -1;
          for (const e of eventos) if (e.t <= ahora) actualK = e.k;
          if (actualK !== ultimo) {
            ultimo = actualK;
            sils.forEach((s, i) => s.sp.className = 'sil' + (i < actualK ? ' ya' : i === actualK ? ' ahora' : ''));
            if (actualK >= 0) {
              const lin = sils[actualK].linea;
              letra.querySelectorAll('.linea').forEach(l => l.classList.toggle('activa', l === lin));
              estrella.classList.add('bote'); setTimeout(() => estrella.classList.remove('bote'), 110);
            }
          }
          if (ahora > fin) { parar(); limpiar(); tocar.textContent = '▶️ ¡Tocar!'; lluvia(['⭐', '🌟', '✨'], 30); return; }
          if (cancion) cancion.raf = requestAnimationFrame(bucle);
        };
        cancion = { gain, raf: requestAnimationFrame(bucle) };
      }
    }

    function vistaXilofono() {
      const NOTAS = [['Do', 60, 'var(--rojo)'], ['Re', 62, 'var(--naranja)'], ['Mi', 64, 'var(--amarillo)'], ['Fa', 65, 'var(--verde)'],
        ['Sol', 67, '#19B3B3'], ['La', 69, 'var(--azul)'], ['Si', 71, 'var(--morado)'], ['Do', 72, 'var(--rosa)']];
      const TECLAS = 'asdfghjk';
      const xilo = el('div', { class: 'xilo' });
      const botones = NOTAS.map(([nombre, m, col], i) => {
        const bt = el('button', { style: { background: col, height: (100 - i * 6) + '%' } }, el('span', {}, nombre));
        bt.addEventListener('pointerdown', () => golpe(i));
        xilo.append(bt);
        return bt;
      });
      function golpe(i) {
        Sonido.init();
        const m = NOTAS[i][1];
        if (Sonido.ok()) {
          Sonido.nota(mtof(m + 12), Sonido.t, 0.6, { onda: 'triangle', vol: 0.35, caida: true });
          Sonido.nota(mtof(m + 24), Sonido.t, 0.15, { onda: 0.25, vol: 0.05, caida: true });
        }
        botones[i].classList.add('toca'); setTimeout(() => botones[i].classList.remove('toca'), 120);
        ultimasNotas.push(m); ultimasNotas = ultimasNotas.slice(-9);
        // Easter egg: tocar el principio de Estrellita (Do Do Sol Sol La La Sol)
        if (ultimasNotas.slice(-7).join() === '60,60,67,67,69,69,67') {
          ultimasNotas = [];
          setTimeout(() => { lluvia(['⭐', '🌟', '✨', '💫'], 50); aviso('⭐ ¡Has tocado Estrellita! ⭐'); Voz.decir('¡Has tocado Estrellita! ¡Eres una artista!', { pitch: 1.3 }); }, 500);
        }
        // Easter egg: el principio de «Cara al sol» (La Sol Fa Fa Fa Do Fa Sol La).
        // Se comparan los saltos entre notas, así funciona en cualquier tono.
        const saltos = ultimasNotas.slice(1).map((v, k) => v - ultimasNotas[k]);
        if (ultimasNotas.length === 9 && saltos.join() === '-2,-2,0,0,-5,5,2,2') {
          ultimasNotas = [];
          setTimeout(() => { lluvia(['🌞', '☀️', '🌞', '😎'], 55); aviso('🌞 ¡Solecitos sonrientes! 🌞'); Voz.decir('¡Solecitos sonrientes!', { pitch: 1.4 }); }, 500);
        }
      }
      const tecla = e => { const i = TECLAS.indexOf(e.key); if (i >= 0 && !e.repeat) golpe(i); };
      document.addEventListener('keydown', tecla);
      teclaXilo = tecla;
      zona.append(el('p', { style: { margin: 0, fontSize: '20px', fontWeight: 600, textAlign: 'center' } }, '¡Toca las barras! 🎶 (Pista secreta: Do, Do, Sol, Sol, La, La, Sol...)'), xilo);
    }
    vista('estrellita');
    return { cerrar() { parar(); soltarTeclado(); } };
  }
};

      const llenaDeEstrellas = datos.slice(desde, desde + COLS.length).every(v => v && v.t === 'estrella');
      if (llenaDeEstrellas && !filasCelebradas.has(fila)) {
        filasCelebradas.add(fila);
        lluvia(['⭐', '🌟', '✨'], 40); aviso('⭐ ¡Fila de estrellas! ⭐'); Sonido.exito();
      } else if (!llenaDeEstrellas) filasCelebradas.delete(fila);
      const todoChocolate = datos.every(v => v && v.t === 'chocolate');
      if (todoChocolate && !empacho) {
        empacho = true;
        lluvia(['🍫', '🤢'], 45); aviso('🤢 ¡Empacho de chocolate!');
        Voz.decir('¡Uf! ¡Empacho de chocolate!', { pitch: 0.9 });
      } else if (!todoChocolate) empacho = false;
    }

    entrada.value = CENT;
    entrada.addEventListener('input', () => {
      const v = entrada.value;
      if (!v.includes(CENT) && v.length === 0) borrarAtras();
      else for (const ch of v.replace(CENT, '')) escribir(ch);
      entrada.value = CENT;
      try { entrada.setSelectionRange(1, 1); } catch (e) {}
    });
    entrada.addEventListener('keydown', e => {
      const ancho = COLS.length;
      const mov = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: ancho, ArrowUp: -ancho, Tab: 1 }[e.key];
      if (mov) { e.preventDefault(); seleccionar(sel + mov); }
      else if (e.key === 'Enter') { e.preventDefault(); seleccionar((Math.floor(sel / ancho) + 1) * ancho); }
      else if (e.key === 'Delete') { e.preventDefault(); poner(sel, null); seleccionar(sel); }
      else if (e.key === 'Escape') cerrarApp();
    });

    datos.forEach((_, i) => pintarCelda(i));
    recontar();
    requestAnimationFrame(() => seleccionar(0));
    enfocar();
    return { cerrar() { entrada.blur(); } };
  }
};

/* =========================================================

Apps.etiquetas = {

    const cv = el('canvas');

    const cara = el('div', { class: 'hud-caja hud-cara' }, '😃');

    const bCar = el('button', { class: 'btn blanco', title: 'Caramelos (tecla 2)', onclick: () => elegirMunicion('caramelo') }, '🍬');
    let musica = Sonido.metalEstrellita();
    const bMusica = el('button', { class: 'btn sel', title: 'Música', onclick: () => {
      if (musica) { musica.parar(); musica = null; } else musica = Sonido.metalEstrellita();
      bMusica.className = 'btn ' + (musica ? 'sel' : 'blanco');
      bMusica.textContent = musica ? '🎸' : '🔇';
    } }, '🎸');
    c.append(el('div', { class: 'doom' }, escena, el('div', { class: 'doom-hud' },
      el('div', { class: 'hud-caja' }, el('small', {}, 'MUNICIÓN'), el('div', { class: 'hud-botones' }, bEst, bCar)),
      cara,
      el('div', { class: 'hud-caja' }, el('small', {}, 'ETIQUETADO'), marcador),
      el('div', { class: 'hud-caja' }, el('small', {}, 'MÚSICA'), el('div', { class: 'hud-botones' }, bMusica)))));

    function elegirMunicion(m) {
      municion = m;
      bEst.className = 'btn ' + (m === 'estrella' ? 'sel' : 'blanco');
      bCar.className = 'btn ' + (m === 'caramelo' ? 'sel' : 'blanco');
      Sonido.clic();
    }
    function ponerCara(em, ms) { cara.textContent = em; tCara = performance.now() + ms; }

    const ctx = cv.getContext('2d');
    let W = 0, H = 0, dpr = 1, avance = 0, reloj = 0, proxima = 0.2, retro = 0;
    let boca = { x: 0, y: 0 };
    const cosas = [], balas = [], marcas = [];
    const mira = { x: 0, y: 0, ver: false };
    const ro = new ResizeObserver(() => {
      if (!escena.clientWidth) return;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = escena.clientWidth; H = escena.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    });
    ro.observe(escena);

    // Perspectiva: el suelo está a OJO por debajo de la vista; z es la distancia
    const OJO = 0.5, TECHO = 1.6, PARED = 1.25;
    const hz = () => H * 0.42, F = () => H * 0.9;
    const px = (x, z) => W / 2 + F() * x / z;
    const py = (alto, z) => hz() + F() * (OJO - alto) / z;

    function nuevaCosa() {
      const jefe = !cosas.some(o => o.jefe) && Math.random() < 0.1;
      const [e, n, alto] = jefe ? ['🧑‍💼', 'Jefe', 0.62] : elegir(COSAS);
      cosas.push({ e, n, alto, x: azar(-0.85, 0.85), z: 8, jefe, fase: azar(0, 6), pegatinas: [], bote: 0, huye: false });
    }
    function caja(o) {
      const s = F() / o.z, base = py(0, o.z), x = px(o.x, o.z);
      if (o.e === 'mesa') { const w = s * 0.95, h = s * 0.45; return { x: x - w / 2, y: base - h, w, h, s, base, cx: x }; }
      const h = s * o.alto;
      return { x: x - h * 0.55, y: base - h, w: h * 1.1, h, s, base, cx: x };
    }
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function cuad(p, color) {
      ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
      for (let k = 2; k < p.length; k += 2) ctx.lineTo(p[k], p[k + 1]);
      ctx.closePath(); ctx.fill();
    }
    function pegatina(x, y, tam, tipo, alfa = 1) {
      if (tam < 1) return;
      ctx.save(); ctx.globalAlpha = alfa; ctx.translate(x, y); ctx.rotate(-0.15);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1B1B2F'; ctx.lineWidth = Math.max(1, tam * 0.08);
      rr(-tam * 0.7, -tam * 0.55, tam * 1.4, tam * 1.1, tam * 0.25); ctx.fill(); ctx.stroke();
      ctx.font = `${tam * 0.8}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(MUNI[tipo], 0, tam * 0.05);
      ctx.restore();
    }

    function dibujarPasillo() {
      const zc = 0.3, zl = 40;
      ctx.fillStyle = '#D9D9E0'; ctx.fillRect(0, 0, W, hz());
      ctx.fillStyle = '#5B6B8C'; ctx.fillRect(0, hz(), W, H - hz());
      // Moqueta: franjas que se acercan al andar
      ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 2;
      for (let k = 0; k < 30; k++) {
        const z = k + 1 - (avance % 1); if (z < zc) continue;
        const y = py(0, z); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      // Fluorescentes del techo
      for (let k = 0; k < 14; k++) {
        const z1 = k * 3 + 1.5 - (avance % 3), z2 = z1 + 0.9; if (z1 < 0.35) continue;
        cuad([px(-0.35, z1), py(TECHO, z1), px(0.35, z1), py(TECHO, z1), px(0.35, z2), py(TECHO, z2), px(-0.35, z2), py(TECHO, z2)], '#FFFDE7');
      }
      // Paredes con puertas azules y columnas
      for (const lado of [-1, 1]) {
        const X = lado * PARED;
        cuad([px(X, zc), py(TECHO, zc), px(X, zl), py(TECHO, zl), px(X, zl), py(0, zl), px(X, zc), py(0, zc)], lado < 0 ? '#EDE6D3' : '#E3DBC4');
        for (let k = 0; k < 9; k++) {
          const z1 = k * 5 + (lado < 0 ? 2 : 4.5) - (avance % 5), z2 = z1 + 0.9; if (z1 < zc) continue;
          cuad([px(X, z1), py(0, z1), px(X, z1), py(1.05, z1), px(X, z2), py(1.05, z2), px(X, z2), py(0, z2)], '#1F5FD6');
        }
        ctx.strokeStyle = 'rgba(27,27,47,.25)';
        for (let k = 0; k < 20; k++) {
          const z = k * 2 + 1 - (avance % 2); if (z < zc) continue;
          ctx.lineWidth = Math.max(1, 6 / z);
          ctx.beginPath(); ctx.moveTo(px(X, z), py(TECHO, z)); ctx.lineTo(px(X, z), py(0, z)); ctx.stroke();
        }
      }
      ctx.fillStyle = '#C9BFA3';
      ctx.fillRect(px(-PARED, zl), py(TECHO, zl), px(PARED, zl) - px(-PARED, zl), py(0, zl) - py(TECHO, zl));
    }
    function dibujarCosa(o) {
      const r = caja(o);
      const bote = Math.sin(o.bote * Math.PI) * r.s * 0.08;
      ctx.save(); ctx.translate(0, -bote);
      if (o.e === 'mesa') {
        const grosor = r.h * 0.16, pata = r.w * 0.07;
        ctx.fillStyle = '#B5733A'; ctx.strokeStyle = '#1B1B2F'; ctx.lineWidth = Math.max(1, r.s * 0.012);
        for (const [x, y, w, h] of [[r.x, r.y, r.w, grosor], [r.x + pata * 0.5, r.y + grosor, pata, r.h - grosor], [r.x + r.w - pata * 1.5, r.y + grosor, pata, r.h - grosor]]) {
          ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);

      } else {
        ctx.font = `${r.h}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';

    function dibujarPistola() {
      const u = Math.min(W, H) / 720;
      const gx = W * 0.62 + (mira.ver ? (mira.x - W / 2) * 0.1 : 0), gy = H + 20 * u + retro * 16 * u;
      ctx.save(); ctx.translate(gx, gy); ctx.scale(u, u);

      ctx.fillStyle = '#1F5FD6'; rr(-22, -95, 44, 100, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#E63027'; rr(-62, -178, 124, 92, 22); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -134, 30, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFD21F'; ctx.beginPath(); ctx.arc(0, -134, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    function dibujarMira() {
      if (!mira.ver) return;

      ctx.beginPath(); ctx.arc(mira.x, mira.y, 16, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mira.x - 26, mira.y); ctx.lineTo(mira.x - 8, mira.y); ctx.moveTo(mira.x + 8, mira.y); ctx.lineTo(mira.x + 26, mira.y);
      ctx.moveTo(mira.x, mira.y - 26); ctx.lineTo(mira.x, mira.y - 8); ctx.moveTo(mira.x, mira.y + 8); ctx.lineTo(mira.x, mira.y + 26);

    }

    function disparar(tx, ty) {
      Sonido.init();
      const tipos = dios ? ['estrella', 'caramelo', 'estrella'] : [municion];
      tipos.forEach((tipo, k) => balas.push({ tipo, t: 0, ox: boca.x, oy: boca.y, tx: tx + (k - (tipos.length - 1) / 2) * 50, ty }));
      retro = 1;
      Sonido.barrido(1200, 400, 0.08, { onda: 0.25, vol: 0.1 });
      if (Sonido.ok()) Sonido.ruido(Sonido.t, 0.05, { vol: 0.15, filtro: 3000 });
    }
    function impacto(b) {

      for (const o of cerca) {
        const r = caja(o);

        o.pegatinas.push({ dx: (b.tx - r.cx) / r.s, dy: (r.base - b.ty) / r.s, tipo: b.tipo });
        o.bote = 1;
        total++; marcador.textContent = total;
        Sonido.chuche(b.tipo); Sonido.pop();
        textoFlotante(escena, b.tx, b.ty - 20, '¡' + o.n + '!');
        if (o.jefe && !o.huye) {
          o.huye = true;
          ponerCara('😎', 1800);
          aviso('🧑‍💼 ¡Has etiquetado al jefe!');
          Voz.decir('¡Has etiquetado al jefe!', { pitch: 1.3 });
        } else ponerCara('😆', 450);
        if (total % 25 === 0) {
          lluvia(['🏆', '⭐', '🍬'], 40); aviso('🏆 ¡Empleada del mes!'); Sonido.fanfarria();
          Voz.decir('¡Empleada del mes!', { pitch: 1.3 });
        }
        return;
      }
      marcas.push({ x: b.tx, y: b.ty, tipo: b.tipo, v: 1 });

    }
    function actualizar(dt) {

      avance += dt * vel; reloj += dt;

      if (proxima <= 0) { nuevaCosa(); proxima = azar(0.6, 1.3); }

        if (o.jefe) {

    }

      [...cosas].sort((a, d) => d.z - a.z).forEach(dibujarCosa);

      dibujarPistola();
      for (const b of balas) {
        const x = b.ox + (b.tx - b.ox) * b.t, y = b.oy + (b.ty - b.oy) * b.t - Math.sin(b.t * Math.PI) * 40;

      escena.classList.toggle('raton', mira.ver);

    escena.addEventListener('pointerdown', e => {
      const q = posEnLienzo(e, cv, W, H);
      if (e.pointerType === 'mouse') { mira.x = q.x; mira.y = q.y; mira.ver = true; }

    });

      if (e.target.matches('input, textarea')) return;
      if (e.key === '1') elegirMunicion('estrella');
      else if (e.key === '2') elegirMunicion('caramelo');
      else if (e.key === ' ') { e.preventDefault(); disparar(mira.ver ? mira.x : W / 2, mira.ver ? mira.y : hz() + H * 0.12); }

        // Easter egg: IDDQD, el truco de «modo dios» del Doom original → disparo triple
        if (codigo === 'iddqd') {
          codigo = ''; dios = !dios;
          cara.textContent = dios ? '😇' : '😃';
          aviso(dios ? '😇 ¡MODO DIOS! Etiquetas triples' : 'Modo dios desactivado');
          Sonido.fanfarria();
        }
      }
    };
    document.addEventListener('keydown', teclas);

    let raf = 0, ultimo = performance.now();
    function bucle(t) {
      const dt = Math.min(0.05, (t - ultimo) / 1000); ultimo = t;
      if (W > 0) { actualizar(dt); pintar(); }
      raf = requestAnimationFrame(bucle);
    }
    raf = requestAnimationFrame(bucle);
    return { cerrar() { cancelAnimationFrame(raf); ro.disconnect(); document.removeEventListener('keydown', teclas); if (musica) musica.parar(); } };
  }
};
