is similar to our excel templates, our cuenco will recognize it and help you during the processing of excels.\nNo more messages from clients like: \"I uploaded purchases yesterday, and they did not get processed!\"\nNow when users upload files/folders to El Cuenco, it will:\n1. classify files: Leia recognizes to which category it belongs…","a":"Ricardo Méndez Escobar"},{"i":322,"d":"13-07","c":"PROD","t":"Subida guiada de facturas dentro de las categorías","w":"The guided upload experience is now available for invoices inside categories\nThe same guided ingestion flow you already knew from My Files — the one that shows you exactly where each upload stands at every moment (upload → classification → reading.) — is now available for invoice uploads inside each category of a facility (electricity, water, waste, recharges, fuels…).…","a":"Miguel Contreras"},{"i":323,"d":"14-07","c":"PROD","t":"Enviar facturas por email a una dirección única por instalación","w":"Now you can email your invoices to a unique address for each facility and have them ingested into Dcycle automatically.\nWe are introducing a much faster way to upload invoices: inbound email per facility. Each facility can have its own email address, and any invoice you send to that address is ingested into Dcycle automatically, ready to be classified and reviewed.…","a":"Luis Escámez"},{"i":324,"d":"14-07","c":"PROD","t":"Superficie (m²) en instalaciones","w":"Working on a feature that a couple of clients' mentioned to us last week: adding an email address to send invoices attached and automatically add them to your facilities.\nAvailable soon this week!","a":"Luis Escámez"},{"i":325,"d":"14-07","c":"PROD","t":"MultiDB en empleados","w":"MultiDB again\nNow Employees!\nYou can now check the emissions and databases that Dcycle is using to calculate the commuting of employees!\nBut also the emissions that the telecommuting generates! New emissions available for employees now!\n· We always calculate telecommuting if the employee sets 1 day or more of telecommute per week\n· If the employee telecommutes every day…","a":"Diego Acuña"},{"i":326,"d":"14-07","c":"CLI","t":"Dos comandos nuevos de códigos de proveedor en dcy purchase","w":"Two new dcy purchase commands — you can now mess with purchases supplier codes straight from the CLI\nSee or export your suppliers with their current code & framework — dcy purchase suppliers\n· Wanna search by name? → dcy purchase suppliers --search ikea\n· Need a CSV? (lands in ~/Downloads, or wherever you point it) → dcy purchase suppliers --output suppliers.csv\n· Prefer JSON? → dcy purchase suppliers -o json…","a":"Diego Ramírez"},{"i":327,"d":"14-07","c":"PROD","t":"Migración de estilos de esg-x (tipografía, colores, tamaños)","w":"Esg-x style migration — step 1: typography\nThe embedded esg-x projects (AI-assisted reporting & double materiality) now use Inter — the same font as the rest of dcycle — instead of Montserrat, including chart axis labels.\nPR: github.com/Dcycle-by-WUM/esg-x-ui/pull/378 (live once merged & deployed)\nMore small visual alignment steps (colors, palette, radii) will follow, one at a time.","a":"Luis Escámez"},{"i":328,"d":"14-07","c":"WEB","t":"Loop automático que publica las novedades en la web","w":"The new automated loop for uploading product news to the website is now live!!! It's a great step forward, but it means we need to be more careful with the visual content we share through this channel (screenshots and videos), since it gets published directly.\nTo ensure quality and consistency, the following rules are now mandatory:\n1. Videos: must be recorded and sent using the Screen Recording app, with no padding.…","a":"Cristina Alcalá-Zamora"},{"i":329,"d":"15-07","c":"PROD","t":"Descargas separadas por categoría en Scope 1 y 2","w":"Yes finally we now have separate downloads for the categories of Scope 1 & 2\nNot needing to download all and link it to emissions -small step towards not being only ESG\nExploit the data you want to exploit:\n· Categories: heat, electricity, recharge, vehicles\n· Including monetary imports in the download\n· Download them between 2 dates, not only a full year","a":"Diego Acuña"},{"i":330,"d":"15-07","c":"PROD","t":"Control de los datos de todo el grupo desde el holding (productos vendidos)","w":"[1/21] Control the data of your whole group, from your holding account! Sold products\nA new loop is cooking\nHis first victim --Sold products category.\nHow?\n1. Plan phase: claude and I decided which categories to attack, divide them in 3 groups of difficulty and identify what changes needed to be done in each group…","a":"Ricardo Méndez Escobar"},{"i":331,"d":"16-07","c":"PROD","t":"PPWR habla de SKUs, no de \"unidades de envase\"","w":"The words used in Law are far away from the ones used by companies in the real world.\nIn PPWR, Law says \"Packaging unit\", but the companies say \"SKUs\". Dcycle now translates, letting companies keep their terms while complying with the regulation.\nYou can now link all your commercial references (SKUs) to a packaging unit and generate a single PPWR declaration of conformity that covers them all.","a":"Luis Escámez"},{"i":332,"d":"17-07","c":"PROD","t":"LCAs agrupadas en carpetas","w":"Group your LCAs into Folders\nIt’s been a while since we last shared LCA updates, but we’ve been working on it behind the scenes, I promise.\nAdvanced clients managing large numbers of LCAs sometimes need an extra layer of organization — so now they’ll be able to create folders to sort their LCAs however works best for them.…","a":"Boris Landívar"},{"i":333,"d":"20-07","c":"DOCS","t":"Verifications Hub en el Help Center","w":"Verifications Hub\nPreparing and passing a carbon footprint verification just got simpler. We've launched a Verifications Hub in the Help Center, with two dedicated guides:\n· For clients — a step-by-step method to reach the audit without surprises: the 3-stage method, the pre-verification checklist, Guarantees of Origin, Scope 3, Dcycle's internal pre-audit and the final report. Now with embedded walkthrough videos.…","a":"Cecilia Bayas"},{"i":334,"d":"21-07","c":"PROD","t":"PPWR: checks de formato (huecos, plásticos de un solo uso, reutilización)","w":"Discover the new PPWR format checks that flag void-space limits, single-use plastic bans, and reuse targets on your packaging units.","a":"Luis Escámez"},{"i":335,"d":"22-07","c":"PROD","t":"Descarga de todos los factores de emisión usados en un rango de fechas","w":"You can now download all of your emission factors used in a range of dates\nSomething that is always asked in verifications!\nJust receive an email with all of the info in an excel file!\nHope this is useful alongside the new GHG Report for el equipo\nNot included yet:\n· Purchases\n· Waste\n· Waste Water Treatment","a":"Diego Acuña"},{"i":336,"d":"23-07","c":"AGENT","t":"Leia evalúa tareas para todos los clientes","w":"Evaluate Tasks with Leia feature is now open to every client\nAssisting users to know the status of the project and track real progress\nCC: Almudena Gómez-Plata for the redesign","a":"Diego Acuña"},{"i":337,"d":"23-07","c":"AGENT","t":"Importación automática desde fichas técnicas de packaging","w":"Automatic import from packaging technical sheets\nUpload your packaging technical sheet and let Dcycle extract the data to automatically create or update your packaging units.","a":"Luis Escámez"},{"i":338,"d":"23-07","c":"DOCS","t":"Sección de Integraciones en el Help Center","w":"New in the Help Center: Integrations\nWe've added an Integrations section to the Product Guides → help.dcycle.io/product-guides#…\nFirst article: Integrating Dcycle: API, CLI, or MCP by data category. A plain-language guide written for non-technical profiles to decide when to integrate, when not to, and how — it breaks down the three ways to connect (API, CLI, MCP) by data category, with pros, cons, file limits…","a":"Daniel Sáenz de Tejada"},{"i":339,"d":"23-07","c":"SK /* Marquesina: las bombillas reciben su retardo en orden perimetral, así la luz
   corre alrededor de la máquina en vez de parpadear en bloque. */
(function bulbs(){
  const edges = [['top',16],['right',6],['bottom',16],['left',6]];
  const total = edges.reduce((a, [, c]) => a + c, 0);
  let n = 0;
  edges.forEach(([side, count]) => {
    const edge = document.createElement('div');
    edge.className = 'edge ' + side;
    for (let k = 0; k < count; k++){
      const b = document.createElement('div');
      b.className = 'bulb';
      const reversed = (side === 'bottom' || side === 'left');
      const idx = n + (reversed ? count - 1 - k : k);
      b.style.animationDelay = (-(idx / total) * 0.85).toFixed(3) + 's';
      edge.append(b);
    }
    n += count;
    marqueeEl.append(edge);
  });
})();

/* Entero uniforme en [0,n) con el CSPRNG del navegador. El rechazo descarta
   los valores del último bloque incompleto, que es lo que introduciría sesgo. */
function randInt(n){
  if(n <= 0) return 0;
  const limit = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return v % n;
}

/* Sonido sintetizado: clics de bobina mientras gira, ding-ding-ding al parar. */
let audio = null;
function ac(){
  if (!soundEl.checked) return null;
  try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { return null; }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}
function tone(freq, at, dur, {type = 'sine', gain = 0.06} = {}){
  const a = ac(); if (!a) return;
  try {
    const t = a.currentTime + at;
    const osc = a.createOscillator(), amp = a.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    amp.gain.setValueAtTime(0, t);
    amp.gain.linearRampToValueAtTime(gain, t + 0.006);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(amp).connect(a.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch (e) { /* sin audio disponible: el juego sigue */ }
}
function noise(at, dur, {freq = 3000, q = 0.9, gain = 0.08} = {}){
  const a = ac(); if (!a) return;
  try {
    const t = a.currentTime + at;
    const len = Math.max(1, Math.floor(a.sampleRate * dur));
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = a.createBufferSource(); src.buffer = buf;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = freq; bp.Q.value = q;
    const amp = a.createGain();
    amp.gain.setValueAtTime(gain, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(amp).connect(a.destination);
    src.start(t); src.stop(t + dur);
  } catch (e) { /* sin audio disponible: el juego sigue */ }
}
/* Clic de bobina: golpe mecánico, no un pitido. */
function tick(progress){
  noise(0, 0.03 + progress * 0.02, {freq: 3400 - progress * 1200, q: 1.4, gain: 0.05});
  tone(230 - progress * 80, 0, 0.02 + progress * 0.03, {type:'square', gain:0.02 + progress * 0.02});
}
/* Campanilleo de sala de juego: arpegio pentatónico que se ensancha al frenar. */
const VEGAS = [1046.5, 1318.5, 1568, 2093, 1568, 1318.5];
function jingle(step, progress){
  const f = VEGAS[step % VEGAS.length];
  tone(f, 0, 0.16, {type:'triangle', gain:0.028 + progress * 0.012});
  tone(f * 1.5, 0, 0.1, {type:'sine', gain:0.014});
}
/* Caja registradora: cajón, "cha" metálico, "ching" de campana y monedas. */
function chaChing(){
  tone(95, 0, 0.16, {type:'sine', gain:0.16});
  noise(0.005, 0.09, {freq: 5200, q: 0.7, gain: 0.14});
  [2637, 3136].forEach((f, i) => {
    tone(f, 0.075, 1.15, {type:'sine', gain: i ? 0.05 : 0.085});
    tone(f * 1.004, 0.075, 1.15, {type:'sine', gain: i ? 0.03 : 0.05});
  });
  tone(1318.5, 0.075, 0.5, {type:'triangle', gain:0.05});
  for (let k = 0; k < 11; k++){
    const at = 0.16 + k * 0.055 + Math.random() * 0.05;
    tone(1800 + Math.random() * 1600, at, 0.1, {type:'sine', gain:0.035});
    noise(at, 0.05, {freq: 6000 + Math.random() * 3000, q: 1.2, gain: 0.035});
  }
}

/* Impresora de tickets: servo bajando y tres golpes de cabezal. */
function printer(){
  const a = ac(); if (!a) return;
  try {
    const t = a.currentTime;
    const osc = a.createOscillator(), amp = a.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(150, t + 0.3);
    amp.gain.setValueAtTime(0.03, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    osc.connect(amp).connect(a.destination);
    osc.start(t); osc.stop(t + 0.34);
  } catch (e) { /* sin audio */ }
  [0, 0.09, 0.18].forEach(at => noise(at, 0.035, {freq: 2000, q: 2, gain: 0.03}));
}

/* Lluvia de monedas girando sobre la casilla premiada. */
function coinShower(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = sparksEl.clientWidth, h = sparksEl.clientHeight;
  sparksEl.width = w * dpr; sparksEl.height = h * dpr;
  const g = sparksEl.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const coins = Array.from({length: 30}, () => ({
    x: w * 0.5 + (Math.random() - 0.5) * w * 0.9,
    y: -12 - Math.random() * h * 0.32,
    vy: 4.6 + Math.random() * 3.2,
    vx: (Math.random() - 0.5) * 1.1,
    r: 5 + Math.random() * 5,
    ph: Math.random() * Math.PI * 2,
    sp: 0.18 + Math.random() * 0.16
  }));
  const t0 = performance.now();
  (function frame(now){
    const t = (now - t0) / 1500;
    g.clearRect(0, 0, w, h);
    if (t >= 1) return;
    const fade = t > 0.75 ? 1 - (t - 0.75) / 0.25 : 1;
    coins.forEach(c => {
      c.y += c.vy; c.x += c.vx; c.vy += 0.16; c.ph += c.sp;
      g.save();
      g.translate(c.x, c.y);
      g.scale(Math.max(0.14, Math.abs(Math.cos(c.ph))), 1);
      g.beginPath(); g.arc(0, 0, c.r, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,246,224,' + fade + ')'; g.fill();
      g.beginPath(); g.arc(0, 0, c.r * 0.55, 0, Math.PI * 2);
      g.strokeStyle = 'rgba(255,206,120,' + (0.85 * fade) + ')'; g.lineWidth = 1.4; g.stroke();
      g.restore();
    });
    requestAnimationFrame(frame);
  })(t0);
}
function celebrate(){
  const card = stripEl.children[1] && stripEl.children[1].querySelector('.card');
  if (card){ card.classList.remove('win'); void card.offsetWidth; card.classList.add('win'); }
  windowEl.classList.remove('won'); void windowEl.offsetWidth; windowEl.classList.add('won');
  machineEl.classList.remove('won'); void machineEl.offsetWidth; machineEl.classList.add('won');
  coinShower();
  chaChing();
}

function pool(){
  return ITEMS.filter(it => active.has(it.c) && !(noRepeatEl.checked && used.has(it.i)));
}
function fmtDate(d){
  const [dd,mm] = d.split('-');
  return Number(dd) + ' ' + MESES[Number(mm)-1];
}
function cell(item){
  const el = document.createElement('div');
  el.className = 'cell';
  const card = document.createElement('div');
  card.className = 'card';
  const p = document.createElement('p');
  p.textContent = item.t;
  const meta = document.createElement('div');
  meta.className = 'meta';
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = CATS[item.c];
  const date = document.createElement('span');
  date.className = 'date';
  date.textContent = fmtDate(item.d);
  meta.append(tag, date);
  card.append(p, meta);
  el.append(card);
  return el;
}
function render(cells, ty){
  stripEl.replaceChildren(...cells.map(cell));
  stripEl.style.transform = 'translateY(' + ty + 'px)';
}
function idle(){
  const p = pool();
  const picks = [];
  while (picks.length < 3 && p.length){
    const c = p[randInt(p.length)];
    if (p.length < 3 || !picks.includes(c)) picks.push(c);
  }
  render(picks.length ? picks : [
    {t:'No queda ninguna novedad con estos filtros', c:'PROD', d:'01-01'},
    {t:'No queda ninguna novedad con estos filtros', c:'PROD', d:'01-01'},
    {t:'No queda ninguna novedad con estos filtros', c:'PROD', d:'01-01'}
  ], 0);
  spinBtn.disabled = p.length === 0;
}
const ticketEl = document.getElementById('ticket');
const MES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function hideTicket(){
  ticketEl.hidden = true;
  const card = stripEl.children[1] && stripEl.children[1].querySelector('.card');
  if (card) card.setAttribute('aria-expanded', 'false');
}
function showTicket(item){
  const [dd, mm] = item.d.split('-');
  document.getElementById('t-eyebrow').textContent =
    'Novedad ' + (item.i + 1) + ' de ' + ITEMS.length + ' · ' + Number(dd) + ' de ' + MES_LARGO[Number(mm) - 1] + ' de 2026';
  document.getElementById('t-title').textContent = item.t;
  document.getElementById('t-cat').textContent = CATS[item.c];
  document.getElementById('t-author').textContent = item.a ? 'lo contó ' + item.a : '';
  const whatEl = document.getElementById('t-what');
  whatEl.dataset.full = item.w || 'Sin definición en el canal.';
  ticketEl.hidden = false;
  ticketEl.style.animation = 'none';
  void ticketEl.offsetWidth;
  ticketEl.style.animation = '';
  fitTicket();
  printer();
  ticketEl.focus({preventScroll: true});
}

/* Se proyecta: el texto baja hasta 13px para caber. Por debajo de eso no se lee
   desde el fondo de la sala, así que en lugar de seguir encogiendo se recorta
   por palabra (búsqueda binaria) hasta que entra. Nunca hay scroll ni recorte
   invisible: si sobra texto, se ve el "…". */
function fitTicket(){
  const what = document.getElementById('t-what');
  const full = what.dataset.full || '';
  const fits = () => what.scrollHeight <= what.clientHeight + 1;
  for (const px of [17, 16, 15, 14, 13]){
    what.style.fontSize = px + 'px';
    what.style.lineHeight = px >= 14 ? '1.5' : '1.42';
    what.textContent = full;
    if (fits()) return;
  }
  const put = n => {
    const cut = full.lastIndexOf(' ', n);
    what.textContent = full.slice(0, cut > 40 ? cut : n).trimEnd().replace(/[·,;:]$/, '') + '…';
  };
  let lo = 60, hi = full.length, best = 60;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    put(mid);
    if (fits()){ best = mid; lo = mid + 1; } else hi = mid - 1;
  }
  put(best);
}
function armCard(item){
  const card = stripEl.children[1] && stripEl.children[1].querySelector('.card');
  if (!card) return;
  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.textContent = 'toca para saber qué es';
  card.prepend(hint);
  card.classList.add('win');
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-expanded', 'false');
  card.setAttribute('aria-label', 'Ver qué es: ' + item.t);
  const toggle = () => {
    const open = !ticketEl.hidden;
    if (open) { hideTicket(); return; }
    showTicket(item);
    card.setAttribute('aria-expanded', 'true');
  };
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); e.stopPropagation(); toggle(); }
  });
}
document.getElementById('t-close').addEventListener('click', hideTicket);
ticketEl.addEventListener('click', hideTicket);
document.addEventListener('keydown', e => { if (e.code === 'Escape' && !ticketEl.hidden) hideTicket(); });

function status(){
  const p = pool();
  statusEl.innerHTML = 'En juego <b>' + p.length + '</b> · ya han salido <b>' + used.size + '</b> de <b>' + ITEMS.length + '</b>';
}

function spin(){
  const p = pool();
  if (spinning || !p.length) return;
  spinning = true;
  spinBtn.disabled = true;
  hideTicket();
  machineEl.classList.add('spinning', 'fast');
  machineEl.classList.remove('brake');
  machineEl.classList.remove('won');
  windowEl.classList.remove('won');
  windowEl.classList.add('spin');

  const winner = p[randInt(p.length)];
  const cellH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell-h'));
  const travel = 190 + randInt(26);                // casillas que pasan antes de parar
  const cells = [ITEMS[randInt(ITEMS.length)], winner];
  for (let k = 0; k < travel + 1; k++) cells.push(ITEMS[randInt(ITEMS.length)]);

  const from = -travel * cellH;
  let passed = 0, lastTick = 0, lastJingle = 0, jingleStep = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  render(cells, from);

  const finish = () => {
    stripEl.style.transform = 'translateY(0px)';
    stripEl.style.filter = 'none';
    used.add(winner.i);
    spinning = false;
    machineEl.classList.remove('spinning', 'fast', 'brake');
    windowEl.classList.remove('spin');
    celebrate();
    armCard(winner);
    status();
    spinBtn.disabled = pool().length === 0;
    spinBtn.focus({preventScroll:true});
  };

  if (reduced){ setTimeout(finish, 320); return; }

  const dur = 9200;
  /* Mitad del tiempo a velocidad de crucero (75% de la distancia) y mitad
     frenando el 25% restante. La cúbica arranca justo a la velocidad de
     crucero, así que no hay salto perceptible en la transición. */
  const CRUISE_T = 0.5, CRUISE_D = 0.75;
  const ease = t => t < CRUISE_T
    ? (t / CRUISE_T) * CRUISE_D
    : CRUISE_D + (1 - CRUISE_D) * (1 - Math.pow(1 - (t - CRUISE_T) / (1 - CRUISE_T), 3));
  const t0 = performance.now();
  let prev = from;
  (function frame(now){
    const t = Math.min(1, (now - t0) / dur);
    const e = ease(t);
    const ty = from + (0 - from) * e;
    const v = Math.abs(ty - prev); prev = ty;
    stripEl.style.transform = 'translateY(' + ty + 'px)';
    stripEl.style.filter = v > 6 ? 'blur(' + Math.min(9, v * 0.16) + 'px)' : 'none';
    const crossed = Math.floor((ty - from) / cellH);
    if (crossed > passed){
      passed = crossed;
      if (now - lastTick > (t < CRUISE_T ? 70 : 42)){ lastTick = now; tick(t); }
    }
    if (t > CRUISE_T) machineEl.classList.remove('fast');
    if (t > 0.75) machineEl.classList.add('brake');
    const beat = 130 + t * 190;
    if (t < 0.9 && now - lastJingle > beat){ lastJingle = now; jingle(jingleStep++, t); }
    if (t < 1) requestAnimationFrame(frame);
    else finish();
  })(t0);
}

Object.entries(CATS).forEach(([key,label]) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.type = 'button';
  b.setAttribute('aria-pressed','true');
  const count = ITEMS.filter(i => i.c === key).length;
  b.innerHTML = label + ' <em>' + count + '</em>';
  b.addEventListener('click', () => {
    if (spinning) return;
    if (active.has(key)) active.delete(key); else active.add(key);
    if (!active.size) active.add(key);
    b.setAttribute('aria-pressed', String(active.has(key)));
    idle(); status();
  });
  chipsEl.append(b);
});

spinBtn.addEventListener('click', spin);
soundEl.addEventListener('change', () => { if (soundEl.checked) jingle(0, 0.5); });
noRepeatEl.addEventListener('change', () => { hideTicket(); idle(); status(); });
document.getElementById('reset').addEventListener('click', () => { hideTicket(); used.clear(); idle(); status(); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); spin(); }
});

idle(); status();
</script>
</body>
