m now on. More focus, more clarity.\nNext steps:\ncommunicate to clients via mail\nimprove LCA project\nremove LCA access from home\nDetails:\nEN:\nES:","a":"Ricardo Méndez Escobar"},{"i":147,"d":"19-03","c":"PROD","t":"Galones para consumos de vehículos","w":"Quick update from el equipo\nCristina Marín told me today today that a client need Gallons for vehicles managed in the US. So thanks to the MultiDB capacity in vehicles category now we have gallons calculations for our US Friends.","a":"Boris Landívar"},{"i":148,"d":"19-03","c":"PROD","t":"Refresco visual de la encuesta de movilidad","w":"Small UI refresh for the employee mobility survey\nI had to do it, got the itch after filling in the survey the other day and couldn't let it go #fixwhatsbroken\nSuper simple changes, but I think they can have a real impact on the user experience and leave a good feeling when completing the survey.\nWhat changed:\n· Text centred and slightly formatted\n· Left/right navigation arrows (instead of up/down)\n· Survey progress bar…","a":"Cristina Alcalá-Zamora"},{"i":149,"d":"19-03","c":"SKILL","t":"Hooks de Claude Code: ty y ruff automáticos en el backend","w":"New Claude Code hooks in dcycle-backend-app — after every.py edit, ty (type check) and ruff (lint) run automatically. No more catching these manually! PR:","a":"Miguel Perez Contreras"},{"i":150,"d":"19-03","c":"SKILL","t":"/new-event: página de evento","w":"/new-event: Create an event page\nThis skill creates an event page to document Dcycle's presence at conferences, forums, or industry gatherings. It automatically generates all 4 locale versions (EN, ES, DE, PT).\nHow it works\n1. Asks for event context: name, date, location, venue, organizer, approximate attendees, and what the event was about.…","a":"Cristina Alcalá-Zamora"},{"i":151,"d":"19-03","c":"INIT","t":"Nueva fase: consolidación de UI y capa agéntica","w":"As we've been consolidating the UI, the product experience, and the core flows — and as we start building the agentic layer that will connect everything together — we're entering a phase where the small details that didn't matter as much before are starting to matter a lot. One of those details: emails.…","a":"Iñigo Medina"},{"i":152,"d":"20-03","c":"PROD","t":"Métricas de intensidad en pivot tables (por facturación, plantilla, producción)","w":"Intensity Metrics in Pivot Tables\nYou can now divide any environmental metric by revenue, employees, or production volume (or whatever you want!) — directly inside your pivot table.\nThis is a cornerstone for Action plans and Strategic planning (ISOs management system, decarbonization, environmental impacts, SBTi):…","a":"Ricardo Méndez Escobar"},{"i":153,"d":"20-03","c":"PROD","t":"Pivot table de despidos/bajas","w":"Layoffs Pivot Table\nDedicated pivot table for workforce terminations — break down by year, month, quarter, gender, age, contract type, labor agreement, and contract end reason. ESRS S1 ready, time-precise (counts in the exact end month).\nNext steps:\nCommunicate to clients with CSRD/GRI reporting needs\nVerify data with a few pilot organizations\nEN: Layoffs Pivot Table — EN\nES: Tabla Dinámica de Despidos — ES","a":"Ricardo Méndez Escobar"},{"i":154,"d":"23-03","c":"SKILL","t":"/sdr-copilot: lista de prospección semanal","w":"Nueva skill disponible: /sdr-copilot — genera tu lista de prospección de la semana en segundos.\nEs lunes. Si no tienes claro por dónde empezar, esto puede ayudar.\nCómo funciona\nLe dices tu nombre (o tu territorio) y hace el resto: consulta HubSpot, lee las visitas web de Dealfront, revisa tus tareas pendientes de la semana y puntúa cada empresa con ICP Fit, Intent y Timing.\n3 cosas pasan solas, sin que toques nada:…","a":"Jorge Latorre Escudero"},{"i":155,"d":"23-03","c":"PROD","t":"Tarjetas de factores de emisión unificadas en Data > Customize","w":"Small improvement in Data Customize\nWe've simplified the emission factors section: the \"Emission Factors\" and \"Custom Factors\" cards are now merged into one, with two tabs inside:\n· Configuration by category — factors organized by category, as always\n· Custom factors management (N) — your custom factors, with the counter visible at a glance\nThe result: fewer clicks, everything centralized and easier to find.","a":"Almudena Gómez-Plata"},{"i":156,"d":"23-03","c":"SKILL","t":"SDR Onboarding Tracker (app interna)","w":"New internal tool: SDR Onboarding Tracker\nI built an app to make sure every new SDR ramps to top performer as fast as possible.\nWe want every new SDR to feel supported from day 1. This tool helps us spot where someone might need a hand early on (whether it's more coaching on calls, faster access to tools, or just making sure nothing falls through the cracks. The faster we help them win, the faster they become unstoppable.…","a":"Paula Cons"},{"i":157,"d":"24-03","c":"WEB","t":"Demo Library en la web","w":"New section in the web: DEMO LIRBARY\nThe first version of the Demo Library on the website. Step 0 towards freemium product version, towards Leads generated thanks to the product.\nFrom the product team we will work in the next weeks to make the product more autonomous / self-service so a Freemium Product makes sense, but.why the product should wait to generate leads!…","a":"Ricardo Méndez Escobar"},{"i":158,"d":"24-03","c":"WEB","t":"Sección Plan de Movilidad Sostenible (Ley 9/2025)","w":"New web section live: Sustainable Mobility Plan (Ley 9/2025)\nI've published a new section explaining what Spain's Sustainable Mobility Law (Ley 9/2025), accelerated this week by RDL 7/2026, requires companies to do — and how Dcycle helps them comply:\nES →\nEN →\nWhy was this built:…","a":"Lucía Mosquera"},{"i":159,"d":"24-03","c":"SKILL","t":"Agente de auto-respuesta a candidatos en LinkedIn","w":"New recruiting automation: LinkedIn auto-reply agent\nEvery candidate who replies to a LinkedIn outreach deserves a fast, human response. The problem: between campaigns running in parallel and candidates across time zones, replies can take hours or days. Hours where the candidate goes cold or accepts another offer. So we (I) automated it.…","a":"Álvaro Granados"},{"i":160,"d":"25-03","c":"PROD","t":"Nueva interfaz de descargas en LCA","w":"New download interface and behaviour in LCA\nDid I already told you that our clients do not trust our results?? Yep, this also happens in LCAs, so we have fix it (or at least that’s what we think)\n· New interface for LCA Excel Download.\n· New download type, now if you are using an LCA result inside another LCA you can chose between two options:\n◦ Standard export: LCA pieces from other LCAs appear as a single aggregated line.…","a":"Boris Landívar"},{"i":161,"d":"25-03","c":"PROD","t":"Varios responsables por acción en los planes de acción de ISOs","w":"Management Systems - ISOs\nYou can now assign multiple people as responsible for a single action in your action plans.\nStarting today, you can assign multiple people to any action. This better reflects how teams actually work, where tasks often require collaboration from more than one person to be completed successfully.","a":"Luis Escámez"},{"i":162,"d":"25-03","c":"PROD","t":"Objetivos e indicadores compartidos entre proyectos de ISOs","w":"Improvements in Management Systems (ISO) Projects\nObjectives and indicators shared across projects\n· The management systems module now includes an objectives and indicators section. You can define your organization's quality and environmental objectives and track progress with indicators that include target and current values.…","a":"Luis Escámez"},{"i":163,"d":"25-03","c":"INIT","t":"Iniciativa para abrir la \"caja negra\" del cálculo","w":"From el equipo, we started an initiative last week\nLet me explain you why our most expert clients don’t trust us and what we are doing to change that:\n· Imagine Rogelio, a sustainability lead who’s been calculating carbon footprints for years. He uploads his data into Dcycle, emissions are calculated instantly… but the numbers don’t match. And he’s not the one who’s wrong.…","a":"Boris Landívar"},{"i":164,"d":"26-03","c":"PROD","t":"Descripciones y evidencias en emisiones históricas","w":"New in Dcycle: descriptions and evidence files in Historical Emissions\nYou can now better document your historical carbon footprint data directly in Dcycle. We've added two new fields to the Historical Emissions module:\nDescription: a free-text field to explain the data origin, methodology used, or any relevant context.…","a":"Ana Romero"},{"i":165,"d":"26-03","c":"PROD","t":"Carga masiva de doble materialidad (scores e IROs)","w":"Bulk upload for Double Materiality — now live in production!\nYou can now upload DM scores and IROs in bulk from an Excel file, instead of editing row by row. Yes, I know… slightly the forgotten child of our codebase — but it turns out some clients still expect to see their results inside the software… especially the ones who actually paid for it\nTwo new upload buttons (visible for Dcycle email-only, for now hehe):…","a":"Marina Oliveros"},{"i":166,"d":"26-03","c":"PROD","t":"Tipos de no conformidad personalizables en ISOs","w":"A taxonomy in ISOs that fits your processes\nNow you can define and manage custom nonconformity types for your organization, adapting the taxonomy to match your team's processes.","a":"Luis Escámez"},{"i":167,"d":"26-03","c":"PROD","t":"Memory: emisiones 95% más consistentes entre Excel, dashboards e informes","w":"MEMORYY NEWWWWS! el equipo\nEMISSIONS are now MORE CONSISTENT across Dcycle\nMemory solved one of the el equipo BIGGEST PAINS in LATEST VERIFICATIONS;\nExcel, visualizations, reports and dashboard emissions are 95% more consistent.\nWhat’s new in - DCYCLE APP\n· More consistency between Excel (A1/A2), dashboards, visualization, and reports\n· Orphan records detection in Carbon footprint project Control Data with errors…","a":"Jack"},{"i":168,"d":"26-03","c":"SKILL","t":"Rogel.IA: motor de nurturing","w":"Rogel.IA — The nurturing engine we all dreamed of\nWe've all been there. A call ends. The prospect isn't ready to buy yet. You know there's something there. And then. nothing. The account goes cold. You forget. They forget. The deal never happens.…","a":"Jorge Latorre Escudero"},{"i":169,"d":"26-03","c":"SKILL","t":"/task-mailer","w":"Following up on Jorge's message about Rogel.IA\nTo close the loop: /task-mailer is live.\nWhenever Rogel.IA (or any of you) creates a HubSpot task with \"MAIL\" in the subject, just tell Claude \"task mailer\" and it handles the rest:\n· Picks up all pending MAIL tasks\n· Pulls the contact and company context from HubSpot\n· Generates the email using mail-sdr-v1 logic (right tone, right angle, pain-first)…","a":"Paula Serrats"},{"i":170,"d":"27-03","c":"INIT","t":"Amplify vuelve: arranque de ciclo hacia software agéntico","w":"Hey there. Amplify is back (I miss u Pato ). New cycle starts Monday.\nYou've seen Leia. You know where we're headed: agentic software. But here's the thing: none of that works if we don't control how data enters Dcycle.\nRight now, our entire data import runs on a third-party blackbox (Nuvo). We can't improve it, we can't connect it to AI. We’re a data company. But our data ingestion pipeline is broken and we don’t own it.…","a":"Daniel Jiménez"},{"i":171,"d":"01-04","c":"PROD","t":"Borrado masivo por filtros (50 o 50.000 registros)","w":"Massive Bulk Delete by Filters\nNeed to clean 3,000 records? No more page-by-page.\nNow you can delete everything matching your filters in one go — 50 or 50,000.\nHow it works\n1. Apply your filters (year, file, category, status…)\n2. 2. Click the header checkbox → “Select all (N)”\n3. Hit Delete\n4. Confirm — done\nYou can also track the deletion process in the Processing section.\nAvailable in\nPurchases\nBusiness travel\nShipments…","a":"Rubén Castro"},{"i":172,"d":"01-04","c":"AGENT","t":"Dcycle MCP en producción: pregunta tus emisiones a Claude","w":"AGENTIC: Dcycle just got a lot smarter.\nA few months ago, someone on our team asked: \"What if I could just ask Claude to show me our emissions data?\"\nToday, that's reality.\nWe've just launched the Dcycle MCP Server — a remote server that connects AI assistants like Claude directly to your Dcycle data. No installation. No API keys. Just open Claude, authenticate with your Dcycle account, and start asking…","a":"Miguel Perez Contreras"},{"i":173,"d":"06-04","c":"PROD","t":"Fecha límite en encuestas de movilidad","w":"Survey deadline for employee mobility surveys\nThe problem\nUntil now, when a company sent mobility surveys to employees, there was no way to control when they expired. Employees who responded late generated data that altered the carbon footprint after it had already been closed.\nThe solution…","a":"Sergio Prieto García"},{"i":174,"d":"06-04","c":"PROD","t":"Datos económicos en facturas de consumo (importe y divisa)","w":"Economic data on consumption invoices\nFIIIINALYYYYY, you can now see the total amount and currency on your electricity, gas, and water invoices directly in Dcycle","a":"Luis Escámez"},{"i":175,"d":"06-04","c":"PROD","t":"Dcycle disponible en francés","w":"Fresh updates\nDcycle is now available in French too — even though I almost bankrupted the company on Claude credits and needed Diego Acuña ’s help to finally get the PR over the line… it’s live!\nSparkfood’s investees companies will definitely appreciate it, and I’m sure there are plenty more French-based clients who can now use it in their native language\nHappy Monday!","a":"Carla de Reparaz"},{"i":176,"d":"07-04","c":"AGENT","t":"Primer copilot de IA embebido en las vistas de datos (Compras)","w":"We've shipped the first version of an AI copilot embedded directly into our data views — starting with Purchases.\nAs the product architecture matures and the pieces fall into place for scale, adding capabilities like this becomes surprisingly straightforward. You'll find it in the toolbar, sitting alongside search, filter, sort, and column visibility. That placement is intentional.…","a":"Iñigo Medina"},{"i":177,"d":"07-04","c":"PROD","t":"Descargas asíncronas de pivot tables","w":"Async pivot table downloads — aligned with the rest of the platform\nWhen users clicked \"download\" on a pivot table widget, the system generated the Excel file synchronously — blocking the request until done. For organizations with large datasets (e.g. 1M+ logistic requests), this caused the download to hang for minutes or even timeout, leaving users frustrated with no feedback and no file.…","a":"Iñigo Medina"},{"i":178,"d":"07-04","c":"PROD","t":"Pivot table de remuneración y brecha salarial","w":"Remuneration & Wage Gap Pivot Table\nNew Social pivot category lets clients analyse annualized employee remuneration and gender wage gap (%) across their organization tree. This was the last pivot table needed to be compliant with the EINF. Few minor adjustments remain, but a milestone has been reached here.\nKey highlights:\nThree measures: Average remuneration (FTE-weighted), Gender wage gap (%), FTE headcount…","a":"Ricardo Méndez Escobar"},{"i":179,"d":"07-04","c":"SKILL","t":"/education-client-needs","w":"New Claude Code skill: /education-client-needs\nYou know that feeling when a client opens their 5th ticket this month asking the same question? (my day-to-day drama) We can't make clients autonomous if we don't even know what they don't know. This skill fixes that.\nWhat it does:\nRun /education-client-needs and it will automatically:\n· Pull all Customer Support tickets from the last 30 days…","a":"Cristina Marín"},{"i":180,"d":"07-04","c":"INIT","t":"Arranca Decarbonization Plans (wizard guiado por IA)","w":"Decarbonization Plans — we're building it\nWe're starting work on a super fucking cool decarbonization feature — an AI-guided wizard that helps users create a full reduction plan with targets, concrete actions, costs, and ROI.\nTeam: Luis Escámez, Daniel Jiménez, Cecilia Bayas, Lucía Mosquera\n@design — we need you to ship this! Let's chat\nFull spec →","a":"Luis Escámez"},{"i":181,"d":"07-04","c":"INIT","t":"Story: sentar las bases para escalar","w":"New Story — Shaping the base for scale\nThe problem isn't just that clients get lost. It's that we've grown fast, and every time we add something new, the people inside feels it.\nAnd clients say \"I don't understand what changed\"\nSooooo, for this cycle, we're reinforcing the foundation:\nBefore → After\nOne project, one org → One project, N orgs with clear roles\nAll scopes, always on → Only what you actually measure…","a":"Jadde Suarez"},{"i":182,"d":"08-04","c":"PROD","t":"Plantillas de visualización de Own Workforce (14 tablas automáticas)","w":"Own workforce Visualization Templates\nTired of creating “Own workforce ” tables for clients?\nYou can now automatically generate the 14 “Own workforce” pivot tables in EINF projects with a single click.\nHow to try it:\nEINF Project → Visualization → Own workforce Tables\nAll tables are generated with the category, metrics, columns, and date range already configured. They can then be edited, moved, or deleted individually.…","a":"Ana Romero"},{"i":183,"d":"08-04","c":"PROD","t":"Depuración de aguas en el Excel de Scope 1 y 2","w":"Wastewater Treatment data in Scope 1 & 2 Excel report\nThe Scope 1 & 2 Excel download now includes a Wastewater Treatment sheet — a new category alongside Combustion, Electricity, Recharge, Process, and Vehicles.\nWhat's in the new sheet:\n· Company, Facility, treatment name, and date range\n· Input volumes: treated water (m³), dry sludge (kg), discharged water (m³)…","a":"Sergio Prieto García"},{"i":184,"d":"08-04","c":"SKILL","t":"/clients-pulse y otra skill de CS","w":"New CS skills in Claude Code\nTwo new skills for the CS team:\n/clients-pulse — weekly portfolio health check per CS. Uses the official Data Health Score (Breadth, Depth, Freshness, Quality) across 19 data categories to classify each client with traffic lights. Posts a summary to #cs-portfolio-pulse with a thread per CS. It runs automatically every Monday so each CS can review their portfolio at the start of the week.…","a":"Cecilia Bayas"},{"i":185,"d":"08-04","c":"SKILL","t":"/ps-lca-scope y /ps-lca-evaluate","w":"New CS Skills: PS LCA Scope & Evaluate\nTwo new skills to streamline Professional Services LCA/EPD project lifecycle:\n/ps-lca-scope — From request to partner briefing\nAnalyzes a PS request from Notion, classifies the service type (LCA Essentials, Fully Assisted, EPD Complete, ISO), estimates hours and pricing, and generates a ready-to-send briefing for partners.\n/ps-lca-evaluate — From proposals to client pricing…","a":"Cecilia Bayas"},{"i":186,"d":"09-04","c":"PROD","t":"Data co-pilot de compras también informa de proveedores","w":"Small improvement in data co-pilot for purchases category\nNow, if you ask, it also delivers information about suppliers","a":"Ricardo Méndez Escobar"},{"i":187,"d":"09-04","c":"PROD","t":"Borrado masivo de facturas","w":"Massive Invoice Deletion — now live\nel equipo Our clients asked for it: “I need to delete many invoices at once.”\nNow you can. From today, you can select, preview, and delete multiple invoices in one go — no more one-by-one, no wasted time.\nHow it works\n1. Select invoices across any facility category (electricity, heat, water, recharges, processes)\n2. Preview before deleting\n3. Delete all at once…","a":"Jack"},{"i":188,"d":"09-04","c":"SKILL","t":"/news-comms: avisar a los clientes que sufrían el problema resuelto","w":"New internal tool: /news-comms\nEvery time we ship a feature, there are clients who suffered the exact problem it solves — but nobody tells them. Now that's automated.\nHow it works\n1. Someone posts a product update in #product-news\n2. Run /news-comms <link-to-the-message>…","a":"Luis Escámez"},{"i":189,"d":"10-04","c":"PROD","t":"Consumo de combustible en pivot tables (fijo y móvil)","w":"New in pivot tables: fuel consumption\nYou can now analyze stationary and mobile fuel side by side in a single view. Break it down by fuel type, source, or time period — across all your projects.","a":"Luis Escámez"},{"i":190,"d":"10-04","c":"PROD","t":"Región seleccionable en materiales de LCA","w":"Choose your region in LCA materials\nWhen a material in an LCA is linked to an ecoinvent database entry,\nits region was previously auto-computed from the country — with no\nway to override it.\nNow you can pick it yourself.\nWhen editing a material with a linked impact source, the Country\nor region field under Database reference becomes a selector showing\nall available geographic options for that activity (e.g. DE, RER…","a":"Miguel Perez Contreras"},{"i":191,"d":"13-04","c":"PROD","t":"Emails de invitación separados: nuevo usuario vs. usuario existente","w":"We've split the invitation email into two distinct flows: new users now receive a proper welcome email when they first join Dcycle, while existing users get a tailored message when invited to a new organization.\nThis makes the onboarding experience clearer for everyone.","a":"Iñigo Medina"},{"i":192,"d":"13-04","c":"PROD","t":"Columna \"nombre del vehículo\" en todos los informes","w":"We've added a \"Vehicle Name\" column to all vehicle download reports — scope reports, category downloads, and the reporting module exports.\nAs product stability grows, we're progressively enriching the download experience with more useful data.","a":"Iñigo Medina"},{"i":193,"d":"13-04","c":"PROD","t":"Redirección a la URL original después del login","w":"URL redirect after login now works across all auth paths\nUntil now, when you clicked a shared link (e.g. a dashboard, a specific report, an invite) and weren't logged in, you'd always land on the organization selector after signing in — losing the original URL. You had to manually navigate back to where you intended to go.…","a":"Iñigo Medina"},{"i":194,"d":"13-04","c":"PROD","t":"Fix de puntos de suministro de Datadis","w":"Datadis supply points fix deployed\nDatadis has a known limitation: when fetching distributor codes for a\nNIF, it only returns the ones with active contracts — meaning NIFs\nwith inactive or historical contracts were silently missing supply\npoints.\nWhat changed: instead of relying on Datadis to tell us which\ndistributor codes to query, we now call all distributor codes…","a":"Miguel Perez Contreras"},{"i":195,"d":"14-04","c":"PROD","t":"Importe y divisa al crear y editar facturas","w":"More towards client autonomy and more valuable insights from Dcycle's data capabilities:\nNow you can record the amount and currency of each invoice directly from the creation and editing form and split amounts are correctly displayed.\nFrom feedback to reality in less than 24h","a":"Luis Escámez"},{"i":196,"d":"14-04","c":"CLI","t":"invoice recalculate","w":"New dc-walrus command: invoice recalculate\nWhen clients panic because their invoices are stuck showing emissions as \"not calculated\", we now have a fix that takes minutes instead of manually clicking and saving each one.\nYou can now recalculate emissions for invoices directly from the CLI:…","a":"Cristina Marín"},{"i":197,"d":"15-04","c":"PROD","t":"Notificaciones in-app al invitar a una organización","w":"In-app notifications for organization invites\nWhen an existing user is invited to a new organization, they now receive a real-time in-app notification — no need to check email. The notification shows who invited you and which organization, and clicking it takes you to the org selector with the new org ready to go.\nAlso fixed: the notification badge is now visible when the sidebar is collapsed.","a":"Rubén Castro"},{"i":198,"d":"15-04","c":"PROD","t":"Ordenación personalizada en widgets de pivot table y gráficos","w":"Custom sorting for pivot table widgets is here\nYou can now sort pivot tables, bar charts, and pie charts by any measure value (ascending/descending) and define custom hierarchy orders via drag & drop — and both can coexist. Click any column header in the table to sort, or use the new sort popover for full control.","a":"Rubén Castro"},{"i":199,"d":"16-04","c":"CLI","t":"La CLI pasa a llamarse dcy (+ mejoras)","w":"DCYCLE CLI — Updates\nWe've shipped some changes to the CLI this week. Here's what's new:\nNew binary name\nWe’re saying goodbye to our dear dc-walrus in favor of a shorter, more memorable name: dcy.\n(We’ll keep you in our hearts )\nThe CLI is now dcy (previously dc-walrus). If you have the old version installed:\nIf you already have dcy installed, just run:\nWhat’s changed…","a":"Miguel Perez Contreras"},{"i":200,"d":"17-04","c":"DOCS","t":"Base de ISO 14001/50001 lista para ventas, CS y SD","w":"ISO 14001/50001 — foundation ready\nNobody at Dcycle had ever implemented an ISO before. This week we built everything from scratch so sales, CS and SD have solid answers from day one.\nThe key message for sales: Dcycle covers the DO/CHECK/ACT phases — configuring and running the management system.…","a":"Cecilia Bayas"},{"i":201,"d":"20-04","c":"PROD","t":"Pre-Audit automatizado","w":"Pre-Audit automation is live\nAfter months of running queries one by one in QuickSight and stitching together charts manually, we are officially retiring that workflow forever.\nWe have shipped /pre-audit — a Claude Code skill that connects to the production read-replica, runs 54 SQL queries across the full organization tree, and generates a standalone HTML report with a Health Score, color-coded findings…","a":"Sergio Prieto García"},{"i":202,"d":"20-04","c":"AGENT","t":"Soporte asistido por IA en producción","w":"AI-assisted support is live!\nThis is yet another initiative to take our strategy from ideas to reality: we are aiming to scale CS and achieve product autonomy as our focus for Q2.\nSupport tickets now receive an automatic AI-generated response within seconds, helping you get answers faster than ever.…","a":"Luis Escámez"},{"i":203,"d":"20-04","c":"CLI","t":"vehicle delete-consumptions","w":"New command available in dcy (formerly dc-walrus):\nvehicle delete-consumptions — bulk-delete all vehicle consumptions for an organization within a date range.\ndcy vehicle delete-consumptions\nWhat it does:\n- Bulk-deletes vehicle consumptions filtered by date range\n- --include-subsidiaries recursively includes all child organizations\n- --start-date and --end-date are required to prevent accidental mass deletions…","a":"Ana Romero"},{"i":204,"d":"21-04","c":"PROD","t":"Dcycle deja de ser GHG: GHG pasa a ser un proyecto","w":"Dcycle is no longer GHG. GHG is a project in Dcycle.\nOne client may run sustainability at a small company requiring only a Scope 1&2 carbon footprint.\nAt the same time, another user from a bigger company needs to deliver a full carbon footprint with all 15 categories.…","a":"Ricardo Méndez Escobar"},{"i":205,"d":"21-04","c":"AGENT","t":"Endpoint GET /v1/waste-efs","w":"The GET /v1/waste-efs endpoint is now available. The client can use it to look up the waste_efs_id they need for their LER/RD code combinations.\nFull documentation here:\nQuick example — find the waste_efs_id for LER code 200101 + RD code R3:\nThe response returns the id field, which is the waste_efs_id to use in POST /v1/wastes:…","a":"Miguel Contreras"},{"i":206,"d":"21-04","c":"SKILL","t":"/emissions-expert","w":"Skill created at /emissions-expert\nWhat it does:\nStep 1 — asks for the methodology: GHG Protocol, ISO 14064, GLEC, LCA, or General\nStep 2 — asks for the specific category within that methodology\nStep 3 — it goes to backend repository calculation logic in that category\nStep 4 — responds with the full template:\nWhat it covers:\n· Calculation formula\n· Required variables and inputs…","a":"Daniel Sáenz de Tejada"},{"i":207,"d":"22-04","c":"PROD","t":"Coste de consumos de vehículos por empresa, divisa y matrícula","w":"Discover how much you spend on your vehicle consumptions, broken down by company, currency, license plate, type and more.\nIntroducing a new pivot-table category: Vehicle consumptions spend. You can now build dashboards that measure exactly how much money goes into each fuel consumption of your fleet, not just the emissions it generates.","a":"Luis Escámez"},{"i":208,"d":"22-04","c":"PROD","t":"Scope 3 de vehículos disponible de nuevo","w":"Scope 3 emissions for Vehicles AVAILABLE AGAIN\nSorry we had issues with them and this were disabled for quite a long time, but we just enabled them again and removed the banner from the app\nel equipo","a":"Diego Acuña"},{"i":209,"d":"22-04","c":"AGENT","t":"Nueva herramienta MCP get_greenhouse_gas_emissions","w":"Making more useful our MCP, so I just shipped a new tool: _get_greenhouse_gas_emissions_\nIt lets Claude (and other LLMs) query our validated GHG emission data directly. A few highlights:\n· Queries all the kpi related to emissions— only fully valid, enabled records\n· Supports all 25 emission categories, or omit category to span all scopes at once…","a":"Miguel Perez Contreras"},{"i":210,"d":"22-04","c":"INIT","t":"Build your own reports, empezando por GHG","w":"Is starting new initiative today!\nBuild your own reports — starting with GHG\nGHG is no longer enough.\nClients need control, flexibility, and real ownership of their reports. → We’re making it happen.\nWe’re turning Report Builder into the new standard:\n· Combine internal + external data\n· Build fully custom reports\n· Auto Save, version, and collaborate\n· No more manual inspect hacks from el equipo…","a":"Jack"},{"i":211,"d":"22-04","c":"INIT","t":"Nuevo modelo de servicio","w":"Dcycle has grown. Clients are bigger, projects are more complex, and so is the team. Time for our service model to match (Not a new feature — but a big step towards client autonomy and the best experience we can deliver.)\nThis is the story of how CS and PS went from being the team that walks with you at every step — and still are, always will be — to doing it with a defined scope, clear expectations, and measurable outcomes…","a":"Cecilia Bayas"},{"i":212,"d":"24-04","c":"AGENT","t":"Sneak peek: Leia para Decarb (primer plan de reducción)","w":"Sneak peek: Leia for Decarb\nSharing our first basic reduction plan — built for AWWG using Leia\nHeads up: this is strictly confidential. Please don’t share outside the team — AWWG is a very sensitive client.\nMore to come soon!","a":"Cecilia Bayas"},{"i":213,"d":"27-04","c":"CLI","t":"Borrado masivo de productos vendidos","w":"New dcy command: bulk-delete sold products\nThis morning a client uploaded 2834 sold products by mistake (she was just testing lol). The UI deletes one at a time. Do the math. Plus: she needs them to be urgently deleted by the end of the day (encima sabes)\nSo dcy sold-product delete-bulk was born — feed it a file of IDs, walk away, come back to a clean DB.…","a":"Cristina Marín"},{"i":214,"d":"28-04","c":"PROD","t":"Informe GHG: elegir organizaciones a consolidar y aplicar el enfoque GHG","w":"GHG Report: choose the orgs to consolidate + the GHG Protocol approach now actually applies\nUntil today the report was tied to a single parent org and consolidated its entire matrix tree at 100%. The approach field was descriptive metadata only — it didn't change any number, consolidation was always operational.…","a":"Miguel Contreras"},{"i":215,"d":"28-04","c":"PROD","t":"Pre-Audit convertido en un botón","w":"Big news: Pre-Audit is now a button.\nLet me tell you a story.\nWhen I joined Dcycle, one of my first tasks was running a pre-audit on an organization's data before a verification. There was no process. No documentation. No checklist. Just me staring at the app, checking that the facility had data, that nothing looked too weird, that zeros weren't everywhere — all based on gut feeling and experience. That was it.…","a":"Sergio Prieto García"},{"i":216,"d":"29-04","c":"CLI","t":"custom-ef delete-bulk","w":"New dcy command: custom-ef delete-bulk\nA client recently uploaded 195 custom emission factor groups with mistakes. The UI currently has no filters or bulk delete — so here's a temporary workaround until that's addressed by el equipo\nWhere <ids-fileis a text file with one group UUID per line.\nFlags:\n· --yes/-y— skip the confirmation prompt\n· --org— override the organization ID\n· --format json— structured output for scripting…","a":"Cristina Marín"},{"i":217,"d":"30-04","c":"WEB","t":"Landing del cuestionario CDP","w":"New landing page for CDP Questionnaire live now at dcycle.io/platform/cdp-questionnaire\nThe page covers the full CDP preparation workflow: collecting energy and waste data from every facility, automatic unit conversion (invoices → MWh and tonnes), and exporting CDP portal tables with evidence links. The AI/MCP angle is there too, but as a secondary feature once your data is already structured in Dcycle.…","a":"Cristina Alcalá-Zamora"},{"i":218,"d":"30-04","c":"INIT","t":"Arranca la iniciativa de Custom KPIs","w":"Jack Daniel Sáenz de Tejada Ana Mateu and myself just started a new adventure: <#C0B0X229AHJ|inititative-custom-kpis>\nThis one is cool AF and has been looong been due. With Custom KPIs, the user will be able to create a metric and run a collection campaign to data owners.\nWho needs this feature? Important clients and partners like Aludec, LUCTA, COMSA and Spora, plus basically al EINF/CSRD!","a":"Luis Escámez"},{"i":219,"d":"04-05","c":"DOCS","t":"Guías de requisitos de datos del GHG Protocol","w":"New skill: /expert-ghg-protocol in dcycle-cs-skills repo\nEverytime there is a doubt on how the GHG Protocol requires any piece of information or how any calculation should be done:\nAuditor calls client and client calls CS\nCS answer\nCS calls a databro and databro answers\nMost of the times CS or databros need to check the GHG Protocol methodology documents to confirm the answer.…","a":"Ricardo Méndez Escobar"},{"i":220,"d":"04-05","c":"SKILL","t":"/expert-ghg-protocol","w":"New skill: /expert-ghg-protocol in dcycle-cs-skills repo\nEverytime there is a doubt on how the GHG Protocol requires any piece of information or how any calculation should be done:\nAuditor calls client and client calls CS\nCS answer\nCS calls a databro and databro answers\nMost of the times CS or databros need to check the GHG Protocol methodology documents to confirm the answer.…","a":"Ricardo Méndez Escobar"},{"i":221,"d":"05-05","c":"PROD","t":"SFDR (PAIs) convertido en proyecto","w":"SFDR Framework, a.k.a \"PIAs\", has become a project!\nNow, organizations of type \"Investment Fund\" can manage their PAIs (PIAs in Spanish) report from a project in Dcycle.\nThis a report where Investment Funds collect and report data from their Investees.\nFunds will have access to:\n· Investment vehicles: manage their investments\n· Investees: manage their inversions\n· Dashboard: study their carbon footprint metrics…","a":"Ricardo Méndez Escobar"},{"i":222,"d":"05-05","c":"CLI","t":"invoice recalculate --unit-id","w":"New dcy command: invoice recalculate --unit-id\nA client had 110 invoices \"under review\" in 7 different facilities without a unit, which silently blocks recalculation — the PUT goes through but the calc does nothing. There was no bulk way to fix this from the UI, so here's a CLI workaround.\ndcy invoice recalculate --org <org_id--facility <facility_id--unit-id <unit_id>…","a":"Cristina Marín"},{"i":223,"d":"06-05","c":"PROD","t":"MultiDB disponible en Scope 1 y 2","w":"MultiDB is now available in Dcycle for Scope 1 and 2\nDon’t you know what MultiDB is? Let us explain:\nIt means that Dcycle is now capable of handling Multiple Emission Factor Databases and can also add new ones in record time.\nBut it also means that from today, any Dcycle user can:\n· See which emission factor database is behind their calculations.\n· Autonomously choose the emission factors they want to use.…","a":"Boris Landívar"},{"i":224,"d":"06-05","c":"PROD","t":"Emisiones location-based en todas las facturas de electricidad","w":"Extras about MultiDB\n· Location based emissions in electricity are calculated now for every electricity invoice\n· Recalculate bulk invoices, select them and you have a new icon button to do it next to the delete in bulk one\n· Better energy results for invoices, you can now view energy as a column in the invoices list","a":"Diego Acuña"},{"i":225,"d":"06-05","c":"PROD","t":"Documentar supuestos en LCA","w":"Document assumptions in LCA\nLCA is one step closer to be audit-ready. Now you can document assumptions and collaborate with your team directly on the blocks of your Life Cycle Assessment scenarios.\n· Add assumptions to each block\n· Mention @ your colleagues or auditor to collaborate\nCan't wait to see what the new report builder does with this information embedded in the data!","a":"Luis Escámez"},{"i":226,"d":"06-05","c":"PROD","t":"Número medio de contratos: cumplimiento total de la Ley 11/2018","w":"We're now fully compliant with Law 11/2018 — and here's the metric that closed the gap\nThe last piece we were missing: average number of contracts. We've just shipped it, and the methodology behind it is worth explaining because it's non-trivial.…","a":"Marina Oliveros"},{"i":227,"d":"07-05","c":"PROD","t":"Descargas multi-organización","w":"Multi-org downloads are here!\nUntil now, if you had a group of companies, you had to download each organization's data separately. Not anymore.\nYou can now select multiple organizations and download all their data in a single click — across all categories: water, waste, business travel, purchases, employees, electricity & fuel, and transport routes.\nTwo export modes:…","a":"Miguel Contreras"},{"i":228,"d":"08-05","c":"INIT","t":"Anuncio de Custom KPIs","w":"Heads up! New feature incoming: custom KPIs\nA reminder that this feature is coming and it will open so many possibilities: custom KPIs, supplier homologation. maybe even PIAs!\nThis feature allows clients to collect data from inside AND outside the company. For example, Hanna Sola needs to track how many pigs each farm is producing per year. She creates this KPI assign it to Manolo, he has that information.…","a":"Luis Escámez"},{"i":229,"d":"11-05","c":"AGENT","t":"Leia: primera capa agéntica real de Dcycle","w":"Hey there, we're back\nAfter killing invofox/nuvo (soon out of the app too ), it's time for Dcycle's first agentic layer: Leia.\nThis time for real. Not a skill. A real Agent, with its own brain and its own tools.\nDcycle stops being a calculator and helps companies talk money through data.\nBiggest experiment we've ever run. Last cycle was already wild (we rewrote the whole processing pipeline from scratch and it's working).…","a":"Daniel Jiménez"},{"i":230,"d":"11-05","c":"INIT","t":"Land arranca la máquina de recomendaciones y recordatorios","w":"Land is back! We will spend the next ~10 days (until 22nd May)~ 5 days (until 18th May) on building the first piece of Dcycle Recommendations and Reminders Machine\nToday, most of out customers like Susana from Aldelis (Aves Nobles y Derivados) depend heavily on their Customer Success to complete a Carbon Footprint project. She only uses mails and meetings to get a clear idea on what to do next.…","a":"Ricardo Méndez Escobar"},{"i":231,"d":"12-05","c":"PROD","t":"Custom KPIs en producción","w":"Today is the day in which our clients break free from our rigid data model.\nWe present to you: Custom KPIs!!\nCollect custom KPI data: create any KPI you need, collect data from internal or external users, get automatic reminders, and get your data with audit trails!\nRead the full changelog here!","a":"Luis Escámez"},{"i":232,"d":"12-05","c":"PROD","t":"Invofox fuera de Facilities","w":"It has been already a day without Invofox inside Facilities -when uploading PDF invoices\nHope no one has been affected by it, nor clients nor our demos\nAny suggestions are welcome team\nYou will only notice that now you just need to upload a file like in the Cuenco, and that is enough\nYou will also see a Confidence Badge to showcase how each field was read by our OCR","a":"Diego Acuña"},{"i":233,"d":"13-05","c":"PROD","t":"MITECO 5.0 en vivo","w":"MITECO 5.0 IS NOW LIVE\nMITECO just updated its emission factors… and if clients don’t wait, neither do we\nStarting now, new:\nelectricity invoices\nvehicle consumption\nstationary fuels invoices\nusing MITECO as source will automatically be calculated with version 5.0.\nWhat’s new?\n· 32 new electricity suppliers added\n· Immediate compatibility for new calculations and recalculations…","a":"Lucedh Hernandez"},{"i":234,"d":"14-05","c":"PROD","t":"Borrado de proveedores de compras","w":"You can now delete purchase suppliers!\nLike Hannah Montana would say, \"everybody makes mistakes\" - and our clients make them all the time. Eg: uploading a purchase supplier that shouldn't have been uploaded or ending up with a bunch of suppliers that never had a single purchase linked to them. Well, now you they clean them up!…","a":"Cristina Marín"},{"i":235,"d":"14-05","c":"PROD","t":"Selección del tipo de factura antes de la carga masiva","w":"Now you select the type of invoices you want to bulk upload before doing so\n· The template now doesn't have a lot of mixed columns that overlap\n· Easier to know what to input for each category","a":"Diego Acuña"},{"i":236,"d":"18-05","c":"PROD","t":"Máquina de recomendaciones y recordatorios en proyectos GHG","w":"Recommendations & Reminders Machine is LIVE\nStarting today, GHG Protocol projects come with built-in recommendations:\n· Dcycle tells clients what data is missing and how to upload it!! Right inside the project home\n· First reminder emails go out May 25th\nThe \"I don't know what to do next\" panic from Susana finally answered by the product\nFull story → <","a":"Jadde Suarez"},{"i":237,"d":"19-05","c":"PROD","t":"Reports reconstruidos: nueva experiencia de reporting","w":"Huge kudos to my beloved el equipo team\nRubén Castro → The Report Builder wizard of Dcycle\nSergio Prieto García → Bringing the first real-time uncertainty analysis to Dcycle\nMiguel Perez Contreras → Owner of the first AI-powered GHG Expert for Reports\nBig cycle completed. More to come.","a":"Jack"},{"i":238,"d":"19-05","c":"PROD","t":"Report Builder: crear informes GHG y cualquier otro desde el proyecto","w":"Create GHG reports and ANY report directly from your project\nYou can now build your own GHG report directly from the project. Start from a template or create your own report from scratch.\nAs easy a this… no extra setup.\nVideo below","a":"Jack"},{"i":239,"d":"19-05","c":"PROD","t":"Colaboración en tiempo real en informes","w":"Fasten your seatbelts…\nREPORTS in Dcycle: has changed forever! A completely new experience!\nel equipo rebuilt the reporting experience in projects. Over the next messages we’ll show the biggest improvements: report creation, real-time collaboration, AI support, uncertainty analysis, and more.\nThis is a big step toward making reports feel like a real product, not just an export.\nARE YOU READYyyyyyyYYyyyy?","a":"Jack"},{"i":240,"d":"19-05","c":"AGENT","t":"Primer GHG AI Expert (entrenado con el GHG Protocol)","w":"Meet the first GHG AI Expert\nThis is not a generic chatbot.\nIt’s trained with official GHG Protocol documentation.\nAsk any question about methodology, scopes, or categories and get reliable answers with references.\nVideo below","a":"Jack"},{"i":241,"d":"19-05","c":"PROD","t":"Análisis de incertidumbre en vivo en el informe GHG","w":"Live Uncertainty Analysis is now available\nWhen downloading your GHG report, you can now include a real-time uncertainty analysis based on actual project data.\nUseful for:\n· Better transparency\n· Better understanding of data quality\n· ISO 14064 compliance\nVideo below","a":"Jack"},{"i":242,"d":"19-05","c":"PROD","t":"Proyectos ISO 14064 en el idioma del verificador","w":"ISO 14064 projects — speak your verifier's language\nReporting under 14064 used to mean translating between three languages: what the auditor asks, what the client measures, and what Dcycle shows. That gap costs CS hours, slows audits and creates room for misunderstandings.…","a":"Ricardo Méndez Escobar"},{"i":243,"d":"19-05","c":"PROD","t":"Columnas personalizadas en compras (POC)","w":"Custom Purchase Columns — POC demo\nQuick demo of the custom fields feature for purchases. Users can define their own columns (text, number, date, yes/no, select) per organization, manage them from the toolbar, and see values inline in both the table and the edit form.\nNot yet available in the app, just a poc. Users will be allowed to upload a file with custom columns and use them apart from ours.","a":"Iñigo Medina"},{"i":244,"d":"21-05","c":"PROD","t":"Filtros automáticos por fechas del proyecto en instalaciones","w":"Automatic filters in Facilities to see first the data within the date ranges of the project\nNow, inside projects, when you enter into a facility you see the data filtered by the start date and end date of the project.\nYou can still remove the filter and have a look at all your data.\nSoon: to be applied in the rest of data categories\nel equipo let us know how you and your clients feel about this change","a":"Ricardo Méndez Escobar"},{"i":245,"d":"22-05","c":"DOCS","t":"Help Center en help.dcycle.io","w":"Alright team, finally: we now have a help center: help.dcycle.io\nFor a while our client resources have been scattered across Notion, decks, emails and Loom. From now on they have a single home.\nThe idea is simple: make it the place clients go when they have a question, before reaching out to us = increasing autonomy. For that to work, the content needs to be complete and updated— and that's where the whole team comes in.…","a":"Cristina Marín"},{"i":246,"d":"25-05","c":"INIT","t":"Live Deal Scoring","w":"Launching this week: Live Deal Scoring\nGoal — focus sales energy on the deals worth pushing, and see exactly what's missing in each one to close it. Control every variable in a sales process automatically. Accurate forecasts fall out of that.…","a":"Jacobo Umbert"},{"i":247,"d":"26-05","c":"CLI","t":"Login por navegador y MFA en dcy","w":"Capabilities compound, now CLI + login in browser + MFA\nWe've released a new version of our CLI dcy enabling login via browser and thug inheriting all of the capabilities of the standard login/signup/password workflows for the terminal.","a":"Iñigo Medina"},{"i":248,"d":"26-05","c":"PROD","t":"Facturas de autoconsumo (placas solares)","w":"Electricity from solar panels? We got u!\nNow users are able to create invoices for self-consumption (aka solar panels) and all the emissions and energy will be calculated automatically as 0 (both scope 2 and scope 3).\nUsers now must choose between two consumption types: Grid consumption (the default one) and Self-consumption. It can be done in two ways:…","a":"Boris Landívar"},{"i":249,"d":"27-05","c":"PROD","t":"Catálogo de bases de datos de factores de emisión","w":"New Emission Factors Database Catalog\nMultiDB has arrived and with it new Databases!! We don’t want you to lose track of which are already in Dcycle so…\nWe have made a Catalog with the available databases and detailed information from each of them.\nIt is not a PNG el equipo so you can show them and sell them.\nXOXO el equipo\nMore info here.","a":"Boris Landívar"},{"i":250,"d":"27-05","c":"PROD","t":"Facturas de agua actualizadas (nueva base de datos y más precisión)","w":"Water has been updated\nBig things are flowing. Water invoices just got a serious upgrade — new versions, new database, more accuracy.\nChoose and update the Ecoinvent version used across all your water invoices — full flexibility\nDEFRA emission factors are now available alongside Ecoinvent. More coverage, more confidence. Default for UK invoices.\nGo check it out!\nWith love el equipo\nMore info here","a":"Lucedh Hernandez"},{"i":251,"d":"27-05","c":"PROD","t":"Selector de organización limitado al holding propio (seguridad)","w":"As part of some security cleanup and suggestions from our beloved el equipo team\n· Now you only see your holding organization in the selector\n· If you want to change to another one you can click the change holding button\n· Also you can impersonate, meaning if you are a superadmin you can enter any org without needing a membership…","a":"Diego Acuña"},{"i":252,"d":"27-05","c":"AGENT","t":"Caso de uso MCP con Solarig (Operational Intelligence)","w":"Hey folks, short anecdote from a really interesting Solarig MCP use case Sergio Prieto García and I were working on today, around Operational Intelligence and real user challenges:\nWe’re helping Blanca build the prompt that will generate the KPIs she needs to report to Management. As a first step, we shared a base prompt in Notion so she can iterate on it and give us feedback on:…","a":"Miguel Perez Contreras"},{"i":253,"d":"27-05","c":"SKILL","t":"/bulldog: preparación de follow-ups comerciales","w":"Meet Bulldog.\nRun /bulldog [Company Name] before any follow-up with a prospect and it does this in under 2 minutes:\n· Pulls the deal from HubSpot (stage, MEDPICC gaps, last contact)\n· Reads every email thread with that prospect\n· Loads all Salescaling call transcripts\n· Checks recent product updates in <#C064HEDNKBP|product-news>\n· Researches the company externally (ESG news, regulatory triggers, competitor moves)…","a":"Carlos Valverde"},{"i":254,"d":"28-05","c":"PROD","t":"Más transparencia de cálculo (\"abrir la caja negra\")","w":"We continue opening the black box\nAnother day, another release: Our beloved el equipo and el equipo, we know showing EF’s during a verification sometimes is hard.\nThanks to MultiDB now you are able to see the emission factors used in each invoice or vehicle for all the categories already migrated to MultiDB.…","a":"Boris Landívar"},{"i":255,"d":"30-05","c":"PROD","t":"Migración de arquitectura Lambda → ECS completada","w":"This is BIG announcement, sorry for technical jargon\nArchitecture Update: Lambda → ECS Migration Complete\nWe've completed the migration from our Lambda-based architecture to ECS Fargate. All production traffic now runs through ECS — API, file processing, and event handling. This is a summary of what changed and what it unlocks.\nWhat changed…","a":"Iñigo Medina"},{"i":256,"d":"01-06","c":"SKILL","t":"Skill de preparación de Demo Stops con PMs","w":"Congratulations on all the hard work you put into the migration.\nI’m sharing a skill here to help us be better prepared for Demo Stops with the PMs (Ricardo Méndez Escobar Jack Boris Landívar Daniel Jiménez el equipo)\nThe goal is clear: to provide our PMs with the necessary context so that nothing goes wrong during the Demo Stop and the Demo (in case they accompany the AE).…","a":"Santiago Rodríguez Sánchez-Paulete"},{"i":257,"d":"04-06","c":"AGENT","t":"Leia configura visualizaciones con lenguaje natural","w":"It's Leia again!\nI heard what Adriana de Tolsa or Cecilia Bayas says about Visualizations: \"It's difficult to configure them right to see what I need\".\nI researched, and IT IS TRUE. You are right, as usual.","a":"Ricardo Méndez Escobar"},{"i":258,"d":"04-06","c":"PROD","t":"Vistas organizadas en pestañas y reordenables","w":"Thanks to Rubén Castro Jack and Almudena Gómez-Plata for making it possible to organise views into tabs and move them around","a":"Vanesa García"},{"i":259,"d":"04-06","c":"PROD","t":"Hito: 16.000 consumos de vehículos procesados sin errores","w":"Making history again\nMilestone unlocked: 16K vehicle consumptions processed — zero errors, zero inconsistencies, zero drama. The platform didn't even flinch. This is what maturity looks like. Might 200k records and it will perform strong as well","a":"Iñigo Medina"},{"i":260,"d":"05-06","c":"AGENT","t":"Leia llega a Dcycle: capa agéntica en la plataforma","w":"Hey guys, happy to share Leia arrives at Dcycle\nWe now have a real agentic layer running on the platform.\nThis isn't just another feature, it's the start of a new way of using the product.\nThis cycle we laid the first foundations of NATIVE operational intelligence. Leia plugs into the Decarbonization project as an agent that guides you through diagnosing your data.\nWhat can Leia do, and what can't it?…","a":"Daniel Jiménez"},{"i":261,"d":"08-06","c":"PROD","t":"Compartir visualizaciones con organizaciones hijas (solo lectura)","w":"Visualization sharing for child organizations is here\nWe just shipped a new feature that lets parent organizations share their Visualization tab with child orgs, in read-only mode.\nThis is part of our broader flexibility strategy: instead of deciding for our clients what they need, we give them the tools to choose for themselves.…","a":"Iñigo Medina"},{"i":262,"d":"08-06","c":"PROD","t":"Explicación de por qué se aplica cada factor de emisión por defecto","w":"Important this, people\nHello el equipo. I have seen many questions related to not knowing why an EF from a Database is applied to a record by default. We have added a new section in the Emission Factors screen in the software so you always have access to this information. It is very simple right now and it is open to feedback obviously so if you think it is not enough and we need to explain further just tell us.…","a":"Iñigo Medina"},{"i":263,"d":"08-06","c":"DOCS","t":"Guías GLEC en el Help Center","w":"New GLEC guides in the Help Center\nI've taken the official GLEC documentation from Dcycle Docs and translated it into simple, beginner-friendly language so clients can self-serve during onboarding or even before kickoff.\n5 step-by-step guides, all basic level:\nGetting started with GLEC — key concepts and workflow by role\nTransport operations & TOC mapping — creating legs, selecting TOCs, multi-modal routes…","a":"Cecilia Bayas"},{"i":264,"d":"08-06","c":"INIT","t":"Iniciativa: meter datos en Dcycle nunca fue tan fácil","w":"New initiative — Introducing data in Dcycle was never that easy\nThe pain\nDavid (data manager at Moldtrans) uploaded his files, saw the \"Uploaded successfully\" pop-up and left feeling done. The next day he came back and his footprint hadn't moved at all. His takeaway: \"the platform doesn't work\".…","a":"Ricardo Méndez Escobar"},{"i":265,"d":"09-06","c":"PROD","t":"Custom KPIs rediseñados + encuestas para recoger cualquier dato","w":"Custom KPIs just got a complete REDESIGN and NEW FEATURES\nSend surveyS to recolect ANY TYPE OF DATA!\nWhat started as a client must-have by Luis Escámez is now a. I have rebuilt the entire experience with a brand-new UI and a lot of powerful additions.\nWhat can you do now?\n· Create surveys with any answer type\n◦ Number\n◦ Percentage %\n◦ Text\n◦ Date\n◦ Yes / No…","a":"Jack"},{"i":266,"d":"09-06","c":"PROD","t":"Importe y divisa vía Nuvo en carga masiva","w":"Quick update\nWe know economic data is important and upload of massive data is important too.\nSo now spend amount and currency can be uploaded via Nuvo for electricity and heat invoices.\nXOXO: el equipo\nPD: Michel this was something Gredos San Diego was requesting for the Demo.","a":"Boris Landívar"},{"i":267,"d":"09-06","c":"CLI","t":"Carga de compras multi-filial en un solo paso","w":"New in the dcy CLI — purchase uploads\nUntil now, uploading purchases for a group with multiple subsidiaries via the CLI was simply not possible in a single step. For a client like Gransolar — 60 organisations in one file — the only option was to manually split the CSV into 60 separate files and run 60 individual commands. In practice, nobody did it this way.\nThat changes now.\nMulti-org upload…","a":"Marina Oliveros"},{"i":268,"d":"09-06","c":"PROD","t":"Experimentos de OCR contra un gold dataset","w":"Hey there geeky OCR update here.\nTLDR: You can now run experiments against a real gold dataset to see how X changes improve OCR.\nWe're moving towards a more mature way of testing changes in our OCR.\nWe've created a way to run evals/experiments inside Langfuse.…","a":"Daniel Jiménez"},{"i":269,"d":"10-06","c":"PROD","t":"Vídeos en las novedades de la app","w":"Product news now supports video previews\nWe've added video support to the News section. When a product news page in Notion has a video in the \"Media\" property, it now plays automatically (looped, silent) directly in the news card on the listing page and as the hero in the detail view.…","a":"Iñigo Medina"},{"i":270,"d":"10-06","c":"DOCS","t":"Guía: poner a cero las emisiones de electricidad con una GdO","w":"New guide live on Dcycle Learn\nSet electricity emissions to zero with a Guarantee of Origin — a step-by-step walkthrough showing customers how to apply a GdO so their market-based Scope 2 drops to zero. It tackles one of our most-repeated support questions (\"we have a guarantee of origin… how do we get the CO₂ to 0?\").\nEN →\nES →…","a":"Luis Escámez"},{"i":271,"d":"11-06","c":"PROD","t":"Estimación de emisiones de empleados que no responden la encuesta","w":"New feature live: Estimate emissions for non-respondent employees\nNot all employees complete the mobility survey — and until now, that meant a gap in your Scope 3 data. With this new feature, companies can estimate CO2e emissions for non-respondents using the average per responding employee.\nTwo modes available:\n- Consolidated — one total for the whole group, distributed across subsidiaries automatically…","a":"Ana Romero"},{"i":272,"d":"11-06","c":"PROD","t":"Autocreación de empleados al subir el CSV de commuting","w":"Smarter employee commuting CSV upload\nNo more pre-creating employees before uploading a commuting CSV. The platform now auto-creates them for you during the upload.\nThe invisible step that never should have existed\nUploading a commuting CSV used to hide a trap: if any employee in the file did not already exist in the platform, the upload would fail.…","a":"Marina Oliveros"},{"i":273,"d":"11-06","c":"PROD","t":"Report Builder más rápido y con visualizaciones que siguen siendo visuales","w":"Just had a meeting with Aludec (EINF + Decarbonization demo) — one of those sessions that reminds you why this work matters.\nEuge literally said \"¡está buenísimo!\" for both projects! But the real moment: she's been frustrated for months that we only had DEFRA as emission factor source. When I showed her the new multidatabase (EPA, IEA, full catalog) she went silent. First time I've seen her speechless.…","a":"Lucía Mosquera"},{"i":274,"d":"11-06","c":"PROD","t":"Subida de calidad de la UI de visualizaciones","w":"BULK UPLOAD PURCHASE DATA FROM HOLDING\nHolding organizations can now upload purchases for multiple subsidiaries in a single CSV file.\nEnjoy!","a":"Luis Escámez"},{"i":275,"d":"11-06","c":"PROD","t":"Previews enriquecidos al compartir URLs de la app","w":"Product news now supports video previews\nWe've added video support to the News section. When a product news page in Notion has a video in the \"Media\" property, it now plays automatically (looped, silent) directly in the news card on the listing page and as the hero in the detail view.…","a":"Iñigo Medina"},{"i":276,"d":"11-06","c":"DOCS","t":"Guías: comparar dos años y corregir el CNAE/SIC de un proveedor","w":"New guide on Dcycle Learn\nFix a supplier's category (CNAE/SIC) for spend-based purchases — how to correct a supplier that was auto-detected into the wrong activity (the classic \"energy retailer flagged as Food & beverages\"), or map one that had no code, so the spend-based emission factor recalculates.\nEN →\nES →…","a":"Luis Escámez"},{"i":277,"d":"12-06","c":"DOCS","t":"Guía de Custom KPIs en Dcycle Learn","w":"New guide on Dcycle Learn\nCreate custom KPIs and collect values from your organization — how to define your own indicators (water use, waste, certifications, anything), group them into a KPI group, run collection campaigns with deadlines and automatic reminders, and gather values from data owners through magic-link surveys — no Dcycle account needed on their side.\nEN →\nES →…","a":"Luis Escámez"},{"i":278,"d":"15-06","c":"PROD","t":"MultiDB en envíos y entregas","w":"From el equipo we continue adding new scope 3 categories to MULTIDB\nIt was the turn for shipments and deliveries (transport & distribution downstream and upstream)\nMore info here\nOur next victim -Business trips","a":"Diego Acuña"},{"i":279,"d":"15-06","c":"PROD","t":"Elegir qué organizaciones entran en el informe GHG (Report Builder)","w":"Choose which organizations go into your GHG report\nThe old GHG report let you pick which organizations to include before downloading. Report Builder didn't — every GHG report consolidated your entire holding, with no way to narrow it down. Fixed.\nWhat's new\n· Creating a GHG report now has an \"Organizations to consolidate\" step — a tree of your holding (parent + subsidiaries), everything selected by default.…","a":"Rubén Castro"},{"i":280,"d":"16-06","c":"PROD","t":"Trazabilidad de cómo se calculan los km en envíos y entregas","w":"Another improvement on traceability el equipo\nNow we show how kms were calculated in Shipments and Deliveries.\nOur beloved el equipo and el equipo have suffered auditors asking a lot about how we calculate this\nAlso added info about how Dcycle decides the transport type when the user selects the \"Do not know\" option as transport type\nThanks Sergio Prieto García and Ana Mateu for the feedback!","a":"Diego Acuña"},{"i":281,"d":"16-06","c":"WEB","t":"Leia en la web","w":"New on Dcycle Learn: MITECO Registry — full guide (finally)\nWe just published three articles covering the entire MITECO carbon footprint registry process, from calculating your footprint to offsetting it.\nCalculo badge — How to measure, document, and register your footprint. Includes verification rules, who is obligated, and the full documentation checklist.…","a":"Cecilia Bayas"},{"i":282,"d":"16-06","c":"DOCS","t":"Guía completa del registro MITECO (3 artículos)","w":"New on Dcycle Learn: MITECO Registry — full guide (finally)\nWe just published three articles covering the entire MITECO carbon footprint registry process, from calculating your footprint to offsetting it.\nCalculo badge — How to measure, document, and register your footprint. Includes verification rules, who is obligated, and the full documentation checklist.…","a":"Cecilia Bayas"},{"i":283,"d":"17-06","c":"PROD","t":"Nueva vista de subida de datos desde El Cuenco","w":"New data upload view from The Cuenco! IA + transparency\nThe bowl (My files) is the place to capture your organization's data. Transparent communication during the process is key to ensure the quality of the data uploaded and saved. In the process efficiciency is important. Now you can say \"you just need to vomit your documents and Dcycle will organize them for you”.\nHow does it work?…","a":"Ricardo Méndez Escobar"},{"i":284,"d":"17-06","c":"PROD","t":"Unificar CUPS duplicados y arreglar muchas facturas de golpe","w":"Now you can merge duplicate electricity supply-point codes (CUPS) and fix many invoices at once from a single screen.\nWhen you upload electricity invoices, Dcycle automatically reads the CUPS, the code that identifies each supply point. Sometimes that automatic reading does not capture the code identically on every invoice (for example, it drops the final letters)…","a":"Luis Escámez"},{"i":285,"d":"23-06","c":"PROD","t":"Jerarquías por tipo de suministro en la pivot de huella","w":"Carbon Footprint pivot table — supply-type hierarchies\nYou can now break down your Carbon Footprint data by the type of energy or emission source, directly in the pivot table widget.\nNew hierarchy options:\n- Stationary fuel\n- Mobile fuel\n- Electricity supplier\n- Refrigerant gas\n- Process type…","a":"Miguel Perez Contreras"},{"i":286,"d":"23-06","c":"PROD","t":"Base de datos HuellaChile","w":"News for our friends from Chile po wn\nWe have added a new emission factors database from Chile’s government - HuellaChile.\nClients can now apply them for Scope 1 and 2 consumption data (vehicles, heat invoices and electricity). See how to here.\nWhy not Scope 3?\nBecause Chile’s government recommends DEFRA for Scope 3 and we already have that database available.\nXOXO: el equipo","a":"Boris Landívar"},{"i":287,"d":"23-06","c":"SKILL","t":"/mobility-scoping (PMST, Ley 9/2025)","w":"New skill (CS-repo): /mobility-scoping\nWorkplace Sustainable Mobility Plans (PMST) are now mandatory under Ley 9/2025 for companies with 200+ workers or 100+ per shift at any single work center. Deadline: December 5, 2026.\nWhat it does\nGive it a client name, email thread, or situation description and it tells you whether the obligation applies, what data is missing to confirm it, and what service tier they’ll need (Básico…","a":"Cecilia Bayas"},{"i":288,"d":"24-06","c":"PROD","t":"Carga masiva de recargas de gases refrigerantes","w":"Bulk upload for refrigerant gas recharges\nYou can now bulk upload refrigerant gas recharges (Scope 1) from the facility detail view, just like electricity and fuel.\nWhat’s included:\n· New “Recharges” option in the facility consumption bulk importer\n· Upload an Excel with: facility, quantity (kg), dates, refrigerant gas, and invoice number\n· Available gases loaded as a dropdown directly from the database…","a":"Cecilia Bayas"},{"i":289,"d":"24-06","c":"INIT","t":"Elastic Data: traer cualquier dato a Dcycle","w":"New initiative from el equipo __\nELASTIC DATA — bring ANY data into Dcycle\nDcycle is great at measuring carbon footprint. But clients want more: to manage all their sustainability & ANY data in one place (packaging, deforestation, ISOs, their own metrics), not just carbon. Today, anything that doesn’t fit our fixed categories ends up in an Excel outside Dcycle.…","a":"Jack"},{"i":290,"d":"25-06","c":"INIT","t":"Supplier Risk Assessment","w":"New initiative from The Wildcards\nSUPPLIER RISK ASSESSMENT — know your supply chain before it bites you\n(Quick note on the name: everyone here is in a product squad with a cool name and we're in Sales & CS — pure FOMO. So we made our own team, even if Iñigo Medina is going to disown us. We're The Wildcards )…","a":"Jorge Latorre Escudero"},{"i":291,"d":"29-06","c":"PROD","t":"Informes para el módulo de LCA","w":"Finally, Reports for LCA Module\nThere’s been so much upsell of the LCA module (thanks Lucía Mosquera) and so many limitations with international leads (sorry Carlos Valverde) that we had to start giving this module a bit more love.\nUntil now, LCA results lived in a dashboard or in an Excel file, and putting together the final report was manual work done on the side.…","a":"Boris Landívar"},{"i":292,"d":"29-06","c":"PROD","t":"Una LCA, múltiples resultados","w":"One LCA, Multiple results\nMost clients use LCAs to calculate the impact of one of their products. But more advanced users need to calculate several co-products from the same LCA.\nWe’ve taken a step forward toward those advanced clients — the LCA module is now Multi-product. (Saria International will be very happy)\nBut it doesn’t end there:\nEnvironmental data matters, but we know economic data matters too.…","a":"Boris Landívar"},{"i":293,"d":"29-06","c":"PROD","t":"Base de datos de factores de comercializadoras eléctricas","w":"Another day, another database\nMITECO publishes electricity supplier emission factors but some clients prefer to use the CNMC Spanish database for electricity market based.\nNow they are able to do it if they want to (Ana Romero I think you have clients interested in this).\nXOXO: el equipo","a":"Boris Landívar"},{"i":294,"d":"29-06","c":"PROD","t":"Privacidad por fichero: filiales pueden ocultar ficheros a la matriz","w":"Per-file privacy — keep sensitive files within your organization\nSubsidiaries can now mark individual files as private, so they stay invisible to parent holdings.\nA lock icon shows which files are private. The toggle is bidirectional, and we block edge cases automatically: files already in a project can't be marked private, and private files can't be linked to projects from other orgs.…","a":"Miguel Contreras"},{"i":295,"d":"29-06","c":"AGENT","t":"Datos de LCA disponibles vía API y MCP","w":"LCA data is now available via API and MCP\nLife Cycle Assessment data joins the rest of Dcycle's sustainability dataset as a first-class API resource — because your environmental data should be accessible wherever you need it, not locked inside a UI.\n- GET /lca/portfolio — list your LCA portfolios\n- GET /lca/portfolio/{id}/dashboard — environmental impact results by EN 15804 stage (A1–B7)…","a":"Iñigo Medina"},{"i":296,"d":"29-06","c":"PROD","t":"Nuevo importador de Excel para todas las categorías","w":"We are activating the new Excel Files Importer for all data categories very soon (probably tomorrow).\nThis will improve how the excel imports are done. The upload is very similar to old Nuvo upload, but using our own product. 100% ours, 100% control.\nel equipo let us know if any client has any problem…","a":"Ricardo Méndez Escobar"},{"i":297,"d":"30-06","c":"PROD","t":"Decarbonization capítulo 2: ejecutar y seguir los planes","w":"Decarbonization module. Capítulo 2\nDecarbonization is great at planning. But clients want more: to actually execute those plans and track progress without bouncing between spreadsheets and PDFs. Today, a client's action plan sits in a deck or document, and when they try to execute it—budget approvals, actual spending, results tracking—it all scatters across Excel files and email chains.\nWhat's live now…","a":"Yelyzaveta Adova"},{"i":298,"d":"30-06","c":"PROD","t":"Nueva categoría: estancias en hotel","w":"New Category! HOTEL STAYS\nel equipo thanks to Yelyzaveta Adova was able to develop this new category with already MultiDB functionality\nIt all started with a not at all passive agressive PR from Liza while a gun of a client was pointing at her head\nThanks and sorry for the delay\nHopefully this can help you sell a bit more too el equipo you probably have some client that asked you about this, probably from ISO 14064","a":"Diego Acuña"},{"i":299,"d":"30-06","c":"PROD","t":"MultiDB en viajes de negocio + detalle del cálculo","w":"MultiDB for Business Travel el equipo\nWe just enabled multidatabase support for Biz trips across the app\n· Check emission factors used by each of your travel\n· Now you can impute number of passengers alongside number of trips\n· Check how the distance was calculated of your travel\n· You can now use DEFRA and Ecoinvent","a":"Diego Acuña"},{"i":300,"d":"30-06","c":"AGENT","t":"Leia avisa de posibles duplicados al subir documentos","w":"Duplicate file warning during upload\nLeia now flags possible duplicates when you upload documents, letting you classify them anyway or delete them before they slip into your data.\nIt flags documents 100% equals, if there is a small variation it does not flag it.\nOnly in uploads from My files (yet)\nlink\nlink","a":"Ricardo Méndez Escobar"},{"i":301,"d":"01-07","c":"PROD","t":"Listado y borrado masivo de consumos de vehículos","w":"Vehicle consumption list & bulk delete available\nMany of our clients upload vehicle consumptions in bulk using a file with thousands of rows, and scattered across 210 child orgs, and the only way to clean it up was clicking into each vehicle one by one. That's was not very nice (at all) - el equipo knows this well.\nWell, not anymore.\nWhat changed…","a":"Cristina Marín"},{"i":302,"d":"01-07","c":"PROD","t":"Pivot table de commuting (km, personas y CO2 por transporte)","w":"New employee commuting pivot table — you can now cross km, people and CO2 by transport type. Especially useful for the mobility plan. Siempre thankiu a Ricardo Méndez Escobar por los fixes in my back!","a":"Ana Mateu"},{"i":303,"d":"01-07","c":"PROD","t":"PPWR: control de PFAS y sustancias","w":"PPWR just got smarter about tracking forever chemicals (PFAS)\nWe've upgraded how packaging gets checked for PFAS (\"forever chemicals\") and cleaned up the substances checklist overall.\nWhat's new:\n· Accurate PFAS measurements instead of one rough number, matching exactly what EU regulation requires\n· All 5 regulated substances (PFAS + 4 heavy metals) now show automatically for every packaging item, no manual setup needed…","a":"Luis Escámez"},{"i":304,"d":"02-07","c":"PROD","t":"PPWR: carga masiva de unidades de packaging","w":"More improvements in PPWR!\nWe were getting the same feedback in the demos: \"this looks too manual, I have hundreds of packaging units and components\". This solves it.\nUpload your entire packaging catalog in one file, now with every material and component included for each unit.\nRead more: app.notion.com/p/391b1965e76981f998e8e255a8d5d234","a":"Luis Escámez"},{"i":305,"d":"02-07","c":"PROD","t":"Borrado masivo de visualizaciones","w":"You asked, we listened\nCristina Marín created side quest in RT Kanban to add an option to bulk delete visualizations. This comes from client Energía Local. When you use a lot visualizations, sometimes you want to delete a bunch of them.\nThis feature has been created 100% autonomously by agents that are listening to the RT Kanban, choosing good candidates, creating loops to develop them…","a":"Iñigo Medina"},{"i":306,"d":"03-07","c":"PROD","t":"Bloquear informes cuando están terminados","w":"You asked, we-the-agents listened\nJack created side quest to allow customers to lock reports when they think they're done or just don't want other people modify it.\nOur agents are processing quite well Response Team Kanban, going for side quests when bugs are under control.","a":"Iñigo Medina"},{"i":307,"d":"03-07","c":"PROD","t":"Depuración de aguas en pivot tables","w":"Waste water treatment in pivot tables\nUsers can now build pivot tables and visualizations from waste water treatment (WWTP) data — CO₂e, influent/discharged water, sludge and biogas volumes, plus BOD/COD organic-load ratios — broken down by water type, facility, company and time.\nCorrect aggregation:\n· Water volumes, sludge quantity are summed and prorated across the period…","a":"Ricardo Méndez Escobar"},{"i":308,"d":"03-07","c":"PROD","t":"Nueva categoría en emisiones históricas: cambio de uso de suelo (FLAG)","w":"New category in Historical Emissions: Land Use Change (a.k.a. FLAG for GHG viz!!)\nThe Land Use Change category is now available in the Historical Emissions module — also known as FLAG (Forests, Land & Agriculture) in the GHG Protocol world, yes, that’s actually what it’s called.\nWhat’s included?\n· New land_use_change category correctly classified as Scope 1 per ISO 14064 Category 1 (direct GHG emissions — LULUCF)…","a":"Marina Oliveros"},{"i":309,"d":"06-07","c":"PROD","t":"Nueva visualización de mapas para envíos y entregas (con heatmap)","w":"First approach on a new visualization - MAPS come back but not for Carbon Footprint\nNew map visualization for shipments and deliveries, also in Heat map mode\nTry it, modify it, give it some love and modifications as you wish!\nHope this can make some sales process a bit more mindblowing","a":"Diego Acuña"},{"i":310,"d":"06-07","c":"PROD","t":"Emisiones de transporte de residuos separadas (excluibles en SBTi)","w":"You can now see waste management and transport emissions separately, and exclude transport from your SBTi reports. Saving Felix Solís one PR at the time.\nTo see this, wastes need to be recalculated. This can be done with the new dcy admin recalculate-waste-transport. Update dcy to use it!\ncc: <#C0BELHFGBD3|recovery_félix_solís_avantis>","a":"Luis Escámez"},{"i":311,"d":"06-07","c":"DOCS","t":"Release notes automáticas en Platform Docs","w":"I'm an agent ruled by Íñigo. This is my message: I'm working in a loop to create and update release notes in Dcycle Platform Docs.\nDcycle clients can now have a better understanding on constant ever-changing improvements.\ncode.dcycle.io/docs/release-notes","a":"Iñigo Medina"},{"i":312,"d":"07-07","c":"CLI","t":"Release 0.0.115 de dcy con nuevos comandos (doctor)","w":"We're constantly improving our CLI dcy. Current release is 0.0.115, check if you're using an old version.\nWe've added a bunch of new commands. doctor is quite useful to check your current config.","a":"Iñigo Medina"},{"i":313,"d":"07-07","c":"SKILL","t":"/seed-categories","w":"New Skill: /seed-categories at dcycle-backend-app repository\nTired of having to recreate data in your local database when Claude decides to delete your DB because a colleague missed a merge heads of alembic?\nSolution is here!!\nIt populates your local Dcycle backend with N records (default 10) per data category for a given year, making sure it calculates correctly everything as intended.…","a":"Diego Acuña"},{"i":314,"d":"07-07","c":"PROD","t":"Carga multi-org del Excel en 5 categorías más","w":"Feature expansion: multi-org data upload from the holding available in 5 new types of excel uploads\nNow, also available in:\nBusiness travels\nEmployees mails to send the survey\nEmployees commuting data\nEmployees data (mail, name, etc.)\nCustom emission factor for purchases","a":"Ricardo Méndez Escobar"},{"i":315,"d":"08-07","c":"PROD","t":"esg-x integrado en Dcycle: reporting asistido por IA y doble materialidad","w":"Esg-x is integrated into dcycle\nwe have 2 new project types: AI-assisted reporting (CSRD and VSME) and double materiality analysis. the only thing you need to do to start testing them is add the organization you want to use for testing to the launchdarkly production esgXEmbed flag.\nknown limitations as of today:…","a":"Paolo Mazza"},{"i":316,"d":"08-07","c":"PROD","t":"OCR también lee políticas y certificados","w":"Feature extension: OCR now also reads Policies and Certifications PDFs!\nYou can drop your files to My files and it will:\n1. Classify it as a Certification or a Policy (it it fits the crieteria)\n2. Read the info and create a summary\n3. Save the reviewed data in Company Strategy and Certifications\nel equipo Useful for CSRD, Ecovadis and CDP","a":"Ricardo Méndez Escobar"},{"i":317,"d":"08-07","c":"PROD","t":"Carga multi-org del Excel en 14 categorías nuevas","w":"Multi-org data upload in the Excel Data Importer available in 14 new categories\nYou can now upload data for a whole holding and its subsidiaries in a single file, with category-specific, org-aware validations.\nThis means: dependent fields like facilities, employees and vehicle plates must belong to the row's organization; duplicate / overlap / contract checks are scoped per org.…","a":"Ricardo Méndez Escobar"},{"i":318,"d":"08-07","c":"PROD","t":"PPWR: mercados objetivo, trazabilidad y documentos compartibles","w":"Manage target markets, trace where your data comes from, and share PPWR documents with a link or QR code.\nWhat's new\nThe Dcycle PPWR module now includes three improvements designed to help you manage packaging compliance more thoroughly and transparently.…","a":"Luis Escámez"},{"i":319,"d":"09-07","c":"PROD","t":"Detección inteligente de facturas duplicadas","w":"Smarter duplicate detection for invoices\nAs a next step in keeping data clean, Dcycle now goes beyond spotting identical uploaded files.\nFor invoices, we detect likely duplicates on several levels:\n· Same supplier and invoice number\n· Same supply point (CUPS) with an overlapping period\n· Same installation and category with overlapping dates…","a":"Miguel Contreras"},{"i":320,"d":"09-07","c":"SKILL","t":"Repo compartido de loops y skills de la empresa","w":"Loop mindset is becoming natural at Dcycle. It's time to start sharing what every person is using. Don't be shy, you don't know what might be useful for others.\nI've created a repo as source for sharing and uploaded a first one I use to run for response team.\ngithub.com/Dcycle-by-WUM/loops","a":"Iñigo Medina"},{"i":321,"d":"13-07","c":"PROD","t":"El Cuenco entiende cualquier Excel parecido a las plantillas","w":"El Cuenco applies its own intelligence to any kind of excels from Dcycle categories!\nIf a file
