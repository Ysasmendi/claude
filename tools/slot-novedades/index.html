<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tragaperras de Novedades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --blue:#2947FE;
    --blue-deep:#16249B;
    --blue-hover:#1F37CC;
    --white:#FFFFFF;
    --bulb:#FFF6E0;
    --bulb-glow:rgba(255,206,120,.9);
    --cell-h:128px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--white);color:var(--blue)}
  body{
    font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
    letter-spacing:-0.03em;
    color:var(--white);
    background:var(--blue);
    background-image:radial-gradient(120% 90% at 50% 0%, #3A56FF 0%, #2947FE 45%, var(--blue-deep) 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 20px 26px;
    gap:18px;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-size:19px;font-weight:700;letter-spacing:-0.04em}
  .brand span{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.14em;opacity:.65}
  h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;text-align:center;text-wrap:balance;line-height:1.05}
  .head{display:flex;flex-direction:column;align-items:center;gap:10px}

  @keyframes rumble{
    0%{transform:translate3d(0,0,0)}25%{transform:translate3d(-1px,1px,0)}
    50%{transform:translate3d(1px,-1px,0)}75%{transform:translate3d(-1px,-1px,0)}
    100%{transform:translate3d(1px,1px,0)}
  }
  .machine.fast{animation:rumble .1s linear infinite}
  .machine{
    position:relative;
    width:min(660px,100%);
    border:1px solid rgba(255,255,255,.34);
    background:rgba(255,255,255,.07);
    border-radius:22px;
    padding:18px;
    box-shadow:0 30px 70px -20px rgba(6,16,90,.55), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .machine{transition:border-color .3s ease, box-shadow .3s ease}
  .machine.spinning{
    border-color:rgba(255,235,190,.5);
    box-shadow:0 30px 70px -20px rgba(6,16,90,.55), inset 0 1px 0 rgba(255,255,255,.22),
               0 0 46px rgba(255,206,120,.22);
  }
  .marquee{position:absolute;inset:-7px;pointer-events:none}
  .marquee .edge{position:absolute;display:flex;justify-content:space-between}
  .marquee .edge.top{top:0;left:22px;right:22px}
  .marquee .edge.bottom{bottom:0;left:22px;right:22px}
  .marquee .edge.left{left:0;top:22px;bottom:22px;flex-direction:column}
  .marquee .edge.right{right:0;top:22px;bottom:22px;flex-direction:column}
  .bulb{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.34);box-shadow:0 0 0 0 rgba(255,206,120,0)}
  @keyframes chase{
    0%{background:var(--bulb);box-shadow:0 0 16px 5px var(--bulb-glow)}
    12%{background:var(--bulb);box-shadow:0 0 12px 3px rgba(255,206,120,.6)}
    26%{background:rgba(255,240,205,.7);box-shadow:0 0 8px 1px rgba(255,206,120,.3)}
    44%{background:rgba(255,255,255,.34);box-shadow:0 0 0 0 rgba(255,206,120,0)}
    100%{background:rgba(255,255,255,.34);box-shadow:0 0 0 0 rgba(255,206,120,0)}
  }
  .machine.spinning .bulb{animation:chase .9s linear infinite}
  .machine.brake .bulb{animation-duration:1.7s}
  @keyframes allflash{
    0%,100%{background:rgba(255,255,255,.32);box-shadow:0 0 0 0 rgba(255,206,120,0)}
    45%{background:var(--white);box-shadow:0 0 18px 6px rgba(255,255,255,.95)}
  }
  .machine.won .bulb{animation:allflash .28s linear 4}

  .window{
    position:relative;
    height:calc(var(--cell-h) * 3);
    border-radius:15px;
    overflow:hidden;
    background:rgba(9,20,110,.42);
    box-shadow:inset 0 2px 14px rgba(6,14,80,.5);
  }
  .strip{position:absolute;left:0;right:0;top:0;will-change:transform}
  .cell{
    height:var(--cell-h);
    padding:14px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
  }
  .card{
    width:100%;height:100%;
    background:var(--white);
    color:var(--blue);
    border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    padding:12px 20px;
  }
  .card p{font-size:clamp(15px,2.1vw,20px);font-weight:700;line-height:1.22;text-wrap:balance}
  .card .meta{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em}
  .card .tag{background:#F0F3FF;border-radius:20px;padding:3px 9px}
  .card .date{opacity:.55}
  .card{transition:box-shadow .2s ease}
  @keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.055)}62%{transform:scale(.985)}100%{transform:scale(1)}}
  @keyframes ring{from{box-shadow:0 0 0 0 rgba(255,255,255,.85)}to{box-shadow:0 0 0 24px rgba(255,255,255,0)}}
  .card.win{animation:pop .6s cubic-bezier(.2,.9,.2,1), ring .8s ease-out}
  @keyframes blink{0%,100%{opacity:0}10%{opacity:.55}22%{opacity:0}42%{opacity:.42}54%{opacity:0}74%{opacity:.3}86%{opacity:0}}
  .flash{position:absolute;inset:0;pointer-events:none;background:var(--white);opacity:0}
  @keyframes sheen{0%{transform:translateY(-140%)}100%{transform:translateY(340%)}}
  .sheen{
    position:absolute;left:0;right:0;height:42%;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.16) 50%,rgba(255,255,255,0) 100%);
  }
  .window.spin .sheen{opacity:1;animation:sheen .62s linear infinite}
  @keyframes stamp{
    0%{opacity:0;transform:rotate(-9deg) scale(.5)}
    45%{opacity:1;transform:rotate(-9deg) scale(1.12)}
    62%{transform:rotate(-9deg) scale(1)}
    100%{opacity:0;transform:rotate(-9deg) scale(1)}
  }
  .chaching{
    position:absolute;top:calc(var(--cell-h) - 19px);right:14px;z-index:3;pointer-events:none;opacity:0;
    background:var(--white);color:var(--blue);
    font-size:14px;font-weight:800;letter-spacing:0.04em;
    padding:8px 14px;border-radius:999px;
    box-shadow:0 8px 22px -6px rgba(6,14,80,.55);
  }
  .window.won .chaching{animation:stamp 1.5s cubic-bezier(.2,.9,.2,1)}
  .window.won .flash{animation:blink 1s ease-out}
  #sparks{position:absolute;inset:0;pointer-events:none}
  .fade{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,
      rgba(20,35,150,.95) 0%, rgba(24,40,170,.45) 24%, rgba(41,71,254,0) 34%,
      rgba(41,71,254,0) 66%, rgba(24,40,170,.45) 76%, rgba(20,35,150,.95) 100%);
  }
  .guides{position:absolute;inset:0;pointer-events:none}
  .guides i{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.28)}
  .guides i:first-child{top:calc(var(--cell-h) - 1px)}
  .guides i:last-child{top:calc(var(--cell-h) * 2)}
  .guides b{
    position:absolute;top:calc(var(--cell-h) * 1.5);transform:translateY(-50%);
    font-size:16px;line-height:1;opacity:.9;
  }
  .guides b.l{left:6px}
  .guides b.r{right:6px}

  .lever{
    position:absolute;top:26px;right:-36px;width:26px;height:176px;display:none;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);border-radius:999px;
  }
  .lever .track{position:absolute;left:11px;top:14px;bottom:14px;width:4px;border-radius:4px;background:rgba(255,255,255,.3)}
  .lever .knob{
    position:absolute;left:1px;top:6px;width:24px;height:24px;border-radius:50%;
    background:var(--white);box-shadow:0 4px 12px rgba(6,14,80,.5);
    transition:top .45s cubic-bezier(.2,.8,.2,1);
  }
  .machine.spinning .lever .knob{top:146px}
  @media(min-width:820px){.lever{display:block}}

  .card.win{cursor:pointer}
  .card .hint{
    position:absolute;left:14px;top:12px;
    font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--blue);opacity:0;transition:opacity .3s ease .5s;
  }
  .card.win .hint{opacity:.42}
  .card.win:hover .hint,.card.win:focus-visible .hint{opacity:.85}
  .card{position:relative}

  @keyframes print{
    0%{opacity:0;transform:translateY(-14px) scaleY(.55)}
    100%{opacity:1;transform:translateY(0) scaleY(1)}
  }
  .ticket{
    position:absolute;
    top:18px;left:18px;right:18px;                /* justo encima de la ventana de la bobina */
    height:calc(var(--cell-h) * 3);
    z-index:5;
    display:flex;flex-direction:column;
    transform-origin:top center;
    animation:print .42s cubic-bezier(.2,.9,.2,1);
    cursor:pointer;
  }
  .ticket[hidden]{display:none}
  .ticket .perf{
    height:12px;
    background-image:radial-gradient(circle at 6px 0, transparent 5.4px, var(--white) 5.8px);
    background-size:16px 12px;background-repeat:repeat-x;
  }
  .ticket .tbody{
    flex:1;min-height:0;
    background:var(--white);border-radius:0 0 14px 14px;
    padding:16px 26px 14px;
    box-shadow:0 26px 60px -14px rgba(6,16,90,.65);
    display:flex;flex-direction:column;
  }
  .ticket .what{flex:1;min-height:0;overflow-y:auto}
  .ticket .tfoot{margin-top:auto}
  .ticket .eyebrow{
    font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--blue);opacity:.5;
    padding-bottom:10px;border-bottom:1px dashed rgba(41,71,254,.28);
  }
  .ticket h2{
    font-size:clamp(18px,2.4vw,23px);font-weight:800;color:var(--blue);
    line-height:1.16;text-wrap:balance;margin-top:10px;
  }
  .ticket .tmeta{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#8B95A5;
  }
  .ticket .tmeta .tag{background:#F0F3FF;color:var(--blue);border-radius:20px;padding:3px 9px}
  .ticket .what{
    margin-top:12px;font-size:17px;line-height:1.5;color:#415162;
    white-space:pre-line;letter-spacing:-0.02em;
  }
  .ticket .tfoot{
    margin-top:12px;padding-top:10px;border-top:1px dashed rgba(41,71,254,.28);
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#8B95A5;
  }
  .ticket .tfoot button{
    font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    background:none;border:none;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline;
  }
  @media (prefers-reduced-motion:reduce){.ticket{animation:none}}

  .controls{display:flex;flex-direction:column;align-items:center;gap:13px;width:min(660px,100%)}
  button.spin{
    font-family:inherit;letter-spacing:0.1em;text-transform:uppercase;
    font-size:15px;font-weight:800;padding:14px 48px;
    background:var(--white);color:var(--blue);
    border:none;border-radius:999px;cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(6,14,80,.6);
    transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease;
  }
  button.spin:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 30px -8px rgba(6,14,80,.7)}
  button.spin:active:not(:disabled){transform:translateY(2px);box-shadow:0 6px 14px -8px rgba(6,14,80,.6)}
  button.spin:disabled{opacity:.45;cursor:default}
  :is(button,input,label,a):focus-visible{outline:2px solid var(--white);outline-offset:3px;border-radius:8px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
    background:transparent;color:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.4);
    border-radius:999px;padding:6px 12px;cursor:pointer;
    display:flex;align-items:center;gap:7px;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .chip:hover{border-color:var(--white);color:var(--white)}
  .chip[aria-pressed="true"]{background:var(--white);color:var(--blue);border-color:var(--white)}
  .chip em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.6;font-weight:700}

  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .row label{display:flex;align-items:center;gap:8px;cursor:pointer;opacity:.85}
  .row input{width:16px;height:16px;accent-color:#fff;cursor:pointer}
  .row button.link{
    font-family:inherit;font-size:13px;font-weight:600;background:none;border:none;
    color:var(--white);opacity:.7;text-decoration:underline;cursor:pointer;padding:0;
  }
  .row button.link:hover{opacity:1}
  .status{font-size:13px;font-weight:500;opacity:.65;font-variant-numeric:tabular-nums}
  .status b{font-weight:700;opacity:1}
  footer{font-size:11px;font-weight:500;opacity:.5;text-align:center;max-width:80ch;line-height:1.5}
  footer code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:rgba(255,255,255,.14);padding:2px 5px;border-radius:4px}
  @media (max-height:780px){
    :root{--cell-h:112px}
    body{padding:14px 20px 18px;gap:12px}
    h1{font-size:26px}
    footer{display:none}
    .machine{padding:14px}
    .ticket{top:14px;left:14px;right:14px}
    .lever{top:20px;height:150px}
    .machine.spinning .lever .knob{top:120px}
  }
  @media (prefers-reduced-motion:reduce){
    .lever .knob,button.spin{transition:none}
    .machine.fast{animation:none}
    .window.spin .sheen{opacity:0;animation:none}
    .machine.spinning .bulb,.machine.won .bulb{animation:none}
  }
</style>
</head>
<body>
<div class="head">
  <div class="brand"><b>dcycle</b><span>product news 2026</span></div>
  <h1>Tragaperras de Novedades</h1>
</div>

<div class="machine" id="machine">
  <div class="window">
    <div class="strip" id="strip"></div>
    <div class="sheen"></div>
    <canvas id="sparks"></canvas>
    <div class="chaching">¡CHA-CHING!</div>
    <div class="flash"></div>
    <div class="fade"></div>
    <div class="guides"><i></i><b class="l">▸</b><b class="r">◂</b><i></i></div>
  </div>
  <div class="marquee" id="marquee" aria-hidden="true"></div>
  <div class="lever" aria-hidden="true"><div class="track"></div><div class="knob"></div></div>
  <section class="ticket" id="ticket" hidden tabindex="-1" aria-live="polite">
    <div class="perf"></div>
    <div class="tbody">
      <p class="eyebrow" id="t-eyebrow"></p>
      <h2 id="t-title"></h2>
      <p class="tmeta"><span class="tag" id="t-cat"></span><span id="t-author"></span></p>
      <p class="what" id="t-what"></p>
      <p class="tfoot"><span>Tal y como se anunció en #product-news</span><button type="button" id="t-close">Cerrar</button></p>
    </div>
  </section>
</div>

<div class="controls">
  <button class="spin" id="spin">Girar</button>
  <div class="chips" id="chips"></div>
  <div class="row">
    <label><input type="checkbox" id="norepeat" checked> Sin repetir</label>
    <label><input type="checkbox" id="sound" checked> Sonido</label>
    <button class="link" id="reset">Reiniciar salidas</button>
    <span class="status" id="status"></span>
  </div>
</div>

<footer>
  Cada tirada usa <code>crypto.getRandomValues</code> con muestreo por rechazo: aleatoriedad criptográfica, sin sesgo ni secuencia predecible.
</footer>

<script>
const ITEMS = [{"i":0,"d":"08-01","c":"PROD","t":"Cuenco Folders: subir carpetas con cualquier estructura","w":"Cuenco Folders live.\n· Upload any folder with any folder structure. Software will pick that up.\n· Move files into folders, create folders, edit folders name, etc.\n· You can also drag and drop entire folders (ofc)\n· Zip folders with all their contents\nYou can also process invoices directly from a folder instead of having to manually select files.","a":"Daniel Jiménez"},{"i":1,"d":"09-01","c":"PROD","t":"Método de consolidación elegible en tablas de huella de carbono","w":"Now you can choose the consolidation method in carbon footprint tables\nCalcinor told us they use the participation share of each child company for their calculations of all KPIs.\nWe were not using this % in the calculations in visualizations.\nNow you can choose whether you want to use the % (Financial approach) or not (Operational approach)\nOnly in GHG Procotol and ISO 14064 pivot tables…","a":"Ricardo Méndez Escobar"},{"i":2,"d":"09-01","c":"PROD","t":"Refactor completo del flujo de Invoices","w":"Good news! We have refactored all of the Invoices flow, brand new, deleted old ass logics and tested it a lot\nBut as you know it may fail, but one step close to the new Dcycle!","a":"Diego Acuña"},{"i":3,"d":"12-01","c":"PROD","t":"Nueva página de News dentro de la app (adiós al iframe de Notion)","w":"New in-app News page — now fully integrated and built to scale.\nWe’ve rebuilt the News page inside the app. What used to be a simple iframe embedding our public Notion page is now a fully integrated experience, powered by two Notion databases — one for Spanish and one for English.\nThis new setup becomes our single source of truth for all product communications and allows us to:…","a":"Iñigo Medina"},{"i":4,"d":"12-01","c":"PROD","t":"Sección \"Data to report\" en proyectos EINF-GRI","w":"Now all the projects EINF-GRI have a new section called \"Data to report\"\nHow does it work?\n· File upload and centralization: You can now add any file to the project: Excel, CSV, PDF, API. All information is linked to its project and accessible to the authorized team. This is available for all kind of projects.…","a":"Ricardo Méndez Escobar"},{"i":5,"d":"12-01","c":"PROD","t":"Visualizaciones creadas por defecto al crear un proyecto","w":"Now, when you create a project, you get visualizations created by default, ready to be reported!\nNow users can add these visualizations in any data to be report without configuring them previously\nWhat projects\n· Carbon footprint:\n◦ 1 widget with GHG protocol scopes\n· EINF (GRI and ESRS):\n◦ 1 widget with GHG protocol scopes\n◦ 2 for Wastes (recycled, dangerous)\n◦ 1 with water consumption…","a":"Ricardo Méndez Escobar"},{"i":6,"d":"13-01","c":"DOCS","t":"Documentación ISO 14064 publicada","w":"ISO 14064 Documentation up and running! Check it out in Dcycle API Docs\nCategory 1: Direct GHG Emissions\nCategory 2: Indirect Energy Emissions\nCategory 3: Transportation Emissions\nCategory 4: Products Used Emissions\nCategory 5: Products Sold Emissions\nCategory 6: Other Sources Emissions","a":"Luis Escámez"},{"i":7,"d":"13-01","c":"PROD","t":"Fin de las visualizaciones de energía automáticas en proyectos EINF","w":"· Ya no se crean visualizaciones de energía al crear proyectos EINF.\n· Ya se ha compartido en el feed. Toda la info en -- News","a":"Ricardo Méndez Escobar"},{"i":8,"d":"14-01","c":"PROD","t":"Primera pivot table social: horas de formación","w":"First pivot table for social metrics!\nNow you can play around with Training Hours KPIs (mandatory for EINF for example)\nMore details in News\nMore social KPIs coming soon!","a":"Ricardo Méndez Escobar"},{"i":9,"d":"14-01","c":"PROD","t":"Mejoras de UX/UI en Invoices","w":"We’ve introduced a set of improvements to Invoices aimed at strengthening our data-oriented UX/UI foundations and making key information clearer and more actionable.\nIn the screenshots attached to this update, you can see several enhancements, including:\n· The invoice identifier displayed as the title of the sheet view, improving context and orientation.…","a":"Iñigo Medina"},{"i":10,"d":"15-01","c":"CLI","t":"Creación masiva de organizaciones hijas (100 orgs para COPISA)","w":"Ana Romero needed a way of creating 100 children orgs for COPISA. 1.5 days later this is now a reality.\nNew command in our CLI dc org bulk-create-children\nHow this changed our lives:\n· Before: Ana detects client need --Ana creates a Notion signal --Signal gets lost or is not addressed timely --Ana seeks help from dev/data --Ticket is created in response team --Ticket is solved in n days --Dev/data tells Ana ticket is closed…","a":"Luis Escámez"},{"i":11,"d":"15-01","c":"PROD","t":"Personalización por usuario/equipo en entornos multi-org","w":"When working with large enterprise/multiorg it's quite common that people/teams have different needs in terms of personalization and ways of working.\nResponding to some needs from IPC (quite large, Asia, America, Europe.) where 1 manager wants each org's people focused on their project, we've started adding persisted filters to the projects view.…","a":"Iñigo Medina"},{"i":12,"d":"19-01","c":"SKILL","t":"Comando /start en frontend y backend","w":"Now you can execute the frontend endpoint with a cursor command, just write this in the AI conversation:\nThis will make sure the branch you are on is updated with main, will install new packages if needed and will run it in local, against DEV or STAGING, you decide!\nSoon coming to the backend, a command to execute both, and will be working on some skills that setup everything for you using AI.…","a":"Diego Acuña"},{"i":13,"d":"20-01","c":"PROD","t":"Multi-Database para vehículos","w":"Ok guys, these are huge news from el equipo so I will try to summarize it as much as I can.\nMulti-Database is now available for vehicles. But what does this mean?\n· Users can now not only view, but also choose the emission factors database and version they want to use in each year.\n· DEFRA can be chose as an available emission factors database.…","a":"Boris Landívar"},{"i":14,"d":"20-01","c":"PROD","t":"Ajustes de proyecto en panel lateral (fuera del modal superior)","w":"More space for what really matters: your data! Projects no longer use the top modal. You can now access the project settings from the top right in a sheet-style panel. We keep building.","a":"Vanesa García"},{"i":15,"d":"21-01","c":"PROD","t":"Edición de facturas divididas con importes claros","w":"Editing split invoices was a nightmare. I've improved the UI to clearly show:\n· The total amount of the invoice\n· The weighted amount for that facility.\nJessica from Sener had trouble with this. 1 day later this is solved","a":"Luis Escámez"},{"i":16,"d":"21-01","c":"PROD","t":"Visualizaciones dentro del informe personalizable (EINF-GRI)","w":"More news about EINF-GRI project.\nVisualizations get to the customizable report (news already published to users --link). Some clients are already happy about it!\nAssign data owners in \"data to report\" in bulk actions\nYou can edit the response to one specific data to report, from the report builder. No need to come back to the \"data to report\" tab.…","a":"Ricardo Méndez Escobar"},{"i":17,"d":"21-01","c":"CLI","t":"Actualizar total_km de employees_historic","w":"New Chiki Development in CLI: Update total_km of employees_historic_list. Imagine that you loaded a list of 90 employee_historic with total_km wrong. Now, you can update this information from CLI with a simple command.","a":"Sergio Prieto García"},{"i":18,"d":"22-01","c":"CLI","t":"Importación masiva de periodos históricos de empleados","w":"New Development in CLI: Bulk import of employee historic periods.\nAfter a long economic struggle with Cursor, it has finally gone into production. Finsolutia needed to perform a mass upload of over 200 mobility surveys. Taking advantage of this opportunity, mass uploads of employees can now be done via CLI.…","a":"Sergio Prieto García"},{"i":19,"d":"22-01","c":"PROD","t":"White-label: partners con su propia marca en informes y descargas","w":"Partner organizations can now customize the platform with their own branding, hiding Dcycle branding in reports and downloads.\n· Consistent brand experience for end users\n· Enhanced professionalism in client communications\n· Reports and downloads featuring your visual identity\n· Seamless integration with your own services\nRead GTM internal faqs →","a":"Iñigo Medina"},{"i":20,"d":"22-01","c":"PROD","t":"Carga masiva de datos de logística (miles de envíos)","w":"Bulk Logistics Data Upload: Process Thousands of Shipments in Seconds\nWe've launched a new feature that transforms how our customers can integrate their logistics data with Dcycle. The new bulk upload endpoint allows you to process up to 5,000 shipment records in a single API request, dramatically reducing the time needed to load daily logistics operations data.\nRead the full announcement →","a":"Iñigo Medina"},{"i":21,"d":"23-01","c":"PROD","t":"Nuevo sidebar colapsable","w":"New Collapsible Sidebar\nWe've shipped a redesigned sidebar that brings a more polished, enterprise-ready experience to Dcycle.\nWhat's new:\n- Collapsible design — Collapse the sidebar to icon-only mode to maximize your workspace. Your preference is saved automatically.\n- Smoother navigation — Clicking a section now expands its submenu and navigates simultaneously, reducing clicks.…","a":"Rubén Castro"},{"i":22,"d":"23-01","c":"PROD","t":"Assistant 3.0","w":"Product news from el equipo squad.\nWe've just launched Assistant 3.0 No more generic chatbot energy… this one actually knows what it's talking about.\nSmarter, always up to date\n· Connected to our dynamic Product Knowledge Base and Dcycle Docs\n· Answers tailored for all levels — from pros to first-timers\n· Powered by the latest AI models\nConversations that actually help…","a":"Yelyzaveta Adova"},{"i":23,"d":"23-01","c":"PROD","t":"Transparencia total del cálculo en consumos de vehículos (\"Chamber of Secrets\")","w":"Ladies and gentlemen… The Chamber of Secrets has been opened…\nFrom el equipo, we bring you the cherry on top\nWe’ve just launched a new feature in vehicle consumptions that completely breaks the environmental impact “black box”.\nNow users don’t just see the final number… they can see exactly how it’s been calculated.\n· Full transparency in calculations\n◦ Visibility of all conversion factors used…","a":"Boris Landívar"},{"i":24,"d":"26-01","c":"PROD","t":"Migración de ficheros y datos procesados de Dynamo a la base de datos","w":"Migration update: Files and Processed Data\nAll files processed so far have been successfully migrated from Dynamo to our database.\nThis is an important step because, little by little, we’re recovering our independence from Dynamo and making the overall experience smoother and more reliable for our users.\nOne step closer to a Data Centric platform, more updates coming as we keep progressing","a":"Miguel Perez Contreras"},{"i":25,"d":"26-01","c":"PROD","t":"Rediseño de la interfaz de encuestas de movilidad","w":"We've redesigned the employee commuting surveys interface to make it easier to view and manage commuting periods.\nThe employee commuting surveys section now features a refreshed interface that simplifies data management.\n· Simplified view: The main table now shows consolidated employee-level information (email, name, number of periods, status, and total CO₂), giving you a clearer overview of your workforce.…","a":"Luis Escámez"},{"i":26,"d":"26-01","c":"CLI","t":"Comando own-workforce","w":"New command added to Dcycle CLI: own-workforce\nIPC Systems uploaded own workforce data by error and they want it gone.\nBefore: we had to create a support ticket, pass it to response team, wait weeks until someone had a some spare time to solve it --no autonomy, no speed, more noise.\nNow: use own-workforce and solve it in minutes. --fucking","a":"Luis Escámez"},{"i":27,"d":"27-01","c":"CLI","t":"Actualizar valores de employee_historic (total_km y demás)","w":"New CLI feature: Update variable values of a employee_historic list\nNow, you can update information about periods of employees that you want! Yo can update total_km, start_date and end_date of a employees periods list from a csv file.\nFor example, now Marina Oliveros will be able to upload the end_date of a list of 124 employees only creating a simple csv with the information.…","a":"Sergio Prieto García"},{"i":28,"d":"28-01","c":"PROD","t":"Visualizaciones exportables a Excel","w":"As announced by Iñigo's POC, many Clients requested it and we demonstrated it in the Workshop EINF. Visualisations via Excel are now available, courtesy of our beloved Mario García, who created the front and back ends!","a":"Vanesa García"},{"i":29,"d":"28-01","c":"INIT","t":"Arranca \"de borrar ficheros a borrado masivo de datos\"","w":"Wednesday 28th of January is a big day!\nProduct Team el equipo starts to build:\nFROM DELETING FILES TO BULK DELETING DATA\nTo align the product with reality: users think in data, not in files.\nSafer fixes, clearer actions, less frustration.\nClients feedback:\n“I need to be able to select multiple records and delete them at once.” — Nealis…","a":"Jack"},{"i":30,"d":"28-01","c":"INIT","t":"Prioridades de producto Q1 & Q2 2026","w":"Regarding Q&A in the all hands\nProduct Priorities Q1 & Q2 2026\nOur focus this semester is clear: make Dcycle indispensable for our customers.\nQ1: Reduce friction, increase stickiness\n- Easier data entry: better integrations, bulk uploads, API improvements\n- Internal health monitoring to detect at-risk customers before they churn\n- Fix the basics that cause frustration\nQ2: Expand value, support growth…","a":"Iñigo Medina"},{"i":31,"d":"28-01","c":"INIT","t":"Modelo de stickiness / Data Health Metrics","w":"Regarding Q&A in the all hands\nProduct Priorities Q1 & Q2 2026\nOur focus this semester is clear: make Dcycle indispensable for our customers.\nQ1: Reduce friction, increase stickiness\n- Easier data entry: better integrations, bulk uploads, API improvements\n- Internal health monitoring to detect at-risk customers before they churn\n- Fix the basics that cause frustration\nQ2: Expand value, support growth…","a":"Iñigo Medina"},{"i":32,"d":"30-01","c":"DOCS","t":"Documentación de CLI y MCP para automatización e IA","w":"New Documentation: CLI & MCP for Automation and AI\nWe've published comprehensive docs for two tools that open new possibilities for our clients:\n· CLI - Command line interface for automating workflows: bulk data uploads, scheduled reports, CI/CD integration.…","a":"Iñigo Medina"},{"i":33,"d":"02-02","c":"CLI","t":"rds sync: sincronizar la BBDD de producción en local","w":"New CLI Command: rds sync - Sync Production DB to Local\nTired of manually creating data in your local the database? Now you can sync real production data to your local environment with a single command.\nQuick start:\nOptions:\n· --tables users,orgs - Sync specific tables only\n· --exclude-tables audit_logs - Skip large/unwanted tables\n· --data-only - Only sync data (keeps existing schema)…","a":"Miguel Perez Contreras"},{"i":34,"d":"03-02","c":"PROD","t":"Campos condicionales personalizados en pivot tables","w":"Custom conditional fields available in pivot tables!\nNow you can customize your table by creating custom fields with conditions!\nThis will help companies to obtain the tables for EINF, ESRS or internal reportings in the same format they were already using.\nExample 1:…","a":"Ricardo Méndez Escobar"},{"i":35,"d":"03-02","c":"PROD","t":"Flujo supplier-specific totalmente automatizado","w":"Supplier-Specific Workflow: Now Fully Automated!\nTeam, we can now mandar a tomar por culo all that painful Notion documentation for supplier-specific uploads!\nTwo new CLI commands handle everything:\nUpload Emission Factors:\nUpload Purchases:\nWhat this means:\n· No more Postman collections\n· No more online Base64 converters\n· No more manual workflows\n· More CLI power\n· More autonomy for el equipo to handle these uploads…","a":"Sergio Prieto García"},{"i":36,"d":"03-02","c":"PROD","t":"Subida de commuting de empleados por CSV","w":"Employee commuting CSV upload\nYou can now upload your employee commuting data in bulk using CSV files. No need to send mobility surveys!\n(release note)","a":"Luis Escámez"},{"i":37,"d":"03-02","c":"INIT","t":"Primer test real en producción con Correos Express (~500K paquetes)","w":"It's time to make history AGAIN, tomorrow Correos Express will do the first production-for-real-test ingesting logistics data from the previous day (24h) that might be ~500K of packages\nwe'll see if we're ready for this level of performance serving our customers, probably some things will fail and we'll learn from that to improve the next test","a":"Iñigo Medina"},{"i":38,"d":"04-02","c":"PROD","t":"Company Diagram refactorizado y arreglado","w":"We identified that the Company Diagram had several issues that did not reflect the reality of how the organizations were linked.\nBecause of this we have refactored and fixed this view and modified a bit of it's functionality.\nWhat was lost:\n· You can move the blocks but the new position won't be saved.…","a":"Diego Acuña"},{"i":39,"d":"05-02","c":"PROD","t":"Carga masiva de commuting con Nuvo","w":"Bulk upload of employee commuting data is now supported with Nuvo:\nAutomatic column mapping\nAutomatic value mapping and data transformations\nError detection\nTemplates available with dropdown selects (Ana Mateu let's see what LUCTA thinks of this. They got a solution in less than 24h )","a":"Luis Escámez"},{"i":40,"d":"06-02","c":"PROD","t":"Columnas personalizadas en tablas (empezando por compras)","w":"New functionality from our new el equipo forntender Almudena Gómez-Plata\nTired of scrolling to the right to see all the table information????\nBothered due to seeing so much information not relevant for you at the moment???\nWell… Custom columns is here to save the day\nPD: Only available for purchases right now.","a":"Boris Landívar"},{"i":41,"d":"06-02","c":"PROD","t":"Login OAuth con Google","w":"OAuth Login with Google - First Step Toward Enterprise-Ready Authentication\nWe're rolling out OAuth login with Google as our first identity provider. This is just the beginning—Microsoft is next in line.\nWhy this matters for our enterprise ambitions:\n· Single sign-on capabilities expected by large organizations\n· Reduced friction in user onboarding\n· Foundation for more advanced auth features (SSO, SAML)…","a":"Iñigo Medina"},{"i":42,"d":"09-02","c":"PROD","t":"Nuevos roles y control avanzado de permisos","w":"New Roles & Advanced Permission Control\nWe've revamped the roles system so you can give each team member exactly the access they need:\n· Administrador — Full control, including user invitations\n· Editor — Full access, except user management\n· Reader — Read-only access (great for auditors & execs)\nPlus, custom roles are now way more flexible — you can configure dashboard access, task management, file deletion, and more.…","a":"Iñigo Medina"},{"i":43,"d":"09-02","c":"CLI","t":"purchase purge-orphan-suppliers","w":"NEW CLI COMMAND:\nNow you can use dc purchase purge-orphan-suppliers --org <organization_idto delete all the suppliers without purchases associated from an organization_id.\nBe careful because this endpoint delete every supplier without filtering if it is active or in_review or in_progress.","a":"Boris Landívar"},{"i":44,"d":"09-02","c":"SKILL","t":"/pre-audit: validación de consistencia entre dashboard y descargas","w":"Important improvement to our /pre-audit skill in Claude: validation of consistency in scope emissions between dashboard and downloads","a":"Luis Escámez"},{"i":45,"d":"10-02","c":"PROD","t":"Nuevos campos en pivot tables GHG e ISO 14064 (facility, país)","w":"New fields to play with in GHG and ISO14064 pivot tables:\n· Facility\n· Country (from the facility, the vehicle or the organization, depending on the data category)\n· License plate\nWhat facility has more emissions?\nWhat are the emissions of my vehicles?\nThis is a step forward helping companies for:\ntheir ISO14001 (obtained at facility level)…","a":"Ricardo Méndez Escobar"},{"i":46,"d":"10-02","c":"PROD","t":"Cálculo automático de distancias en commuting masivo","w":"Auto-distance Calculation in Bulk Employee Commuting\nBulk commuting uploads now automatically calculate distances when origin and destination are provided, removing the need to manually enter kilometers. Only available via bulk upload -read more","a":"Luis Escámez"},{"i":47,"d":"10-02","c":"AGENT","t":"Disicler: acceso directo a datos de cliente desde Slack","w":"Introducing Disicler — your direct line to customer data\nI've built Disicler to solve a simple problem: every time CS/GTM/Anyone needs a data point about a customer, it becomes a back-and-forth with Product or Engineering. Health scores, upload activity,\nsubscription details — answers that live in our database but require someone else to look them up.…","a":"Iñigo Medina"},{"i":48,"d":"10-02","c":"CLI","t":"Borrar peticiones de logística filtrando por fichero","w":"New CLI command to delete logistic requests filtering by file.\nBye, bye, notebook to delete logistic requests\nHello my new dear, CLI","a":"Sergio Prieto García"},{"i":49,"d":"11-02","c":"SKILL","t":"/ecoinvent-match: matching automático de factores de emisión en LCAs","w":"BIG improvement in LCAs: automatic emission factor matching with /ecoinvent-match\nJust upload the excel file and Claude will work with you to find the best matches. This process was a killer bottleneck in our LCA product, now it's even fun to do!","a":"Luis Escámez"},{"i":50,"d":"11-02","c":"PROD","t":"Reparto de facturas entre cualquier organización del diagrama","w":"Full invoice distribution across all organizations from a company diagram - Available NOW!\nel equipo Now all customers can split invoices between any organization! parent, child, grand-parent, grand-child, sister, grand-sister, niece, grand-niece…\nNo more friction. More flexibility. (And yes — Solarig is happy )\nCheck limitations here\nMore flexibility. Clear limits. Zero confusion.","a":"Jack"},{"i":51,"d":"11-02","c":"SKILL","t":"/support: debug automático de tickets de HubSpot","w":"New skill /support in Claude.\nHow it works:\n1. Paste a link to the Hubspot ticket.\n2. Claude debugs automatically.\n3. When found the root cause, you can choose:\na. Solve the problem insitu\nb. Tell Claude to create a ticket in RT and send a Slack message in <#C09GU19NAJD|product-response-team>","a":"Luis Escámez"},{"i":52,"d":"12-02","c":"PROD","t":"Holdings pueden subir datos de Own Workforce de sus filiales","w":"News for clients with EINF / Sustainability reporting / Human Resources projects!\nNow Holdings can upload Own Workforce data from the holding company for the whole group in the same upload!\nLess friction in uploading data.higher Data Health\nMore info --link","a":"Ricardo Méndez Escobar"},{"i":53,"d":"12-02","c":"SKILL","t":"/create-pivot-metric: crear métricas de pivot table con IA","w":"As you could have observed, I've been enriching the pivot-table functionality with lots of metrics lately.\nIt helped me understand the patron I and the AI followed to create and test the features.\nHowever it looks like we always need new metrics.so why don't you try to contribute?…","a":"Ricardo Méndez Escobar"},{"i":54,"d":"13-02","c":"PROD","t":"Mejoras en el portal de soporte (conversaciones in-app)","w":"Support Portal Improvement\nWe've improved the conversation experience in the support portal to get closer to the client.\nAccess all your tickets\nIn-app conversations\nNotification when action is needed from the client","a":"Luis Escámez"},{"i":55,"d":"13-02","c":"SKILL","t":"Sentry + Claude Code vía MCP y Git Worktrees","w":"Inspired by What If…? from Marvel, two questions came to mind:\n· What if. our main error monitoring tool, Sentry, could talk to my best friend, Claude Code?\nThat’s where Connectors and MCPs enter the conversation, Claude’s tools for supercharging its powers. The result: faster debugging, broader context, and solutions guided by me — the human with the judgment to make the right call.…","a":"Miguel Perez Contreras"},{"i":56,"d":"16-02","c":"PROD","t":"Descarga en Excel de la tabla de KPIs tal cual se ve","w":"Download of pivot tables in excel!\nWhat's new?\nBefore, you could download the raw (ugly) data that was used to build the (beautiful) pivot table with your data.\nNow, you can download both:\n· Pivot table data - the table the same way you see it in the app\n· Detailed data - the raw data used to build the table\nWhy is this important?\nThe final goal of our ESG managers users is to share their results with:\n· auditors\n· colleagues…","a":"Ricardo Méndez Escobar"},{"i":57,"d":"16-02","c":"PROD","t":"Selección y borrado masivo de datos (no de ficheros)","w":"BULK data SELECT + BULK data DELETE NOW AVAILABLE!\nel equipo launched new initiative. We’re moving from file-based deletion to data-level control.\nNow you can:\n1. Filter records (by file, supplier, by creation date, and more!)\n2. Select multiple rows\n3. Delete selected data + confirm what they are deleting.\nAvailable in:…","a":"Jack"},{"i":58,"d":"16-02","c":"PROD","t":"Integración DATADIS arreglada y rediseñada","w":"DATADIS integration fully fixed and improved\nCorrected all known issues in the Datadis → Dcycle integration.\nIt’s now aligned with the new Dcycle design and more user-friendly.\nClearer and more detailed error messages.\nRead full details here\nFixed issues\n1. Deleting a contract no longer deletes associated Datadis consumptions\n2. Fixed generic error when creating consecutive contracts with the same CUPS…","a":"Jack"},{"i":59,"d":"16-02","c":"SKILL","t":"make claude-dev / make claude-cleanup (worktrees para Claude)","w":"New Makefile Commands for a Smoother Claude DX!\nSay goodbye to juggling branches manually or losing track of your Claude sessions. I’ve added two new commands to streamline your workflow:\nmake claude-dev\nSpin up a dedicated, isolated Git worktree for your Claude session in one step.\n· Enter a branch name.\n· Claude starts in its own worktree.\n· Keep your main workspace clean and focus on debugging or experimenting freely.…","a":"Miguel Perez Contreras"},{"i":60,"d":"16-02","c":"SKILL","t":"/ecoinvent-match cubre el proceso completo de matching en BBDD","w":"Ok so now /ecoinvent-match can handle the full EF matching process. Use the skill and it will:\n1. Look for all clients across the DB with unmatched resources.\n2. Work with you to find the best match.\n3. Directly save the results in the DB, no excel file needed.","a":"Luis Escámez"},{"i":61,"d":"17-02","c":"PROD","t":"Pivot table de consumo de agua (m³ y litros)","w":"Water Consumption Pivot Table\nHey team! Excited to share a new product update\nWe've launched a new pivot table that allows our customers to analyze their water consumption flexibly, in both cubic meters (m³) and liters (L).\nWhat's included?\n· Financial & operational consolidation — Consumption data is integrated across both views, enabling customers to cross-reference costs with actual operational volumes.…","a":"Marina Oliveros"},{"i":62,"d":"17-02","c":"CLI","t":"Comandos de gestión de proveedores (dc supplier)","w":"New Supplier Management CLI Commands\nWe've just released a new set of CLI commands to manage suppliers directly from your terminal - this makes it much faster to add and manage suppliers in bulk!\nWhat's New\nYou can now create, list, and filter suppliers using the dc supplier command group.\nAvailable Commands\n1. Add a Single Supplier\ndc supplier add \"Supplier Name\" --type TYPE\n2. Batch Add Multiple Suppliers…","a":"Cristina Marín"},{"i":63,"d":"17-02","c":"INIT","t":"Nuevo proyecto GLEC (lanzamiento 27 de febrero)","w":"We have a new initiative going on.\nNew GLEC Project: Launching Friday, Feb 27th\nWhat’s the hype about?\n· Connect Once, Use Often: Centralize company data but use it across multiple projects.\n· Precision Data Control: Pick specific trips, invoices, and consumptions into your projects. Keep full traceability, zero guesswork.…","a":"Ricardo Méndez Escobar"},{"i":64,"d":"18-02","c":"WEB","t":"Nueva web dcycle.io (new.dcycle.io) abierta a toda la empresa","w":"Introducing the new Dcycle website\nHey team! We're excited to share the new dcycle.io — a complete rethink of how we present ourselves, how we work together, and how we tell our story.\nA note on the URL: The site is currently live at new.dcycle.io as a staging domain. Once we've migrated the remaining content from the current site and we're collectively happy with how…","a":"Iñigo Medina"},{"i":65,"d":"19-02","c":"DOCS","t":"Tutorial GLEC en docs.dcycle.io","w":"GLEC Documentation added to","a":"Luis Escámez"},{"i":66,"d":"19-02","c":"PROD","t":"Desplegable de combustibles mejorado en lecturas de factura","w":"Improved fuels dropdown in invoice readings\n· ESP/RoW tag added to know which fuel can be used for each facility\n· Fuels ordered alphabetically\n· Search bar for easy access","a":"Luis Escámez"},{"i":67,"d":"19-02","c":"WEB","t":"Hub de webinars y workshops","w":"We just shipped something that's been on the roadmap for a while: webinars and workshops now have their own dedicated space on the website.\nWe believe one of our biggest differentiators is how we walk alongside our customers on the sustainability journey. We don't just hand them tools — we make the complex manageable, and the difficult genuinely fun.\nThat deserved its own home:…","a":"Iñigo Medina"},{"i":68,"d":"19-02","c":"PROD","t":"Data Activity Detail: histórico de quién cambió qué y cuándo","w":"DATA ACTIVITY DETAIL — NOW AVAILABLE!\nWe (el equipo) have shipped a new Data Activity section in categories detail forms. Every data edit is now tracked and visible — who changed what, and when.\nNow you can:\nSee the full history of changes on any record\nExpand each entry to see exactly which fields changed (old value → new value)\nKnow who made each change and when\nSee the creation activity with the initial data values…","a":"Rubén Castro"},{"i":69,"d":"20-02","c":"PROD","t":"Pivot table de residuos","w":"New Pivot Table for Waste management!\nUse cases:\n· 14001\n· EINF, CSRD, Ecovadis reporting\n· Waste law in spain\nFunny story behind:\nI was showing to Paolo Mazza how the skill /create-pivot-metric works, and in 20 min (vibe coding), it was 95% ready, so I had to finish it\nWhere?\nProjects>Visualizations>Environmental>Waste","a":"Ricardo Méndez Escobar"},{"i":70,"d":"20-02","c":"PROD","t":"Pivot table de accidentes y absentismo","w":"New Accidents and Absenteeism pivot table!\nUse cases:\n· ISO 45001\n· EINF, CSRD, Ecovadis reporting\n· RRHH shiet\nWhere?\nProjects>Visualizations>Social>Accidents and Absenteeism\nWe only miss 2 more pivot tables to have all the social KPIs EINF requires.","a":"Ricardo Méndez Escobar"},{"i":71,"d":"20-02","c":"CLI","t":"Creación masiva de empleados inexistentes","w":"New CLI Superpower: create non-existing employees in bulk\nteeeaaaaam we now have a brand-new CLI command:\nWhat does this mean?\nNo more scripts needed\nMore autonomy for el equipo and el equipo\nFaster employee uploads\nMultiple organizations can be included in the same file\nWorks for non-existing employees (it creates them directly)…","a":"Lucedh Hernandez"},{"i":72,"d":"20-02","c":"WEB","t":"Nuevo hero con conversación de agente en vivo","w":"We just shipped a new hero on new.dcycle.io — and it's not just a visual refresh.\nThe dashboard mock now transforms into a live agent conversation. You ask about your energy data, your renewable mix, your financial savings — and the agent answers with real charts and KPIs, right inside the product.…","a":"Iñigo Medina"},{"i":73,"d":"23-02","c":"PROD","t":"Métricas económicas propias en la pivot table de compras","w":"Yeah yeah yeah, another day with pivot table improvements!\nNow, you can create your own metrics about purchases stuff. You can select operation type, currency, year, company, etc, and see your economic impact in the purchases of your holding!","a":"Sergio Prieto García"},{"i":74,"d":"23-02","c":"WEB","t":"Sección Energy & Mining","w":"Energy & Minig section is also available on our website!!\nFeel free to improve anything. I will be adding as much information as possible this week, so any feedback you may have will also be very helpful.","a":"Lucas Abad"},{"i":75,"d":"24-02","c":"PROD","t":"Agrupación por año fiscal en pivot tables","w":"Important update for our clients doing reporting, partners and international.\nPivot tables now support fiscal year grouping, aligning your data analysis with your organization's accounting calendar.","a":"Luis Escámez"},{"i":76,"d":"24-02","c":"PROD","t":"Pivot de compras: filtro por proveedor/reciclado + celda kgCO2e","w":"Your wishes are my commands\nImprovements in purchases pivot-table! Now, you can filter by supplier and recycled, aaaand. you can add kgco2e cell!!\nFrom now on, our customers can pool and compare the money they spend on their purchases along with their associated emissions","a":"Sergio Prieto García"},{"i":77,"d":"24-02","c":"PROD","t":"Scope 3 Categoría 11: uso de productos vendidos","w":"Expanding Scope 3: Use of Sold Products (Category 11)\nHow do you calculate it?\n· Go to the new data card “Your Company’s Products”.\n· Bulk upload the products sold (name, country and quantities).\n· Add their use-phase data (lifetime, electricity consumption, fuel and water use).\nTadaaaa — instant calculation!\nWhy is it relevant?\n· It completes your Scope 3 measurement…","a":"Boris Landívar"},{"i":78,"d":"24-02","c":"WEB","t":"Sección Expert Guidance","w":"New section on the website: Expert Guidance\nExpert guidance accounts for 30% of the key buying factors for our clients — yet this fundamental part of our perceived value wasn't on the website until now.\nJust published a new page under Solutions designed to break through prospects' fears: you're never alone, the best advisors are with you in every audit and every complex moment.…","a":"Jacobo Umbert"},{"i":79,"d":"24-02","c":"WEB","t":"Sección Finance","w":"The Finance section (the best one, obviously!) is finally live on the website. Feel free to check it out. I’ll be uploading more info throughout the week, so if you have any feedback or see anything to improve, it would be super helpful!","a":"Carmen Báscones Liaño"},{"i":80,"d":"25-02","c":"SKILL","t":"/answer-client: respuestas a clientes con contexto de HubSpot + BBDD","w":"New skill available /answer-client in the backend repo: el equipo you will love this\nWhat it does: Automates drafting professional responses to client questions by pulling context from multiple sources before composing the answer.\nHow it works:\n1. HubSpot lookup — Searches for the company, deals, and contact person to understand the client relationship (scopes, verification status, partnerships team, etc.)…","a":"Luis Escámez"},{"i":81,"d":"25-02","c":"WEB","t":"Reglas de SEO y linter de slugs en el repo","w":"SEO guidelines added to the project\nWe've added a set of SEO rules to the repository so that all content we publish: blog posts, landing pages, and collection hubs, follows a consistent SEO standard.\nWhat's new:\n· CLAUDE.md now includes an \"SEO Rules\" section with guidelines for URL slugs, blog post structure, landing page section order, and internal linking strategy…","a":"Cristina Alcalá-Zamora"},{"i":82,"d":"25-02","c":"WEB","t":"221 posts de blog migrados (EN/ES/DE)","w":"221 blog posts migrados. Todos los que existen en src/content/blog/:\n· 130 en inglés\n· 75 en español\n· 16 en alemán\nLos 221 ya estaban en el repositorio y se despliegan automaticamente con cada build de Amplify. No se perdió ninguno. El push a main que hicimos dispara el build y los 221 quedan live en new.dcycle.io.","a":"Cristina Alcalá-Zamora"},{"i":83,"d":"25-02","c":"WEB","t":"Nueva landing de blog con filtros y buscador","w":"Cambiada la landing del blog!! Como todo, no es definitivo, pero hay un pasito más de estructura, filtros y una barra de buscador Antes vs después","a":"Cristina Alcalá-Zamora"},{"i":84,"d":"25-02","c":"WEB","t":"Moana: agente conversacional en la home","w":"Tengo novia y se llama Moana.\nHe hecho un cambio en la web, me decis que opinais.\nObjetivo:\na. maximar la captacion de leads, sin necesitar pasar por request a demo o descargarte algo\nb. crear un wow effect, nadie lo tiene en ESG.\nTe metes y te aparece Moana con la cual puedes hablar instantaneamente y en vez de hacer scrolling en la web buscando casos eccc le preguntas cualquier cosa. pero cualquiera, y te habla.…","a":"Davide"},{"i":85,"d":"25-02","c":"WEB","t":"Sección de Decarbonization (ES/EN)","w":"The Decarbonization section is finally live on the website (in both Spanish and English, because we're fancy like that). Feel free to check it out:\n· Decarb Spanish version\n· Decarb English version\nImportant note: everything there is based on real data and what the product actually does – we don't want to play with client expectations.…","a":"Lucía Mosquera"},{"i":86,"d":"25-02","c":"WEB","t":"Auto-blog: vigilancia regulatoria y publicación automática en 3 idiomas","w":"Primer sistema de auto-blog está configurado y funcionando\n¿Cómo funciona? Al inicio de cada sesión que inicie con Claude, se revisan automáticamente estas 4 fuentes regulatorias:\n1. GHG Protocol ghgprotocol.org/blog Estándares de contabilidad de carbono\n2. EFRAG efrag.org/en/news ESRS, CSRD, sostenibilidad EU\n3. EU Official Journal eur-lex.europa.eu Legislación UE sostenibilidad…","a":"Cristina Alcalá-Zamora"},{"i":87,"d":"26-02","c":"PROD","t":"LCA Impact Dashboard interactivo (EN 15804)","w":"LCA Impact Dashboard is LIVE!\nWe just shipped one of the most requested features for Life Cycle Assessments — a fully interactive dashboard that lets you visualize environmental impact at a glance!\nWhat's new:\n· Donut chart — see impact split by life-cycle stage (A1–A4, B6, B7)\n· Bar chart — compare impact across product phases\n· Top contributors — instantly spot what drives the most impact…","a":"Luis Escámez"},{"i":88,"d":"26-02","c":"PROD","t":"Decimales configurables en visualizaciones","w":"You can now add or remove decimals (with rounding, of course) in visualizations.","a":"Almudena Gómez-Plata"},{"i":89,"d":"26-02","c":"CLI","t":"Carga masiva de factores de emisión personalizados","w":"Think about this story\nImagine that another BIG HOLDING COMPANY starts working with Dcycle and, for example, wants to use its infinite list of custom emission factors. +500 custom emission factors.\nOMG, the team can already start buying hand cream after making +2000 clicks in a couple of hours creating emission factors one by one.…","a":"Sergio Prieto García"},{"i":90,"d":"26-02","c":"PROD","t":"Unidades correctas en pernoctaciones (\"night\")","w":"NEW FIX: Accommodation units updated!\nSmall fix, but a notable change for clients with overnight stay data.\nPreviously, overnight stays showed generic units (units_short_guess_night). (horrible ) but not anymore.\nFrom today, when you upload overnight stays you'll see the correct units — night — in all languages available in Dcycle. No confusion, no noise, all clean.\nThanks for your help Luis Escámez","a":"Ana Romero"},{"i":91,"d":"26-02","c":"WEB","t":"ESG Regulation Checker interactivo","w":"Just shipped: ESG Regulation Checker\nBuilt a new interactive tool from scratch — new.dcycle.io/resources/regulation-check\nYou enter your country, company size and sector and get an instant answer on whether your company is legally required to measure its sustainability data, and exactly which regulations apply.\nWhat it covers:\n· Active obligations\n· Upcoming: CSRD value chain requests, EBA bank requirements, CSDDD from 2029…","a":"Paula Cons"},{"i":92,"d":"26-02","c":"WEB","t":"Sección Consumer Goods","w":"I am delighted to announce that I have managed to create and launch the consumer goods page in a very short time and with incredible results.\nThank you for encouraging and motivating us to explore a field that was initially obscure and very complex, and which in a short time is making me want to do more and more.","a":"Michel"},{"i":93,"d":"26-02","c":"WEB","t":"Sección IT & Technology Services","w":"No me dejan publicarlo en solutions todavía (por ordenes de Mktg), pero la parte de: Sustainability for IT and technology services companies, It´s live. Vive en el footer\nCualquier comentario es más que bienvenido","a":"Paula Serrats"},{"i":94,"d":"26-02","c":"AGENT","t":"Primer prototipo del Dcycle MCP Server","w":"Early look: Dcycle MCP Server\nWe just got a first working prototype of our MCP (Model Context Protocol) server — connecting AI assistants like Claude directly to Dcycle data using our new hex-arch API.\nWhat works today: org structure, invoices, vehicles, employees, purchases, business travels, and logistics — all queried via natural language through Claude.…","a":"Iñigo Medina"},{"i":95,"d":"27-02","c":"PROD","t":"Factores personalizados creados en la matriz y heredados por filiales","w":"Necesitamos poder aplicar factores de emision personalizados a todas las filiales desde la matriz- o desde donde las creemos. Pero es muy manual tener que crearlas una a una en todas la organizaciones. - Dominion\n· Cliente quiere crear varios factores de emisión personalizados iguales en todas tus cuentas hijas “no veo sentido ir a cada cuenta creando el mismo factor ” - Alma Carraovejas…","a":"Almudena Gómez-Plata"},{"i":96,"d":"27-02","c":"PROD","t":"Aviso de límites al descargar el Excel de Scope 1 y 2","w":"Friday news, now when a client wants to download the Scope 1 & 2 Excel sometimes they will see this:\nWe have performance limits that we are addressing but in the meantime, we need to be more transparent\nThey can modify and download for less organizations and for less data, we warn them that it may not arrive because of the amount of records","a":"Diego Acuña"},{"i":97,"d":"27-02","c":"WEB","t":"Landing de Acquisitions (M&A)","w":"Anyone thought CorpDev team would be left behind on building product?\nNew page live: Acquisitions (v1): we just launched our M&A landing page, to position ourselves as the consolidator in the market. It is a dedicated space for ESG software founders who are considering their options (sell now before its too late!).…","a":"Álvaro San Pedro"},{"i":98,"d":"27-02","c":"WEB","t":"Sección Retail","w":"Website update: I have improved the consumer goods section and created and launched the retail section.\nPlease el equipo check","a":"Michel"},{"i":99,"d":"27-02","c":"WEB","t":"Página How We Work","w":"What we covered at the all hands is already at new.dcycle.io/about/how-we-work","a":"Juanjo Mestre"},{"i":100,"d":"28-02","c":"SKILL","t":"/sync-data: sincronizar datos de producción en local","w":"New /sync-data Skill for Claude Code\nNew Claude Code skill to sync production data to your local DB.\nType /sync-data in Claude Code. It supports:\n· Full sync or specific tables\n· Export to SQL file\n· Optional anonymization of sensitive data\nNo more manual CLI commands or FK/duplicate key headaches.\nRequires: SSH tunnel + DCYCLE_DB_USER env var.\nBuilt on top of Miguel Perez Contreras's rds sync CLI command.…","a":"Luis Escámez"},{"i":101,"d":"03-03","c":"PROD","t":"Informe de logística: desglose de flota y ahorro por electrificación","w":"Logistics Report: Fleet Breakdown & Electrification Savings\nTwo new sections in the logistics report:\n1. Fleet-type breakdown\nCross-tabulates ownership × energy type:\nEach cell returns: items, distance, CO₂e, and % of total.\n2. Electrification savings\nHow much CO₂e did your electric fleet actually save?","a":"Luis Escámez"},{"i":102,"d":"03-03","c":"PROD","t":"Nuevo método de cálculo de KPIs de plantilla (headcount)","w":"Im updating the calculation method of Own Workforce KPIs in Number of Employees pivot tables.\n· Headcount --this metric represents the number of ACTIVE emplyoees at the end of the period\n◦ Before: if a contract was ended in 31/12/2025, this employee didnt count.\n◦ Now: it does count +1\n· FTE --this metric represents the average number of employees doing EFFECTIVE work in a period…","a":"Ricardo Méndez Escobar"},{"i":103,"d":"04-03","c":"PROD","t":"Emisiones históricas calculadas fuera de Dcycle en todas las categorías","w":"Include any emissions calculated outside of Dcycle into your carbon footprint\nYou can now record historical emissions across all carbon footprint categories.\nMore in news -","a":"Luis Escámez"},{"i":104,"d":"04-03","c":"SKILL","t":"/morning-emails: gestión automática del correo de clientes","w":"New Claude Code skill: /morning-emails\nAutomatically processes unread client emails every morning:\n· Checks HubSpot to identify client domains\n· Searches for unread emails from the last 2 days\n· Researches answers in the backend codebase, frontend and database\n· Detects meeting requests and suggests available calendar slots\n· Creates Gmail drafts ready to review and send…","a":"Ana Mateu"},{"i":105,"d":"04-03","c":"SKILL","t":"Informes de auditoría retributiva (RD 902/2020)","w":"New Claude Skill: Pay Equity Audit Reports (Auditoría Retributiva)\nWe've just shipped a new skill that generates pay equity audit reports according to with Spanish RD 902/2020 regulation.\nel equipo For now, Internal use only — given the sensitivity of the data involved, this skill is strictly for internal analysis purposes.\nWhat it does?…","a":"Marina Oliveros"},{"i":106,"d":"04-03","c":"WEB","t":"Bloque de contenido recomendado por industria en HubSpot","w":"Added: Industry-Recommended Content Block\nHubSpot reads each contact's Industry property and automatically sends them content tailored to their specific sector.\nBehind the scenes, Claude Code is generating blog posts simultaneously for every industry in our CRM, so no industry gets left behind.…","a":"Cristina Alcalá-Zamora"},{"i":107,"d":"04-03","c":"WEB","t":"Emails de nurturing y demo reconstruidos con Claude Code","w":"Claude Code + HubSpot update\nI've been using Claude Code to rebuild our nurturing and demo email HTMLs, and the results are pretty solid. Here's how it works and what we've gained.\nWhat does it actually do?\nClaude Code doesn't integrate directly with HubSpot for dynamic designs (yet ), but it can generate and edit full email HTMLs pulling updated content from dcycle.io (resources, webinars, etc.).…","a":"Cristina Alcalá-Zamora"},{"i":108,"d":"05-03","c":"PROD","t":"Nuevo proyecto de logística GLEC publicado","w":"NEW LOGISTICS PROJECT - GLEC PUBLISHED\nNow you can say:\nWe are not a Carbon Footprint Calculator anymore\nEach framework has its own space\nLogistics clients will feel much more welcomed in Dcycle\nThis story is the continuation of |New GLEC project in Dcycle>, where we raised the problem and the challenge. Here we tell you how the cycle has ended.…","a":"Ricardo Méndez Escobar"},{"i":109,"d":"05-03","c":"AGENT","t":"Projects CRUD API en el Developer Center","w":"Projects CRUD API — now live in the Developer Center\nYou can now create, list, get, update, and delete projects via API key — no browser session needed.\nView the docs","a":"Iñigo Medina"},{"i":110,"d":"05-03","c":"SKILL","t":"/echo-fathom: señales de producto desde las reuniones de Fathom","w":"New skill: /echo-fathom — daily meeting signal extractor\nJust shipped a new Claude skill that pulls product signals from your Fathom meetings automatically.\nWhat it does:\n· Fetches today's external client meetings from Fathom (scoped to your account)\n· Reads the transcript and extracts genuine product signals: pain points, feature requests, moments of confusion, competitive mentions…","a":"Ana Mateu"},{"i":111,"d":"05-03","c":"SKILL","t":"/sherlock: auditoría profunda de datos de emisiones","w":"New Skill: Sherlock (/sherlock) | Deep Analysis\nLet me introduce you to Sherlock, a Claude Code skill for automated, deep-tier auditing of emission data across parent organizations and subsidiaries.\nHow to use:\n/sherlock <org_id<year>\nWhat it handles:\n· Infrastructure: Auto-opens DB tunnels and resolves full parent/child hierarchies.…","a":"Daniel Sáenz de Tejada"},{"i":112,"d":"05-03","c":"WEB","t":"Imágenes automáticas de cabecera en el blog (API de Unsplash)","w":"Ya tenemos imágenes automáticas en el blog!\nCada post del blog ahora genera su propia foto de cabecera automáticamente vía la API de Unsplash. Cero trabajo manual, se acabó buscar imágenes a mano!\nEchad un ojo y si os animáis a escribir algo. ya sabéis!!","a":"Alba Ortiz"},{"i":113,"d":"06-03","c":"PROD","t":"Carga masiva de consumos de instalaciones (luz, agua, combustible)","w":"Bulk Upload for Facility Consumption\nYou can now upload electricity, water, and fuel consumption data for all your facilities in bulk using a single file.\nThis was a crucial blocker for our 15% international ARR goal\nMore info -","a":"Luis Escámez"},{"i":114,"d":"06-03","c":"PROD","t":"Compras multidivisa con tipos de cambio del BCE","w":"Multi-Currency Purchases\nPurchases can now be created in currencies other than euros. Exchange rates\nare pulled automatically from the ECB, and displayed alongside the reference\ndate on each purchase.","a":"Diego Acuña"},{"i":115,"d":"06-03","c":"PROD","t":"Métricas de intensidad en pivot tables de logística","w":"Intensity Metrics - Pivot tables for Logistics\nHéctor, Sustainability Director from Sesé said he was not working with Intensity metrics because he could'nt get the data right.\n'It is our first strategic bottleneck, we need to know how efficient we are and whether we improve that efficiency over time or not\"\nNow within the Logistics GLEC project, he will be #AlwaysReady with the new Pivot Table for Intensity Metrics.…","a":"Ricardo Méndez Escobar"},{"i":116,"d":"09-03","c":"PROD","t":"Informes GHG editables","w":"Just launched: Editable GHG Reports\nNo more Inspect nightmare. No more copy-paste errors. No more last-minute panic when verificators request changes.\nUsers can now edit GHG reports directly in Dcycle:\nEdit any numeric or text value\nDuplicate pages to reuse structure\nAdd sections to customize layout\nPilot phase — available on dcycle.io only, edits apply to one season. Starting focused so we can learn fast and expand.…","a":"Yelyzaveta Adova"},{"i":117,"d":"09-03","c":"PROD","t":"Menciones dentro de Dcycle","w":"they're finally here\nMentions have landed in Dcycle The Jew and the Brazilian joined forces and built the thing many of you have been waiting for!! You can now @ other Dcycle users and they'll actually get a notification. jejejeje\njust type @ and go, available to test in Land Tasting\nfor now it lives in task comments but it's built to scale, more places across the app coming soon\nspecial thanks Rubén Castro","a":"Jadde Suarez"},{"i":118,"d":"09-03","c":"AGENT","t":"Organization Tree API en el Developer Center","w":"Organization Tree API — now live in the Developer Center\nYou can now retrieve your full organization hierarchy via API key — from the holding company down to every subsidiary.\nView the docs\nView the new","a":"Sergio Prieto García"},{"i":119,"d":"09-03","c":"SKILL","t":"/news: digest de novedades de #product-news","w":"New skill available: /news\nGenerates a digest of product updates straight from <#C064HEDNKBP|product-news>. Whether you've been on vacation or just haven't had time to check the channel in days — it catches you up on everything.\nWhat it does:\n· Connects to <#C064HEDNKBP|product-newsand reads messages from the date range you choose\n· Summarizes product updates clearly: what it is, what it's for, and what impact it has…","a":"Ana Romero"},{"i":120,"d":"09-03","c":"SKILL","t":"/morning-emails con pipeline de tickets de HubSpot","w":"Updates to the /morning-emails skill\nel equipo\nYou will be able to see your pipeline tickets in HubSpot organized and easier to manage each morning.\nWhat's new:\n· Tickets grouped by priority: Urgent / Questions / Meetings / Support Data / Skip — sorted oldest to newest within each section\n· New \"Date\" column → see when the client last replied at a glance…","a":"Ana Romero"},{"i":121,"d":"09-03","c":"INIT","t":"Nuevo repo Go to Market","w":"New repo: Go to Market\nHey team! I've created a shared repository for our Go to Market efforts:\nThe idea is to have a single place where we can upload all the tools, skills, and resources that Go to Market teams are building — and everyone else is welcome to contribute too.…","a":"Jacobo Umbert"},{"i":122,"d":"10-03","c":"PROD","t":"Nuevos gráficos dinámicos en visualizaciones","w":"Visualize, explore, decide — New dynamic charts\nPivot tables are a fundamental tool for exploring aggregated data in your visualizations. But some questions are better answered visually: which category accounts for the most emissions? What proportion does each site represent of the total? For those decisions, sometimes a chart is all you need.…","a":"Rubén Castro"},{"i":123,"d":"10-03","c":"SKILL","t":"/prepare-qbr: QBRs de cliente automáticos","w":"_Nueva skill de Claude Code: /prepare-qbr_Hoy hemos lanzado una skill de IA para preparar QBRs de clientes de forma automática. En menos de 5 minutos genera un informe estratégico completo combinando datos de HubSpot, Notion y la base de datos de producción.¿Cómo funciona?\n· Escribe /prepare-qbr [nombre del cliente] en Claude Code y la skill:Busca el contrato, deal y contactos en HubSpot…","a":"Cecilia Bayas"},{"i":124,"d":"10-03","c":"CLI","t":"dc purchase upload + skill /file-transform","w":"Dc purchase upload CLI + /file-transform skill\nNew: /file-transform skill\nInteractively converts any client Excel/CSV into Dcycle's bulk upload format. Claude reads the file, proposes column mappings, asks about currency/country/exclusions, previews the result, and writes the output CSV. Supports multi-sheet Excel with date extraction from sheet names.…","a":"Daniel Sáenz de Tejada"},{"i":125,"d":"11-03","c":"CLI","t":"dc-walrus: la CLI instalable en cualquier Mac/Linux","w":"Dc-walrus is live. What the hell does this even mean?\nThis means anyone (with mac/linux at least) can install Dcycle CLI and use it from their own computer.\nWe're aware this is a weird technology for most of our current clients. But this is the way most advanced software is being used right now (via API/via CLI).\nYou can do:\nbrew tap Dcycle-by-WUM/tap\nbrew install dc-walrus…","a":"Daniel Jiménez"},{"i":126,"d":"12-03","c":"SKILL","t":"Recopilación automática de evidencias de deducciones I+D 2025","w":"Sometimes innovation is also about making the grey areas shine\nShoutout to Bernardo and Juan for challenging me with gathering R&D tax credit evidence for all of 2025. The task: screenshots of Jira tickets and project management tools, for every team member, across different months. Sounds fun, right?…","a":"Iñigo Medina"},{"i":127,"d":"13-03","c":"PROD","t":"Lecturas automáticas de facturas vía Cuenco","w":"Auto Readings added to invoices via Cuenco:\nUpload invoice file -Get Invoice classification + File Reading. No need to click -process invoice.\nFile auto processes if invoice classification is confident enough.\nThis needs a lot of UX improvements. Coming soon.","a":"Daniel Jiménez"},{"i":128,"d":"13-03","c":"PROD","t":"Selección rápida de fechas al crear proyectos","w":"Quick date selection for projects\nWhen creating a project we always had to manually set:\n· Start date\n· End date\n· Due date\nSince many projects fall into common periods, this became a bit repetitive.\nSo, added quick date buttons:\n· Last year\n· Last quarter\n· This year\n· Custom\nNow you can pre-fill the dates with one click, or still choose custom dates as usual.\nSmall change → smoother project creation.","a":"Jadde Suarez"},{"i":129,"d":"13-03","c":"PROD","t":"Carga masiva de factores de emisión personalizados en compras","w":"Introducing bulk upload of custom emission factors for the purchases category.\nInstead of entering each emission factor one by one, simply upload a CSV or Excel file with all your data and the system will import it automatically.\nYou can also register purchases in bulk using your own custom emission factors, choosing the calculation method that best fits your needs.\nPublished news for users as well","a":"Diego Acuña"},{"i":130,"d":"13-03","c":"WEB","t":"Sección de eventos en la web","w":"We need to show what makes us different, and at events, we are too.\nWe now have our own events section on the website!\nI've added AECOC and Corresponsables for now!!! I'll keep adding past events, but from now on you can all add new ones after attending, just with some context and a few photos","a":"Cristina Alcalá-Zamora"},{"i":131,"d":"13-03","c":"SKILL","t":"Skills del repo go-to-market arregladas","w":"I've fixed all skills of the repo go-to-market. Now you can use them!","a":"Luis Escámez"},{"i":132,"d":"15-03","c":"INIT","t":"Diagnóstico de deals perdidos por mala cualificación","w":"Time is the one thing that doesn't scale. And when you spend it in the wrong place, it doesn't come back.\nIn sales this has a name: 38% of our lost deals were opportunities that should never have made it past the first meeting. Ghosting and zero real pain. Hundreds of hours spent trying to convince people who were never going to buy.\nToday we're launching /quali.…","a":"Jacobo Umbert"},{"i":133,"d":"16-03","c":"SKILL","t":"/new-webinar: landing completa de webinar en 4 idiomas","w":"Nueva skill disponible: /new-webinar\nAutomatiza la creación de una landing page completa para webinars en los 4 idiomas, con formulario de registro, preview en la lista de webinars y popup en la home.\nCómo funciona\nRecoge los datos del webinar — título, descripción SEO, fecha, speakers, duración, HubSpot form ID, ID de YouTube, imagen, tags y categoría.…","a":"Cristina Alcalá-Zamora"},{"i":134,"d":"17-03","c":"PROD","t":"ISOs reales en Dcycle: riesgos, no conformidades y acciones correctivas","w":"Keeping up with Dcycle's rhythm is hard, so let's make it easy!\nThis Tip banner will help you and our clients to know more about Dcycle","a":"Luis Escámez"},{"i":135,"d":"17-03","c":"PROD","t":"The Wiki: un \"read.me\" por empresa dentro de Dcycle","w":"Quick one: we shipped a new fx, 'The Wiki'.\nEvery company gets a plain-text \"read.me\" file inside Dcycle. A single place to pin the stuff people keep asking about: who's the admin, what's this year's CCF, where do I find the supplier list, what did we decide about X.…","a":"Juanjo Mestre"},{"i":136,"d":"17-03","c":"PROD","t":"Datos personalizados en proyectos EINF","w":"CUSTOM DATA in EINF PROJECTS\nNow you can add any data in any section of the report.\nCustomized and Flexible. Digitalised and Accessible.\nImportant to select \"Include\" in the report to get it there!\nel equipo\ngo tell Dynasol and company!\nNoticia\nNews\nThis development unblocks applying same feature in Custom Projects in the future. Stay tuned!","a":"Ricardo Méndez Escobar"},{"i":137,"d":"17-03","c":"PROD","t":"Frameworks activables por organización desde el admin","w":"Small step towards the future of Dcycle\nFrameworks can now be activated per organization from the Admin panel — only visible to Dcycle users, not clients.\nWhy did we do this?\n\"You'll know every project you can do in Dcycle. You pay to use them.\"\nExample story:\nMichel closes a deal (e.g. EINF + Carbon Footprint)\nDaniel Sáenz de Tejada creates the account & activates the frameworks → client can create projects from day 1…","a":"Ricardo Méndez Escobar"},{"i":138,"d":"17-03","c":"PROD","t":"Mejoras de rendimiento en la descarga de Scope 1 y 2","w":"Performance improvements — Scope 1 & 2 download\nAs we continue consolidating the app experience, we're working on focused performance improvement packages that significantly reduce data upload times, data download times, Excel exports, and more.…","a":"Iñigo Medina"},{"i":139,"d":"17-03","c":"SKILL","t":"/dcycle-perfiles y otras dos skills de GTM","w":"3 new skills ready\nThree new workflows available from today:\n/dcycle-perfiles — Drop company names → get a full call-ready briefing pulled from HubSpot + web + LinkedIn + Einforma. Saves directly as a HubSpot note. No manual research.\n/discovery-notes-dcycle — Drop a HubSpot URL → get a structured discovery note (Context, BANT + urgency 1–5, key quote, next steps, qualification gaps). Saves directly to the contact/company.…","a":"Paula Serrats"},{"i":140,"d":"18-03","c":"PROD","t":"Mover varias facturas entre instalaciones a la vez","w":"move multiple invoices between facilities\nIt all started with a client who accidentally uploaded invoices to the wrong facility. Instead of having to delete them one by one and re-upload everything from scratch, we built a better way.\nYou can now select multiple invoices at once and move them all to another facility in a single step. Available for electricity, combustion, vehicle recharges, processes, and water categories.…","a":"Cristina Marín"},{"i":141,"d":"18-03","c":"PROD","t":"OCR de facturas de gases refrigerantes","w":"New OCR for refrigerant invoices\nNo more handmade invoices for refrigerants and recharges of gases!\nUpload your pdfs to My Files, review the data extracted and assign it to a facility, just like any other invoice!\nAll the refrigerant gases listed in the manual invoice creation are available to the OCR\nAny new gas need to be requested and added to the database","a":"Diego Ramírez"},{"i":142,"d":"18-03","c":"SKILL","t":"Outbound Engine: ciclo completo de cold email","w":"Nuevo skill disponible: Outbound Engine\nYa está en el repo go-to-market el skill que automatiza el ciclo completo de secuencias de cold email:\n→ Envío vía Gmail API con warm-up progresivo\n→ Tracking automático en HubSpot\n→ Clasificación de respuestas (interested, OOO, opt-out, referral…)\n→ Compliance GDPR (suppression checks + List-Unsubscribe)…","a":"Graciel"},{"i":143,"d":"18-03","c":"SKILL","t":"/esg-quote-extractor","w":"Yours truly, the tech novice, with the help of a few tech cowboys (including Gandalf), has created a skill called /esg-quote-extractor.\nThe aim? Simple. To automate any interesting quotes that come up in conversations with clients, so we can get more context on the market situation.\nAll messages will go straight to <#C0477SF54TV|clients>. You can now find the skill on GitHub to download it to your local repository.…","a":"Santiago Rodríguez Sánchez-Paulete"},{"i":144,"d":"18-03","c":"SKILL","t":"Directorio de skills de Claude Code en un Canvas","w":"_Directorio de Skills de Claude Code — todo en un Canvas_Como dijo Lu: \"Am I the only one who can't keep track with all the product news? TOO MANY!!\" — pues ya no hay excusa He recopilado todas las skills y comandos CLI que habéis ido publicando aquí en una tabla única: skill, qué hace, área, owner, repo y fecha.…","a":"Alba Ortiz"},{"i":145,"d":"18-03","c":"WEB","t":"Posicionamiento por tamaño de empresa","w":"Website update: company size positioning in website\nUpdated how we present company sizes across the website to better reflect our growth direction toward bigger/enterprise clients:\nWhy: If we plan to actively grow toward larger enterprise clients (3,000+ employees), the order of the company we want to serve is relevant: putting Startups & SMEs first sent the wrong signal.…","a":"Álvaro San Pedro"},{"i":146,"d":"19-03","c":"PROD","t":"Proyectos LCA en vivo (66 orgs con proyecto creado automáticamente)","w":"LCA Projects are live\nOne more step towards a Multi-project Dcycle\nAll 66 orgs with LCA data now have a dedicated LCA project created automatically.\nWork happens there fro
